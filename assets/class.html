          // Ink outlives the tab, so clearing destroys saved work — ask first.
          if (!confirm('Erase everything you have written on this slide?')) return
          strokes[n] = []
          saveInk(n)
          syncInk()
        })

        // Colour swatches and the eraser toggle. Each stroke stores its own
        // colour, so switching never recolours existing ink. Picking a colour
        // also leaves erase mode — you reached for a colour to draw.
        var swatchWrap = document.getElementById('swatches')
        function setErase(on) {
          eraseMode = on
          document.getElementById('erase').classList.toggle('active', on)
          ink.classList.toggle('erasing', on)
        }
        function setColor(c) {
          inkColor = c
          ;[].forEach.call(swatchWrap.querySelectorAll('.swatch'), function (b) {
            b.classList.toggle('active', b.getAttribute('data-color') === c)
          })
          if (eraseMode) setErase(false)
        }
        swatchWrap.addEventListener('click', function (e) {
          var b = e.target.closest && e.target.closest('.swatch')
          if (b) setColor(b.getAttribute('data-color'))
        })
        document.getElementById('erase').addEventListener('click', function () { setErase(!eraseMode) })
        setColor(PEN_COLOR)   // mark the default swatch active

        // ✎ Draw: arm the canvas so the podium mouse can draw. Arming covers
        // the slide (that is what makes mouse drawing possible at all), so it
        // and the laser are mutually exclusive modes you toggle out of.
        var drawBtn = document.getElementById('draw')
        function setArmed(on) {
          mouseDraw = on
          if (on) setLaser(false)
          drawBtn.classList.toggle('active', on)
          ink.classList.toggle('armed', on)
          syncInk()
        }
        drawBtn.addEventListener('click', function () { setArmed(!mouseDraw) })

        window.addEventListener('resize', function () {
          stageRect = null            // the cached measurement is now stale
          if (inkEnabled()) redrawInk()
        })
        // Rotating an iPad fires resize, but Safari can report the old size if
        // asked too early, so drop the cache again on the orientation event.
        window.addEventListener('orientationchange', function () { stageRect = null })

        /* --- laser pointer -------------------------------------------------
           A glowing dot with a short comet tail that fades, for pointing at
           things during class. Purely local and ephemeral: the player is
           static (nothing to sync), and the projector is the shared surface —
           the room sees the dot because the room sees the screen. Follows any
           pointer: the podium mouse, a Pencil, a finger. Toggle with the bar
           button or L; Esc leaves. Never persisted. */
        var laser = document.getElementById('laser')
        var laserCtx = laser.getContext('2d')
        var laserBtn = document.getElementById('laser-btn')
        var laserOn = false
        var laserTrail = []       // {x, y, t} normalized, newest last
        var laserPos = null       // where the dot is right now (null: pointer left)
        var laserRAF = null
        var LASER_FADE = 450      // tail lifetime, ms

        function setLaser(on) {
          laserOn = on
          if (on) setArmed(false)
          laserBtn.classList.toggle('active', on)
          stage.classList.toggle('laser-on', on)
          laserTrail.length = 0
          laserPos = null
          ensureLaserLoop()       // runs at least once, to clear the canvas
        }
        laserBtn.addEventListener('click', function () { setLaser(!laserOn) })

        function laserTrack(e) {
          var p = point(e)
          laserPos = p
          var last = laserTrail[laserTrail.length - 1]
          if (!last || farEnough(p, [last.x, last.y])) {
            laserTrail.push({ x: p[0], y: p[1], t: performance.now() })
            if (laserTrail.length > 80) laserTrail.shift()
          }
          ensureLaserLoop()
        }

        function ensureLaserLoop() {
          if (laserRAF == null) laserRAF = requestAnimationFrame(laserLoop)
        }
        function laserLoop() {
          laserRAF = null
          sizeCanvas(laser, laserCtx)
          var r = rect()
          var now = performance.now()
          laserCtx.clearRect(0, 0, r.width, r.height)
          while (laserTrail.length && now - laserTrail[0].t > LASER_FADE) laserTrail.shift()
          // The tail: each segment fades and thins with age.
          for (var i = 1; i < laserTrail.length; i++) {
            var a = laserTrail[i - 1], b = laserTrail[i]
            var age = Math.max(0, (now - b.t) / LASER_FADE)
            laserCtx.strokeStyle = 'rgba(255,60,50,' + (0.38 * (1 - age)).toFixed(3) + ')'
            laserCtx.lineWidth = r.height * 0.008 * (1 - 0.6 * age)
            laserCtx.beginPath()
            laserCtx.moveTo(a.x * r.width, a.y * r.height)
            laserCtx.lineTo(b.x * r.width, b.y * r.height)
            laserCtx.stroke()
          }
          // The dot: a soft glow around a hard core, like the real thing.
          if (laserOn && laserPos) {
            var x = laserPos[0] * r.width, y = laserPos[1] * r.height
            var R = r.height * 0.011
            var g = laserCtx.createRadialGradient(x, y, 0, x, y, R * 3)
            g.addColorStop(0, 'rgba(255,80,60,.5)')
            g.addColorStop(1, 'rgba(255,80,60,0)')
            laserCtx.fillStyle = g
            laserCtx.beginPath(); laserCtx.arc(x, y, R * 3, 0, Math.PI * 2); laserCtx.fill()
            laserCtx.fillStyle = '#ff2d1e'
            laserCtx.beginPath(); laserCtx.arc(x, y, R, 0, Math.PI * 2); laserCtx.fill()
            laserCtx.fillStyle = 'rgba(255,205,195,.9)'
            laserCtx.beginPath(); laserCtx.arc(x, y, R * 0.42, 0, Math.PI * 2); laserCtx.fill()
          }
          if (laserOn || laserTrail.length) ensureLaserLoop()
        }

        window.addEventListener('hashchange', render)
        document.getElementById('prev').addEventListener('click', function () { go(currentIndex() - 1) })
        document.getElementById('next').addEventListener('click', function () { go(currentIndex() + 1) })
        document.addEventListener('keydown', function (e) {
          if (e.metaKey || e.ctrlKey || e.altKey) return
          if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(currentIndex() + 1) }
          else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(currentIndex() - 1) }
          else if (e.key === 'Home') { e.preventDefault(); go(1) }
          else if (e.key === 'End') { e.preventDefault(); go(deck ? deck.slides.length : 1) }
          else if (e.key === 'd' || e.key === 'D') { setArmed(!mouseDraw) }
          else if (e.key === 'l' || e.key === 'L') { setLaser(!laserOn) }
          else if (e.key === 'e' || e.key === 'E') { setErase(!eraseMode) }
          else if (e.key === 'Escape') { setArmed(false); setLaser(false); setErase(false) }
        })

        /* --- contents ------------------------------------------------------
           Opened with no ?deck, the player lists the decks instead of showing
           an error. The list comes from decks/index.json (written by
           scripts/make_deck_index.py) because a static host — which is what
           this is, deployed — cannot list a directory.

           Every link inherits the flags THIS page was opened with, so
           class.html?student is one bookmark that leads only to student views,
           and ?notes likewise. That is also why the links are built from the
           current params rather than hard-coded. */
        function showContents() {
          document.body.classList.add('contents')
          var el = document.getElementById('contents')
          document.title = 'ENGS 28 — Class decks'

          var carry = []
          if (studentView) carry.push('student')
          if (params.has('notes')) carry.push('notes')
          var suffix = carry.length ? '&' + carry.join('&') : ''

          fetch('decks/index.json', FETCH_OPTS)
            .then(function (r) { if (!r.ok) throw new Error('no decks/index.json (' + r.status + ')'); return r.json() })
            .then(function (index) {
              var parts = ['<h1>ENGS 28 — Class decks</h1>']
              // One audience switch for the whole page, rather than a link per
              // row: thirteen of those fragmented the list and made the decks
              // themselves harder to scan, which is the one thing this page is
              // for. Switching re-renders every link below.
              parts.push('<p class="lede">' +
                (studentView
                  ? 'Student view — instructor-only slides are dropped.'
                  : 'Instructor view — every slide, including instructor-only ones.') +
                // Keep ?notes across the switch: losing it silently would look
                // like the notes flag had stopped working.
                ' <a class="swap" href="class.html' +
                (studentView
                  ? (params.has('notes') ? '?notes' : '')
                  : '?student' + (params.has('notes') ? '&notes' : '')) + '">' +
                (studentView ? 'Switch to instructor view' : 'Switch to student view') +
                '</a></p><ol>')
              index.decks.forEach(function (d) {
                var href = 'class.html?deck=' + encodeURIComponent(d.id) + suffix
                parts.push('<li class="' + d.kind + '">')
                parts.push('<a class="deck" href="' + href + '">')
                if (d.label) parts.push('<span class="day">' + esc(d.label) + '</span>')
                parts.push('<span class="name">' + esc(d.name) + '</span>')
                if (d.kind === 'video') parts.push('<span class="badge">video</span>')
                parts.push('<span class="count">' + d.slides + ' slides</span>')
                parts.push('</a></li>')
              })
              parts.push('</ol>')
              parts.push('<p class="foot">' + (studentView
                ? 'Arrow keys or space to move through a deck.'
                : 'Arrow keys or space to move; <b>L</b> laser, <b>D</b> draw with the mouse, ' +
                  '<b>E</b> erase. Add <code>&amp;notes</code> to any deck for presenter notes.') +
                '</p>')
              el.innerHTML = parts.join('')
            })
            .catch(function (e) {
              // The fix differs by where this is running, and the wrong advice
              // wastes real time: locally the index just needs generating,
              // deployed it needs to be built and shipped.
              el.innerHTML = '<h1>ENGS 28 — Class decks</h1><p class="lede">' +
                'Could not load the deck list (' + esc(e.message) + '). ' +
                (LOCAL
                  ? 'Generate it with <code>python3 scripts/make_deck_index.py</code>, ' +
                    'or open a deck directly with <code>?deck=day1</code>.'
                  : 'This site may predate the contents page — it appears after the ' +
                    'next deploy. A deck still opens directly with <code>?deck=day1</code>.') +
                '</p>'
            })
        }

        if (!deckId) { showContents(); return }
        fetch('decks/' + encodeURIComponent(deckId) + '.json', FETCH_OPTS)
          .then(function (r) { if (!r.ok) throw new Error('no deck "' + deckId + '" (' + r.status + ')'); return r.json() })
          .then(function (d) {
            deck = d
            if (!deck.slides || !deck.slides.length) throw new Error('deck has no slides')
            // Annotation keys by the slide's position in the FULL deck,
            // assigned before the student filter below — see inkKey().
            deck.slides.forEach(function (s, i) { s._ink = i + 1 })
            // Student view drops instructor-only slides. NOTE: this hides them
            // from the VIEW only — the content still lives in the built book page
            // source. A truly solutions-free student build must strip them at
            // build time; do that before publishing a deck to students.
            if (studentView) deck.slides = deck.slides.filter(function (s) { return !s.instructor })
            if (!deck.slides.length) throw new Error('this deck has no student slides')
            document.title = 'ENGS 28 — ' + (deck.title || deckId) + (studentView ? ' (student)' : '')
            if (!location.hash) location.hash = '1'
            render()
          })
          .catch(function (e) { fail('Could not load this deck. ' + e.message) })

        /* --- authoring: alt-click a slide to reach its source --------------
           Ported from the ENGS 20 deck player, but the mechanism had to change.
           There, a 'ref' slide is an IFRAME of the book page, so ptx-edit.js
           loads inside it and handles the book half for free. Here the player
           EXTRACTS and clones the markup inline (renderRef above), so there is
           no frame for ptx-edit.js to live in — which is why renderRef stamps
           data-edit-origin onto the nodes as it clones them, and why this layer
           reads that stamp to decide where a write would land:

             glue slide          -> the deck's JSON entry
             <slide> block text  -> source/*.ptx, via the same /locate + /patch
                                    the book uses, scoped to the slide's xml:id
             direct book ref     -> REFUSED for editing (it would change the
                                    reading too); Alt-click still opens it

           Local-only and self-effacing, exactly like the book's version: it
           wires nothing up unless the edit-server (127.0.0.1:8927, started by
           ./preview-slides.sh) actually answers, so it never appears for a
           student, on the deployed deck, or in a plain non-authoring preview. */
        ;(function () {
          if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return
          var EDIT_SERVER = 'http://127.0.0.1:8927'

          // Blocks holding prose worth editing. A click bubbles up until it
          // reaches one. .slide-caption and .deck-slide-note are divs of bare
          // text (the XSL emits no <p> inside them), so they are listed in
          // their own right rather than being found via a paragraph.
          var BLOCKS = '.slide-caption, .deck-slide-note, .para, li, p, figcaption, td, th'

          var editing = null

          function toast (message, kind) {
            var existing = document.getElementById('deck-edit-toast')
            if (existing) existing.remove()
            var node = document.createElement('div')
            node.id = 'deck-edit-toast'
            node.className = 'deck-edit-toast deck-edit-toast-' + (kind || 'info')
            node.textContent = message
            document.body.appendChild(node)
            setTimeout(function () { if (node.parentNode) node.remove() },
                       kind === 'error' ? 6000 : 2800)
          }

          function describe (error) {
            return (error instanceof TypeError)
              ? 'Edit server not running — start it with ./preview-slides.sh'
              : error.message
          }
          function asJson (response) {
            return response.json().then(function (body) {
              if (!response.ok) throw new Error(body.error || 'request failed')
              return body
            })
          }

          function currentSlide () {
            return deck && deck.slides ? deck.slides[currentIndex() - 1] : null
          }
          // The slide's index in the deck FILE. Assigned before the ?student
          // filter drops instructor-only slides, so it stays correct in either
          // view — the runtime index does not.
          function jsonIndex (slide) { return slide._ink }

          function textFor (block) {
            return (block.innerText || block.textContent || '').replace(/\s+/g, ' ').trim()
          }

          // --- Alt-click: open the right source ---------------------------
          function openDeckEntry (slide) {
            fetch(EDIT_SERVER + '/open-deck?deck=' + encodeURIComponent(deckId) +
                  '&slide=' + jsonIndex(slide))
              .then(asJson)
              .then(function (b) { toast('Opened ' + b.file + ':' + b.line, 'ok') })
              .catch(function (e) { toast(describe(e), 'error') })
          }
          function openSlideBlock (xmlId, what) {
            fetch(EDIT_SERVER + '/open-slide?id=' + encodeURIComponent(xmlId))
              .then(asJson)
              .then(function (b) { toast('Opened ' + (what || b.tag) + ' — ' + b.file + ':' + b.line, 'ok') })
              .catch(function (e) { toast(describe(e), 'error') })
          }

          /* Open the source of book content shown on a slide, as precisely as
             the click allows: the exact paragraph or task if one was clicked
             (/locate matches its text), otherwise the whole element by id. The
             fallback matters for a figure or a table, where the click may land
             on something with no prose to match on. */
          function openBookSource (block, bookId, slide) {
            var text = block ? textFor(block) : ''
            if (!text) { openSlideBlock(bookId, 'book content'); return }
            fetch(EDIT_SERVER + '/locate?open=1' +
                  '&text=' + encodeURIComponent(text) +
                  '&id=' + encodeURIComponent(bookId))
              .then(function (r) { if (!r.ok) throw new Error('no match'); return r.json() })
              .then(function (b) { toast('Opened ' + b.file + ':' + b.line, 'ok') })
              .catch(function () { openSlideBlock(bookId, 'book content') })
          }

          function openSource (target, slide) {
            // A ref slide's TITLE is deck glue, not book content: it is the
            // one bit of a ref slide written in the JSON.
            if (slide.type !== 'ref' || target.closest('.deck-title')) {
              return openDeckEntry(slide)
            }
            var origin = target.closest('[data-edit-origin]')
            var kind = origin && origin.getAttribute('data-edit-origin')
            if (kind === 'book' || kind === 'book-direct') {
              // Opening is always safe — it only points an editor at a file.
              return openSlideBlock(origin.getAttribute('data-edit-id'), 'book content')
            }
            openSlideBlock(slide.slide, 'slide block')
          }

          /* --- Alt-shift-click: edit in place -----------------------------
             Ask the server whether this block can be rewritten BEFORE opening
             it, so nobody is invited to type into text that could never be
             saved (a slide holding math, an <xref>, or a <sim>). Same check
             the book editing uses — see edit_status in scripts/edit-server.py. */
          function requestEdit (block, hintId) {
            if (editing) return
            editing = block   // claim it now, so a second click can't race
            var url = EDIT_SERVER + '/locate' +
              '?text=' + encodeURIComponent(textFor(block)) +
              '&id=' + encodeURIComponent(hintId)
            fetch(url).then(asJson)
              .then(function (b) {
                if (b.editable) { beginEdit(block, hintId); return }
                editing = null
                toast('Can’t edit here — ' + b.blocked + '. Opening ' +
                      b.file + ':' + b.line + ' in your editor.', 'info')
                fetch(url + '&open=1').catch(function () {})
              })
              .catch(function (e) { editing = null; toast(describe(e), 'error') })
          }

          // Hand back text a failed save would otherwise discard. The clipboard
          // needs permission and can refuse, so the console is the fallback
          // that always works; the caller is told which happened.
          function keepText (text, done) {
            console.log('[deck] unsaved text:\n' + text)
            try {
              navigator.clipboard.writeText(text)
                .then(function () { done(true) })
                .catch(function () { done(false) })
            } catch (e) { done(false) }
          }

          function beginEdit (block, hintId) {
            var original = textFor(block)
            var originalHTML = block.innerHTML
            // Captured now: the save resolves later, by which time the author
            // may have paged on to a slide from a different book page.
            var fromPage = (currentSlide() || {}).page
            editing = block
            block.classList.add('deck-edit-active')
            block.setAttribute('contenteditable', 'plaintext-only')
            // Nothing opened here contains inline markup — the server refuses
            // those up front and sends you to the file. An earlier version
            // opened them with the <clr>/<c> spans set contenteditable=false,
            // but retyping a selection deletes those spans outright, so the
            // guard failed exactly when a whole bullet had been reworded.
            block.focus()

            function finish (save) {
              if (editing !== block) return
              editing = null
              block.removeAttribute('contenteditable')
              block.classList.remove('deck-edit-active')
              block.removeEventListener('keydown', onKey)
              block.removeEventListener('blur', onBlur)

              var updated = textFor(block)
              if (!save || updated === original) { block.innerHTML = originalHTML; return }
              fetch(EDIT_SERVER + '/patch', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: original, newText: updated, id: hintId })
              })
                .then(asJson)
                .then(function (b) {
                  // The built page this slide was extracted from is now stale.
                  // Drop it so navigating back re-reads the rebuilt copy
                  // instead of silently showing the pre-edit text again.
                  delete pageCache[fromPage]
                  toast('Saved to ' + b.file + ':' + b.line, 'ok')
                })
                .catch(function (error) {
                  // The source is the truth, so the slide must go back. The
                  // wording someone just spent minutes on is not the source's
                  // to throw away though: copy it out BEFORE reverting, and
                  // open the file, so the work survives as a paste.
                  keepText(updated, function (kept) {
                    block.innerHTML = originalHTML
                    toast(describe(error) +
                          (kept ? ' Your text is on the clipboard.' : ' Your text is in the console.') +
                          ' Opening the file.', 'error')
                    fetch(EDIT_SERVER + '/locate?open=1' +
                          '&text=' + encodeURIComponent(original) +
                          '&id=' + encodeURIComponent(hintId)).catch(function () {})
                  })
                })
            }
            function onKey (event) {
              if (event.key === 'Escape') { event.preventDefault(); event.stopPropagation(); finish(false) }
              else if (event.key === 'Enter' && (event.metaKey || event.ctrlKey)) {
                event.preventDefault(); event.stopPropagation(); finish(true)
              } else if (event.key === 'Enter') {
                event.preventDefault()   // one block is one paragraph
              } else {
                event.stopPropagation()  // don't let typing drive the deck
              }
            }
            function onBlur () { finish(true) }
            block.addEventListener('keydown', onKey)
            block.addEventListener('blur', onBlur)
            toast('Editing — click out or ⌘⏎ saves, esc cancels', 'info')
          }
          function editHere (target, slide) {
            if (slide.type !== 'ref' || target.closest('.deck-title')) {
              return openSlideForm(slide)
            }
            var origin = target.closest('[data-edit-origin]')
            var kind = origin && origin.getAttribute('data-edit-origin')
            if (kind === 'book' || kind === 'book-direct') {
              /* Book content behind a direct ref: not editable from here, for
                 the same reason as everything else this refuses — it would
                 change the reading, not just the slide.

                 It OPENS the file rather than telling you to go and Alt-click
                 it yourself. Being refused and being handed the file are the
                 same moment, and the pre-flight path below has always done it
                 that way; leaving this one branch to only talk made the tool
                 look like it behaved differently on different slides. */
              var refused = target.closest(BLOCKS)
              toast('Book content (' + origin.getAttribute('data-edit-id') +
                    ') — editing it here would change the reading too. ' +
                    'Opening it in your editor.', 'info')
              openBookSource(refused, origin.getAttribute('data-edit-id'), slide)
              return
            }
            var block = target.closest(BLOCKS)
            if (!block || !refEl.contains(block)) {
              toast('Nothing editable there. Alt-shift-click a bullet, a caption, ' +
                    'or the title bar.', 'info')
              return
            }
            requestEdit(block, origin ? origin.getAttribute('data-edit-id') : slide.slide)
          }

          // --- the glue form (alt-shift-click a glue slide) ----------------
          // Display order per type; [key, label, kind] where kind is how the
          // field reads and writes: text = one line, area = multi-line string,
          // lines = textarea <-> array of strings.
          var NOTE_FIELD = ['presenterNote', 'Presenter note (never projected)', 'area']
          var BULLETS = ['items', 'Bullets (one per line)', 'lines']
          var FORM = {
            title:   [['title', 'Title', 'text'], ['subtitle', 'Subtitle', 'text'], NOTE_FIELD],
            section: [['kicker', 'Kicker (e.g. "Part 1")', 'text'], ['title', 'Title', 'text'], NOTE_FIELD],
            agenda:  [['title', 'Title', 'text'], BULLETS, NOTE_FIELD],
            recap:   [['title', 'Title', 'text'], BULLETS, NOTE_FIELD],
            notice:  [['title', 'Title', 'text'], BULLETS, NOTE_FIELD],
            prompt:  [['title', 'Title', 'text'], ['body', 'Body', 'area'],
                      ['note', 'Note (shown on the slide)', 'area'], NOTE_FIELD],
            // A ref slide's own JSON fields. Its CONTENT lives in the book and
            // is edited in place, so it is deliberately not offered here.
            ref:     [['title', 'Slide title (deck JSON)', 'text'], NOTE_FIELD]
          }
          var slideeditEl = document.getElementById('slideedit')
          var seFields = document.getElementById('se-fields')
          var seType = document.getElementById('se-type')
          var seStatusEl = document.getElementById('se-status')
          var curForm = null

          function seStatus (message, kind) {
            seStatusEl.textContent = message || ''
            seStatusEl.className = kind || ''
          }
          function splitLines (v) {
            return v.split('\n').map(function (s) { return s.trim() })
                    .filter(function (s) { return s.length })
          }

          function openSlideForm (slide) {
            var spec = FORM[slide.type]
            if (!spec) { toast('This slide type has no form.', 'info'); return }
            /* Populate from the FILE, not from the deck this page loaded. They
               diverge the moment a deck is hand-edited in the editor — the
               player only reads a deck once, at page load — and a form filled
               from the stale copy would quietly write those old values back
               over the newer file when saved. The fingerprint that comes with
               it is checked on save, so even a change made while the form is
               open is caught rather than overwritten. */
            fetch(EDIT_SERVER + '/deck-slide?deck=' + encodeURIComponent(deckId) +
                  '&slide=' + jsonIndex(slide))
              .then(asJson)
              .then(function (b) { fillSlideForm(slide, spec, b.slide, b.fingerprint) })
              .catch(function (e) { toast(describe(e), 'error') })
          }

          function fillSlideForm (slide, spec, current, fingerprint) {
            curForm = { type: slide.type, src: slide, fingerprint: fingerprint }
            seType.textContent = slide.type
            seFields.innerHTML = ''
            // If the file disagrees with what is on screen, say so before any
            // typing happens — the slide behind the form is the old one.
            var drifted = spec.some(function (field) {
              return JSON.stringify(current[field[0]] == null ? '' : current[field[0]]) !==
                     JSON.stringify(slide[field[0]] == null ? '' : slide[field[0]])
            })
            if (drifted) {
              toast('This deck changed on disk since the page loaded — the form ' +
                    'shows the current file, which is not what the slide behind ' +
                    'it shows. Reload to bring them back together.', 'info')
            }
            spec.forEach(function (field) {
              var key = field[0], value = current[key], kind = field[2]
              var wrap = document.createElement('div')
              wrap.className = 'se-field'
              var label = document.createElement('label')
              label.textContent = field[1]
              wrap.appendChild(label)
              var input = document.createElement(kind === 'text' ? 'input' : 'textarea')
              if (kind === 'text') input.type = 'text'
              input.dataset.key = key
              input.dataset.kind = kind
              // Setting .value (never innerHTML) keeps any markup in the string
              // as literal text, so a bullet's <c>…</c> round-trips untouched.
              input.value = (kind === 'lines')
                ? [].concat(value == null ? [] : value).join('\n')
                : (value == null ? '' : String(value))
              wrap.appendChild(input)
              seFields.appendChild(wrap)
            })
            seStatus('')
            ink.classList.remove('armed')   // keep the canvas off the form
            slideeditEl.classList.add('on')
            var first = seFields.querySelector('input, textarea')
            if (first) first.focus()
          }

          function readSlideForm () {
            var fields = {}
            ;[].forEach.call(seFields.querySelectorAll('[data-key]'), function (el) {
              var key = el.dataset.key
              if (el.dataset.kind !== 'lines') { fields[key] = el.value; return }
              // Keep the value's original shape: items is always a list.
              var arr = splitLines(el.value)
              var wasArray = key === 'items' || Array.isArray(curForm.src[key])
              fields[key] = (wasArray || arr.length > 1) ? arr : (arr[0] || '')
            })
            return fields
          }

          function saveSlideForm () {
            if (!curForm) return
            var fields = readSlideForm()
            seStatus('Saving…')
            fetch(EDIT_SERVER + '/patch-deck', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                deck: deckId,
                slide: jsonIndex(curForm.src),
                // Both are refusals-not-overwrites: `type` catches this
                // position becoming a different KIND of slide, `fingerprint`
                // catches any edit to it since the form was opened.
                type: curForm.type,
                fingerprint: curForm.fingerprint,
                fields: fields
              })
            })
              .then(asJson)
              .then(function (b) {
                // Mirror into the in-memory deck so the slide shows the edit
                // at once, without waiting on a rebuild.
                Object.keys(fields).forEach(function (k) {
                  var v = fields[k]
                  if (v === '' || v === null || (Array.isArray(v) && !v.length)) delete curForm.src[k]
                  else curForm.src[k] = v
                })
                seStatus('Saved to ' + b.file + ':' + b.line, 'ok')
                render()
                setTimeout(closeSlideForm, 700)
              })
              .catch(function (e) {
                // The form stays open with the typing intact — this is the
                // recoverable case, and closing it would throw away the very
                // words the refusal was protecting.
                seStatus(describe(e), 'err')
              })
          }

          function closeSlideForm () {
            slideeditEl.classList.remove('on')
            curForm = null
            syncInk()
          }
          document.getElementById('se-save').addEventListener('click', saveSlideForm)
          document.getElementById('se-cancel').addEventListener('click', closeSlideForm)

          /* Probe first: only wire up the affordance once the edit-server has
             answered, so nothing shows when authoring isn't actually running (a
             plain in-browser preview on localhost, say). A bare GET is a simple
             cross-origin request — no CORS preflight — and the 404 it returns
             still RESOLVES the promise; only a real network error (nothing
             listening at all) rejects and leaves us inert. */
          fetch(EDIT_SERVER + '/open-slide').then(function () {
            document.addEventListener('keydown', function (e) {
              if (e.key === 'Alt') document.body.classList.add('deck-edit-armed')
            })
            document.addEventListener('keyup', function (e) {
              if (e.key === 'Alt') document.body.classList.remove('deck-edit-armed')
            })
            window.addEventListener('blur', function () {
              document.body.classList.remove('deck-edit-armed')
            })

            // Capture phase, so an alt-click is claimed for editing before any
            // control treats it as an ordinary click. (The pen layer only draws
            // for pen input, so a mouse alt-click never leaves a stroke.)
            document.addEventListener('click', function (e) {
              if (!e.altKey || editing) return
              if (e.target.closest('#bar, #slideedit, .deck-edit-toast')) return
              var slide = currentSlide()
              if (!slide) return
              e.preventDefault()
              e.stopPropagation()
              if (e.shiftKey) editHere(e.target, slide)
              else openSource(e.target, slide)
            }, true)

            // While the form is open it owns the keyboard, ahead of the deck's
            // own navigation handler.
            document.addEventListener('keydown', function (e) {
              if (!slideeditEl.classList.contains('on')) return
              if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); closeSlideForm() }
              else if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
                e.preventDefault(); e.stopPropagation(); saveSlideForm()
              } else {
                e.stopPropagation()   // typing must not page the deck
              }
            }, true)

            console.log('[deck] authoring enabled: alt-click opens source, ' +
                        'alt-shift-click edits. Local only.')
          }).catch(function () { /* edit-server not running: stay inert */ })
        })()
      })()
    </script>
  </body>
</html>

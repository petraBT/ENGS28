<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="460" viewBox="0 0 700 460" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" role="img">
  <title>Successive-approximation ADC (SAR ADC) block diagram</title>
  <desc>SAR ADC block diagram. The SAR 12-bit register drives a DAC via bit
  lines b11…b0. The DAC output enters the minus (−) input of the comparator.
  The analog input is frozen by Sample/Hold and enters the plus (+) input.
  The comparator result Vc feeds back to the SAR register each clock cycle.</desc>

  <!-- ══ SAR 12-bit register: x=155, y=18, w=310, h=70 ══════════════ -->
  <rect x="155" y="18" width="310" height="70" rx="6"
        fill="#c8e6c9" stroke="#388e3c" stroke-width="2"/>
  <text x="310" y="62" text-anchor="middle"
        font-size="20" font-weight="bold" fill="#1b5e20">SAR 12-bit register</text>

  <!-- Clock → SAR left edge at y=53                                    -->
  <!-- Label uses text-anchor="start" at x=5 so "Clock" is never clipped -->
  <line x1="90" y1="53" x2="149" y2="53" stroke="#333" stroke-width="2"/>
  <polygon points="147,49 157,53 147,57" fill="#333"/>
  <text x="5" y="57" text-anchor="start" font-size="16" fill="#333">Clock</text>

  <!-- ══ Bit lines: SAR bottom (y=88) → DAC top (y=172) ═════════════ -->
  <!-- DAC spans x=140 to x=400; all x values stay inside that range   -->
  <!-- Labels sit to the LEFT of each line with a 5 px gap             -->

  <!-- b11 at x=215; label ends ~x=209 -->
  <line x1="215" y1="88" x2="215" y2="172" stroke="#555" stroke-width="1.6"/>
  <polygon points="212,169 215,180 218,169" fill="#555"/>
  <text x="191" y="133" font-size="14" fill="#444" font-style="italic">b</text>
  <text x="200" y="136" font-size="10" fill="#444">11</text>

  <!-- ellipsis (no line) -->
  <text x="305" y="133" text-anchor="middle" font-size="20" fill="#888">···</text>

  <!-- b1 at x=348; label ends ~x=342 -->
  <line x1="348" y1="88" x2="348" y2="172" stroke="#555" stroke-width="1.6"/>
  <polygon points="345,169 348,180 351,169" fill="#555"/>
  <text x="327" y="133" font-size="14" fill="#444" font-style="italic">b</text>
  <text x="336" y="136" font-size="10" fill="#444">1</text>

  <!-- b0 at x=378; label ends ~x=372 -->
  <line x1="378" y1="88" x2="378" y2="172" stroke="#555" stroke-width="1.6"/>
  <polygon points="375,169 378,180 381,169" fill="#555"/>
  <text x="357" y="133" font-size="14" fill="#444" font-style="italic">b</text>
  <text x="366" y="136" font-size="10" fill="#444">0</text>

  <!-- ══ DAC: x=140, y=172, w=260, h=80; center y=212 ════════════════ -->
  <rect x="140" y="172" width="260" height="80" rx="6"
        fill="#c5cae9" stroke="#3949ab" stroke-width="2"/>
  <text x="270" y="205" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#1a237e">Digital to Analog</text>
  <text x="270" y="228" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#1a237e">(DAC)</text>

  <!-- Vref → DAC left edge at y=212 -->
  <line x1="38" y1="212" x2="134" y2="212" stroke="#333" stroke-width="2"/>
  <polygon points="132,208 142,212 132,216" fill="#333"/>
  <text x="5" y="207" text-anchor="start" font-size="16" fill="#333"
        font-style="italic">V</text>
  <text x="15" y="210" font-size="11" fill="#333">ref</text>

  <!-- DAC output → comparator − input: HORIZONTAL at y=212 -->
  <line x1="400" y1="212" x2="498" y2="212" stroke="#333" stroke-width="2"/>

  <!-- ══ Sample / Hold: x=155, y=310, w=200, h=80; center y=350 ══════ -->
  <rect x="155" y="310" width="200" height="80" rx="6"
        fill="#ffcdd2" stroke="#c62828" stroke-width="2"/>
  <text x="255" y="345" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#7f0000">Sample /</text>
  <text x="255" y="368" text-anchor="middle"
        font-size="17" font-weight="bold" fill="#7f0000">Hold</text>

  <!-- Vin (sine wave) then arrow → S/H left edge at x=155, y=350 -->
  <path d="M10,350 C15,335 20,335 25,350 C30,365 35,365 40,350 C45,335 50,335 55,350"
        fill="none" stroke="#333" stroke-width="2"/>
  <line x1="55" y1="350" x2="149" y2="350" stroke="#333" stroke-width="2"/>
  <polygon points="147,346 157,350 147,354" fill="#333"/>
  <text x="6"  y="378" font-size="15" fill="#333" font-style="italic">V</text>
  <text x="16" y="381" font-size="11" fill="#333">in</text>
  <text x="3"  y="396" font-size="12" fill="#666">(analog input)</text>

  <!-- S/H output → comparator + input: HORIZONTAL at y=350 -->
  <line x1="355" y1="350" x2="498" y2="350" stroke="#333" stroke-width="2"/>

  <!-- ══ Comparator triangle ═══════════════════════════════════════════ -->
  <!-- Base at x=498: top (498,200), bottom (498,362), tip (610,281)    -->
  <!-- DAC line enters at y=212 (− input, upper region)                  -->
  <!-- S/H line enters at y=350 (+ input, lower region)                  -->
  <polygon points="498,200 498,362 610,281"
           fill="#f8bbd0" stroke="#ad1457" stroke-width="2"/>

  <!-- − label: moved inward from top — well inside triangle at y=248   -->
  <!-- At y=248 the right boundary ≈ x=564, so x=508 has 56 px clearance -->
  <text x="508" y="248" font-size="21" fill="#880e4f" font-weight="bold">−</text>

  <!-- + label: moved inward from bottom — well inside triangle at y=338 -->
  <!-- At y=338 the right boundary ≈ x=531, so x=508 has 23 px clearance -->
  <text x="508" y="338" font-size="21" fill="#880e4f" font-weight="bold">+</text>

  <!-- Comparator subtitle -->
  <text x="554" y="385" text-anchor="middle" font-size="13" fill="#555">Analog input</text>
  <text x="554" y="400" text-anchor="middle" font-size="13" fill="#555">comparator</text>

  <!-- ══ Comparator output Vc and feedback ═════════════════════════════ -->
  <line x1="610" y1="281" x2="648" y2="281" stroke="#333" stroke-width="2"/>
  <text x="652" y="276" font-size="16" fill="#333" font-style="italic">V</text>
  <text x="663" y="279" font-size="12" fill="#333">c</text>

  <!-- Feedback: right → up → left → into SAR right edge at y=53 -->
  <line x1="648" y1="281" x2="676" y2="281" stroke="#333" stroke-width="2"/>
  <line x1="676" y1="281" x2="676" y2="53"  stroke="#333" stroke-width="2"/>
  <line x1="676" y1="53"  x2="471" y2="53"  stroke="#333" stroke-width="2"/>
  <polygon points="473,49 463,53 473,57" fill="#333"/>

</svg>

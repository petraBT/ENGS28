<?xml version="1.0" encoding="UTF-8"?>
<svg width="760" height="260" viewBox="0 0 760 260" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <title>I2C write transaction timing diagram</title>
  <desc>Two-line timing diagram (SCL and SDA) for a full I2C write transaction:
  idle, START condition, 7-bit address 0x70 plus R/W=0 (write), ACK from peripheral,
  8 data bits of 0xAA (= 0b10101010, MSB first), second ACK, STOP condition, idle.
  18 total clock cycles at 28 px/cycle. The START condition is SDA falling while SCL
  is HIGH; the STOP condition is SDA rising while SCL is HIGH. All other SDA
  transitions occur during SCL LOW periods.</desc>

  <!--
    Layout: viewBox 0 0 760 260
    Left label area: x=0..65
    Signal area: x=65..730; right margin x=730..760

    SCL HIGH = y=48,  SCL LOW = y=88
    SDA HIGH = y=150, SDA LOW = y=190
    Clock period = 28 px (14 px HIGH + 14 px LOW)

    Region x-boundaries:
      65  : idle start
      110 : START — SDA falls here (SCL still HIGH until x=130)
      130 : first SCL fall
      354 : end of address+R/W  (130 + 8×28 = 354)
      382 : end of ACK1          (354 + 28  = 382)
      606 : end of data byte     (382 + 8×28 = 606)
      620 : last SCL rise (ACK2 high phase)
      640 : STOP — SDA rises here (SCL HIGH since x=620)
      660 : idle resumes
      730 : signal end

    SCL: 18 falls at 130,158,186,214,242,270,298,326,354,382,410,438,466,494,522,550,578,606
         18 rises at 144,172,200,228,256,284,312,340,368,396,424,452,480,508,536,564,592,620
         then SCL stays HIGH through STOP and idle.

    SDA transitions (each ~5 px into the SCL LOW window):
      Address 0x70 = 0b1110000, R/W=0  → bits A6..A0,RW = 1,1,1,0,0,0,0,0
      Data    0xAA = 0b10101010         → bits D7..D0  = 1,0,1,0,1,0,1,0

      x=110 → fall  (START: SCL is HIGH)
      x=135 → rise  (A6=1, SCL LOW x=130..144)
      x=219 → fall  (A3=0, SCL LOW x=214..228; A5,A4 also 1 so no change until A3)
      x=387 → rise  (D7=1, SCL LOW x=382..396; A2,A1,A0,RW,ACK1 all LOW = no change)
      x=415 → fall  (D6=0, SCL LOW x=410..424)
      x=443 → rise  (D5=1, SCL LOW x=438..452)
      x=471 → fall  (D4=0, SCL LOW x=466..480)
      x=499 → rise  (D3=1, SCL LOW x=494..508)
      x=527 → fall  (D2=0, SCL LOW x=522..536)
      x=555 → rise  (D1=1, SCL LOW x=550..564)
      x=583 → fall  (D0=0, SCL LOW x=578..592; ACK2 also LOW so no extra transition)
      x=640 → rise  (STOP: SCL HIGH since x=620)
  -->

  <!-- ── Colored region backgrounds ── -->
  <rect x="110" y="18" width="20"  height="190" fill="#ffd0c0" opacity="0.70"/> <!-- START  -->
  <rect x="130" y="18" width="224" height="190" fill="#c8e0ff" opacity="0.45"/> <!-- address -->
  <rect x="354" y="18" width="28"  height="190" fill="#c0f0c0" opacity="0.55"/> <!-- ACK1   -->
  <rect x="382" y="18" width="224" height="190" fill="#ead8ff" opacity="0.45"/> <!-- data   -->
  <rect x="606" y="18" width="34"  height="190" fill="#c0f0c0" opacity="0.55"/> <!-- ACK2   -->
  <rect x="640" y="18" width="20"  height="190" fill="#ffd0c0" opacity="0.70"/> <!-- STOP   -->

  <!-- ── Dashed HIGH/LOW reference lines ── -->
  <line x1="63" y1="48"  x2="740" y2="48"  stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="63" y1="88"  x2="740" y2="88"  stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="63" y1="150" x2="740" y2="150" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>
  <line x1="63" y1="190" x2="740" y2="190" stroke="#ccc" stroke-width="0.5" stroke-dasharray="3,3"/>

  <!-- ── Vertical region dividers ── -->
  <line x1="110" y1="18" x2="110" y2="208" stroke="#e08060" stroke-width="1"   stroke-dasharray="3,2"/>
  <line x1="130" y1="18" x2="130" y2="208" stroke="#6080c0" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="354" y1="18" x2="354" y2="208" stroke="#40a040" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="382" y1="18" x2="382" y2="208" stroke="#8060b0" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="606" y1="18" x2="606" y2="208" stroke="#40a040" stroke-width="0.5" stroke-dasharray="3,2"/>
  <line x1="640" y1="18" x2="640" y2="208" stroke="#e08060" stroke-width="1"   stroke-dasharray="3,2"/>

  <!-- ════════════════════════════════════════════════════════
       SCL signal  (18 cycles, HIGH=y48, LOW=y88)
  ════════════════════════════════════════════════════════ -->
  <path d="M 65 48 L 130 48
    L 130 88 L 144 88 L 144 48 L 158 48
    L 158 88 L 172 88 L 172 48 L 186 48
    L 186 88 L 200 88 L 200 48 L 214 48
    L 214 88 L 228 88 L 228 48 L 242 48
    L 242 88 L 256 88 L 256 48 L 270 48
    L 270 88 L 284 88 L 284 48 L 298 48
    L 298 88 L 312 88 L 312 48 L 326 48
    L 326 88 L 340 88 L 340 48 L 354 48
    L 354 88 L 368 88 L 368 48 L 382 48
    L 382 88 L 396 88 L 396 48 L 410 48
    L 410 88 L 424 88 L 424 48 L 438 48
    L 438 88 L 452 88 L 452 48 L 466 48
    L 466 88 L 480 88 L 480 48 L 494 48
    L 494 88 L 508 88 L 508 48 L 522 48
    L 522 88 L 536 88 L 536 48 L 550 48
    L 550 88 L 564 88 L 564 48 L 578 48
    L 578 88 L 592 88 L 592 48 L 606 48
    L 606 88 L 620 88 L 620 48 L 730 48"
    stroke="#333" stroke-width="2" fill="none"/>

  <!-- ════════════════════════════════════════════════════════
       SDA signal  (HIGH=y150, LOW=y190)
  ════════════════════════════════════════════════════════ -->
  <path d="M 65 150 L 110 150
    L 110 190
    L 135 190 L 135 150
    L 219 150 L 219 190
    L 387 190 L 387 150
    L 415 150 L 415 190
    L 443 190 L 443 150
    L 471 150 L 471 190
    L 499 190 L 499 150
    L 527 150 L 527 190
    L 555 190 L 555 150
    L 583 150 L 583 190
    L 640 190
    L 640 150
    L 730 150"
    stroke="#1a4a8a" stroke-width="2.5" fill="none"/>

  <!-- ── Left-axis labels ── -->
  <text x="58" y="52"  text-anchor="end" font-size="9"  fill="#555">H</text>
  <text x="58" y="92"  text-anchor="end" font-size="9"  fill="#555">L</text>
  <text x="58" y="154" text-anchor="end" font-size="9"  fill="#555">H</text>
  <text x="58" y="194" text-anchor="end" font-size="9"  fill="#555">L</text>
  <text x="58" y="72"  text-anchor="end" font-size="12" font-weight="bold" fill="#333"    font-family="monospace">SCL</text>
  <text x="58" y="174" text-anchor="end" font-size="12" font-weight="bold" fill="#1a4a8a" font-family="monospace">SDA</text>

  <!-- ── Region labels (top row, y=14) ── -->
  <text x="87"  y="14" text-anchor="middle" font-size="9"  fill="#999">idle</text>
  <text x="120" y="14" text-anchor="middle" font-size="9"  font-weight="bold" fill="#c03000">START</text>
  <text x="242" y="14" text-anchor="middle" font-size="10" fill="#1a4a8a">7-bit address + R/W bit</text>
  <text x="368" y="14" text-anchor="middle" font-size="10" fill="#207020">ACK</text>
  <text x="494" y="14" text-anchor="middle" font-size="10" fill="#5a2a8a">data byte (0xAA = 10101010&#8322;)</text>
  <text x="623" y="14" text-anchor="middle" font-size="10" fill="#207020">ACK</text>
  <text x="650" y="14" text-anchor="middle" font-size="9"  font-weight="bold" fill="#c03000">STOP</text>
  <text x="695" y="14" text-anchor="middle" font-size="9"  fill="#999">idle</text>

  <!-- ── START annotation ── -->
  <line x1="110" y1="150" x2="110" y2="222" stroke="#c03000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="66"  y="226" font-size="9" fill="#c03000" font-style="italic">SDA falls while SCL stays HIGH</text>

  <!-- ── ACK1 annotation ── -->
  <text x="368" y="210" text-anchor="middle" font-size="8.5" fill="#207020" font-style="italic">peripheral</text>
  <text x="368" y="221" text-anchor="middle" font-size="8.5" fill="#207020" font-style="italic">pulls LOW</text>

  <!-- ── STOP annotation ── -->
  <line x1="640" y1="150" x2="640" y2="222" stroke="#c03000" stroke-width="1" stroke-dasharray="3,2"/>
  <text x="548" y="226" font-size="9" fill="#c03000" font-style="italic">SDA rises while SCL stays HIGH</text>

  <!-- ── Figure title ── -->
  <text x="397" y="248" text-anchor="middle" font-size="11" font-weight="bold" fill="#222">I2C write: START &#x2192; address 0x70 + W &#x2192; ACK &#x2192; data 0xAA &#x2192; ACK &#x2192; STOP</text>
</svg>

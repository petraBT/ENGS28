<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ENGS 28 — Nucleo-C031C6 Simulator</title>
    <script type="module" crossorigin src="./assets/main-BPQR_6bS.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/main-Dnr_a6sf.css">
  </head>
  <body>
    <div id="app">
      <section id="left">
        <div id="toolbar">
          <button id="btn-run" class="primary">▶ Run</button>
          <button id="btn-pause">❚❚ Pause</button>
          <button id="btn-step">⤼ Step</button>
          <button id="btn-reset">⟲ Reset</button>
          <button id="btn-term" title="Show or hide the CoolTerm serial terminal — where printf output arrives">⌨<span class="btn-label"> CoolTerm</span></button>
          <select id="examples" title="Load an example program"></select>
          <button id="btn-popout" title="Open the current program full screen in a new tab">⤢ Full screen</button>
        </div>
        <textarea id="editor"></textarea>
        <div id="vsplit" class="gutter-h" title="Drag to resize"></div>
        <div id="coolterm"></div>
        <div id="error"></div>
        <div id="status"></div>
      </section>

      <div id="hsplit" class="gutter" title="Drag to resize"></div>

      <section id="right">
        <div id="board-wrap">
          <div id="board"></div>
        </div>
        <div id="side">
          <div class="bay">
            <span class="bay-title">Component bay</span>
            <button id="btn-add-led">+ LED</button>
            <button id="btn-add-btn">+ Button</button>
            <button id="btn-clear">Clear</button>
          </div>
          <div class="panel-title">Registers</div>
          <div id="registers"></div>
        </div>
      </section>
    </div>
  </body>
</html>

<?xml version="1.0" encoding="UTF-8"?>
<svg width="900" height="330" viewBox="0 0 900 330" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <title>The START and STOP conditions on SCL and SDA</title>
  <desc>Two traces, SCL above and SDA below. At the left, both lines idle HIGH and
  SDA falls while SCL is still HIGH: the START condition. SCL then runs, and SDA
  changes only while SCL is LOW, which is shaded. At the right, SDA rises while SCL
  is HIGH: the STOP condition. Both are marked, and the shaded bands show the only
  times SDA is allowed to move.</desc>

  <!-- shaded "SDA may change here" bands, aligned with SCL LOW phases -->
  <g fill="#dbeafe">
    <rect x="250" y="60" width="60" height="210"/>
    <rect x="370" y="60" width="60" height="210"/>
    <rect x="490" y="60" width="60" height="210"/>
    <rect x="610" y="60" width="60" height="210"/>
  </g>

  <!-- START / STOP highlight bands -->
  <rect x="150" y="60" width="40" height="210" fill="#fee2e2"/>
  <rect x="700" y="60" width="40" height="210" fill="#fee2e2"/>

  <!-- SCL -->
  <text x="20" y="118" font-size="20" font-weight="bold" fill="#b45309">SCL</text>
  <text x="112" y="96"  font-size="13" fill="#666">H</text>
  <text x="112" y="164" font-size="13" fill="#666">L</text>
  <polyline points="130,90 250,90 250,155 310,155 310,90 370,90 370,155 430,155
                    430,90 490,90 490,155 550,155 550,90 610,90 610,155 670,155
                    670,90 790,90"
            fill="none" stroke="#d97706" stroke-width="4"/>

  <!-- SDA: idles HIGH, falls at START while SCL is HIGH, moves only in the LOW bands,
       rises at STOP while SCL is HIGH -->
  <text x="20" y="248" font-size="20" font-weight="bold" fill="#1d4ed8">SDA</text>
  <text x="112" y="226" font-size="13" fill="#666">H</text>
  <text x="112" y="294" font-size="13" fill="#666">L</text>
  <polyline points="130,220 170,220 170,285 280,285 280,220 400,220 400,285
                    520,285 520,220 640,220 640,285 720,285 720,220 790,220"
            fill="none" stroke="#1d4ed8" stroke-width="4"/>

  <!-- markers -->
  <text x="170" y="46" font-size="19" font-weight="bold" text-anchor="middle" fill="#b91c1c">START</text>
  <text x="720" y="46" font-size="19" font-weight="bold" text-anchor="middle" fill="#b91c1c">STOP</text>
  <text x="170" y="322" font-size="15" text-anchor="middle" fill="#b91c1c">SDA falls</text>
  <text x="720" y="322" font-size="15" text-anchor="middle" fill="#b91c1c">SDA rises</text>
  <text x="440" y="322" font-size="15" text-anchor="middle" fill="#1e40af">shaded: SCL is LOW — the only time SDA may change</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 300" width="780" height="300">
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="780" height="300" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111111">

    <!-- states -->
    <circle cx="120" cy="120" r="58" fill="#fdf6d8" stroke="#333333" stroke-width="2.5"/>
    <text x="120" y="114" text-anchor="middle" font-size="19" font-weight="bold">LED 1</text>
    <text x="120" y="138" text-anchor="middle" font-size="19" font-weight="bold">on</text>

    <circle cx="390" cy="120" r="58" fill="#fdf6d8" stroke="#333333" stroke-width="2.5"/>
    <text x="390" y="114" text-anchor="middle" font-size="19" font-weight="bold">LED 2</text>
    <text x="390" y="138" text-anchor="middle" font-size="19" font-weight="bold">on</text>

    <circle cx="660" cy="120" r="58" fill="#fdf6d8" stroke="#333333" stroke-width="2.5"/>
    <text x="660" y="114" text-anchor="middle" font-size="19" font-weight="bold">LED 3</text>
    <text x="660" y="138" text-anchor="middle" font-size="19" font-weight="bold">on</text>

    <!-- entry -->
    <line x1="24" y1="120" x2="58" y2="120" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="24" y="104" text-anchor="start" font-size="15" fill="#555555">start</text>

    <!-- forward transitions -->
    <line x1="180" y1="120" x2="330" y2="120" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="255" y="100" text-anchor="middle" font-size="16">500 ms elapsed</text>
    <text x="255" y="146" text-anchor="middle" font-size="16" fill="#1a5fb4">/ light LED 2</text>

    <line x1="450" y1="120" x2="600" y2="120" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="525" y="100" text-anchor="middle" font-size="16">500 ms elapsed</text>
    <text x="525" y="146" text-anchor="middle" font-size="16" fill="#1a5fb4">/ light LED 3</text>

    <!-- wrap-around transition -->
    <path d="M660,178 L660,262 L120,262 L120,178" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="390" y="252" text-anchor="middle" font-size="16">500 ms elapsed</text>
    <text x="390" y="290" text-anchor="middle" font-size="16" fill="#1a5fb4">/ light LED 1</text>

  </g>
</svg>

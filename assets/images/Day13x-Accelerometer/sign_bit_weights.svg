<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 300" width="1060" height="300" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrS" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- left panel: 0b1110 in 4 bits, with the bit weights -->
  <text x="230" y="46" font-size="30" text-anchor="middle">0b1110, read with its weights</text>
  <g font-size="34" text-anchor="middle">
    <rect x="90" y="70" width="280" height="60" fill="none" stroke="#000000" stroke-width="2.5"/>
    <line x1="160" y1="70" x2="160" y2="130" stroke="#000000" stroke-width="2"/>
    <line x1="230" y1="70" x2="230" y2="130" stroke="#000000" stroke-width="2"/>
    <line x1="300" y1="70" x2="300" y2="130" stroke="#000000" stroke-width="2"/>
    <text x="125" y="112">1</text><text x="195" y="112">1</text><text x="265" y="112">1</text><text x="335" y="112">0</text>
  </g>
  <!-- weights under the cells; the top weight is crossed out and re-valued -->
  <g font-size="28" text-anchor="middle">
    <text x="125" y="172" fill="#999999" text-decoration="line-through">8</text>
    <text x="125" y="206" fill="#000000">&#8722;8</text>
    <text x="195" y="172">4</text>
    <text x="265" y="172">2</text>
    <text x="335" y="172">1</text>
  </g>
  <text x="230" y="256" font-size="30" text-anchor="middle">&#8722;8 + 4 + 2 = &#8722;2</text>

  <!-- right panel: the 16-bit word, bit 15 flagged -->
  <text x="750" y="46" font-size="30" text-anchor="middle">the same rule at 16 bits</text>
  <g font-size="24" text-anchor="middle">
    <rect x="530" y="100" width="440" height="52" fill="none" stroke="#000000" stroke-width="2.5"/>
    <line x1="557.5" y1="100" x2="557.5" y2="152" stroke="#000000" stroke-width="1.5"/>
    <text x="543" y="134" font-style="italic">b</text>
    <text x="571" y="134" font-style="italic">b</text><text x="598" y="134" font-style="italic">b</text><text x="626" y="134" font-style="italic">b</text><text x="653" y="134" font-style="italic">b</text><text x="681" y="134" font-style="italic">b</text><text x="708" y="134" font-style="italic">b</text><text x="736" y="134" font-style="italic">b</text><text x="763" y="134" font-style="italic">b</text><text x="791" y="134" font-style="italic">b</text><text x="818" y="134" font-style="italic">b</text><text x="846" y="134" font-style="italic">b</text><text x="873" y="134" font-style="italic">b</text><text x="901" y="134" font-style="italic">b</text><text x="928" y="134" font-style="italic">b</text><text x="956" y="134" font-style="italic">b</text>
  </g>
  <text x="543" y="80" font-size="22" text-anchor="middle" fill="#555555">15</text>
  <text x="956" y="80" font-size="22" text-anchor="middle" fill="#555555">0</text>
  <line x1="543" y1="216" x2="543" y2="160" stroke="#000000" stroke-width="2.5" marker-end="url(#arrS)"/>
  <text x="543" y="250" font-size="28" text-anchor="middle">bit 15 is worth &#8722;2&#185;&#8309;</text>
  <text x="750" y="290" font-size="26" text-anchor="middle" fill="#555555">every other bit keeps its usual value</text>
</svg>

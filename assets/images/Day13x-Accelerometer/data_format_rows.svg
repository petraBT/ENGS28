<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 470" width="1060" height="470" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- the sign bit, called out once for all three rows -->
  <text x="342" y="36" font-size="28" text-anchor="middle">bit 15: the sign, worth &#8722;2&#185;&#8309;</text>
  <line x1="342" y1="48" x2="342" y2="94" stroke="#000000" stroke-width="2.5" marker-end="url(#arr3)"/>

  <!-- bit indices over the grid -->
  <text x="308" y="88" font-size="22" text-anchor="end" fill="#555555">15</text>
  <text x="1002" y="88" font-size="22" text-anchor="middle" fill="#555555">0</text>

  <!-- row 1: low-power, 8 valid bits -->
  <text x="300" y="136" font-size="28" text-anchor="end">low-power (8-bit)</text>
  <g font-size="30" text-anchor="middle">
    <rect x="320" y="100" width="704" height="52" fill="none" stroke="#000000" stroke-width="2.5"/>
    <line x1="672" y1="100" x2="672" y2="152" stroke="#000000" stroke-width="2.5"/>
    <text x="342" y="138" font-style="italic">b</text><text x="386" y="138" font-style="italic">b</text><text x="430" y="138" font-style="italic">b</text><text x="474" y="138" font-style="italic">b</text><text x="518" y="138" font-style="italic">b</text><text x="562" y="138" font-style="italic">b</text><text x="606" y="138" font-style="italic">b</text><text x="650" y="138" font-style="italic">b</text>
    <text x="694" y="138" fill="#888888">0</text><text x="738" y="138" fill="#888888">0</text><text x="782" y="138" fill="#888888">0</text><text x="826" y="138" fill="#888888">0</text><text x="870" y="138" fill="#888888">0</text><text x="914" y="138" fill="#888888">0</text><text x="958" y="138" fill="#888888">0</text><text x="1002" y="138" fill="#888888">0</text>
  </g>

  <text x="1024" y="184" font-size="26" text-anchor="end">(raw &#8811; 8) &#183; 4g/2&#8312; = 4g&#183;raw/2&#185;&#8310;</text>

  <!-- row 2: normal, 10 valid bits -->
  <text x="300" y="236" font-size="28" text-anchor="end">normal (10-bit)</text>
  <g font-size="30" text-anchor="middle">
    <rect x="320" y="200" width="704" height="52" fill="none" stroke="#000000" stroke-width="2.5"/>
    <line x1="760" y1="200" x2="760" y2="252" stroke="#000000" stroke-width="2.5"/>
    <text x="342" y="238" font-style="italic">b</text><text x="386" y="238" font-style="italic">b</text><text x="430" y="238" font-style="italic">b</text><text x="474" y="238" font-style="italic">b</text><text x="518" y="238" font-style="italic">b</text><text x="562" y="238" font-style="italic">b</text><text x="606" y="238" font-style="italic">b</text><text x="650" y="238" font-style="italic">b</text><text x="694" y="238" font-style="italic">b</text><text x="738" y="238" font-style="italic">b</text>
    <text x="782" y="238" fill="#888888">0</text><text x="826" y="238" fill="#888888">0</text><text x="870" y="238" fill="#888888">0</text><text x="914" y="238" fill="#888888">0</text><text x="958" y="238" fill="#888888">0</text><text x="1002" y="238" fill="#888888">0</text>
  </g>

  <text x="1024" y="284" font-size="26" text-anchor="end">(raw &#8811; 6) &#183; 4g/2&#185;&#8304; = 4g&#183;raw/2&#185;&#8310;</text>

  <!-- row 3: high-resolution, 12 valid bits -->
  <text x="300" y="336" font-size="28" text-anchor="end">high-resolution (12-bit)</text>
  <g font-size="30" text-anchor="middle">
    <rect x="320" y="300" width="704" height="52" fill="none" stroke="#000000" stroke-width="2.5"/>
    <line x1="848" y1="300" x2="848" y2="352" stroke="#000000" stroke-width="2.5"/>
    <text x="342" y="338" font-style="italic">b</text><text x="386" y="338" font-style="italic">b</text><text x="430" y="338" font-style="italic">b</text><text x="474" y="338" font-style="italic">b</text><text x="518" y="338" font-style="italic">b</text><text x="562" y="338" font-style="italic">b</text><text x="606" y="338" font-style="italic">b</text><text x="650" y="338" font-style="italic">b</text><text x="694" y="338" font-style="italic">b</text><text x="738" y="338" font-style="italic">b</text><text x="782" y="338" font-style="italic">b</text><text x="826" y="338" font-style="italic">b</text>
    <text x="870" y="338" fill="#888888">0</text><text x="914" y="338" fill="#888888">0</text><text x="958" y="338" fill="#888888">0</text><text x="1002" y="338" fill="#888888">0</text>
  </g>

  <text x="1024" y="384" font-size="26" text-anchor="end">(raw &#8811; 4) &#183; 4g/2&#185;&#178; = 4g&#183;raw/2&#185;&#8310;</text>

  <!-- what stays the same -->
  <text x="530" y="430" font-size="26" text-anchor="middle">the valid bits always start at bit 15; the zeros fill in from bit 0</text>
</svg>

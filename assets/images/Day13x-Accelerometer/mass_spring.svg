<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#555555" stroke-width="2"/>
    </pattern>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- the equation the class derives -->
  <text x="440" y="52" font-size="40" font-style="italic" text-anchor="middle">F = kx = ma</text>

  <!-- ground -->
  <rect x="20" y="370" width="840" height="40" fill="url(#hatch)" stroke="none"/>
  <line x1="20" y1="370" x2="860" y2="370" stroke="#000000" stroke-width="3"/>

  <!-- the case: base and right-hand wall, one piece -->
  <path d="M 60 370 L 60 310 L 660 310 L 660 150 L 820 150 L 820 370 Z"
        fill="#e8e8e8" stroke="#000000" stroke-width="3"/>

  <!-- acceleration arrow on the case -->
  <line x1="690" y1="112" x2="810" y2="112" stroke="#000000" stroke-width="4" marker-end="url(#arr)"/>
  <text x="750" y="94" font-size="34" text-anchor="middle">accel</text>

  <!-- rest position of the mass, dashed -->
  <rect x="215" y="210" width="100" height="100" fill="none" stroke="#000000" stroke-width="2.5" stroke-dasharray="8 6"/>

  <!-- the proof mass, displaced left of rest -->
  <rect x="140" y="210" width="100" height="100" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
  <text x="190" y="275" font-size="44" font-style="italic" text-anchor="middle">m</text>

  <!-- the spring, from the mass to the wall -->
  <path d="M 240 250 L 268 250 L 282 222 L 310 278 L 338 222 L 366 278 L 394 222 L 422 278 L 450 222 L 478 278 L 506 222 L 534 278 L 562 222 L 590 278 L 610 250 L 660 250"
        fill="none" stroke="#000000" stroke-width="3"/>
  <text x="450" y="196" font-size="36" font-style="italic" text-anchor="middle">k</text>

  <!-- displacement: mass left edge vs rest left edge -->
  <line x1="140" y1="210" x2="140" y2="176" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="215" y1="210" x2="215" y2="176" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="146" y1="184" x2="209" y2="184" stroke="#000000" stroke-width="2.5" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="177" y="166" font-size="34" font-style="italic" text-anchor="middle">x</text>
  <text x="265" y="345" font-size="26" text-anchor="middle">0 (rest)</text>
  <line x1="265" y1="310" x2="265" y2="322" stroke="#000000" stroke-width="2"/>
</svg>

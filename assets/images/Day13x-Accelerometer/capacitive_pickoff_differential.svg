<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="450" y="36" font-size="28" text-anchor="middle">&#916;C = C1 &#8722; C2</text>

  <!-- moving plate, attached to the mass, between the two fixed plates -->
  <rect x="442" y="90" width="16" height="200" fill="#444444"/>

  <!-- motion arrows on the moving plate, labeled with the displacement -->
  <line x1="430" y1="70" x2="390" y2="70" stroke="#000000" stroke-width="3" marker-end="url(#arr3)"/>
  <line x1="470" y1="70" x2="510" y2="70" stroke="#000000" stroke-width="3" marker-end="url(#arr3)"/>
  <text x="450" y="62" font-size="26" font-style="italic" text-anchor="middle">x</text>

  <!-- fixed plates, attached to the case -->
  <rect x="196" y="90" width="16" height="200" fill="#444444"/>
  <rect x="688" y="90" width="16" height="200" fill="#444444"/>

  <!-- the two gaps -->
  <line x1="212" y1="190" x2="442" y2="190" stroke="#000000" stroke-width="2.5" marker-start="url(#arr3)" marker-end="url(#arr3)"/>
  <line x1="458" y1="190" x2="688" y2="190" stroke="#000000" stroke-width="2.5" marker-start="url(#arr3)" marker-end="url(#arr3)"/>

  <text x="327" y="170" font-size="32" font-style="italic" text-anchor="middle">C1</text>
  <text x="573" y="170" font-size="32" font-style="italic" text-anchor="middle">C2</text>

  <!-- plate labels -->
  <text x="204" y="325" font-size="20" text-anchor="middle">plate on</text>
  <text x="204" y="349" font-size="20" text-anchor="middle">the case</text>

  <text x="450" y="325" font-size="20" text-anchor="middle">plate on</text>
  <text x="450" y="349" font-size="20" text-anchor="middle">the mass</text>

  <text x="696" y="325" font-size="20" text-anchor="middle">plate on</text>
  <text x="696" y="349" font-size="20" text-anchor="middle">the case</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <pattern id="hatchR" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#ffffff"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#555555" stroke-width="2"/>
    </pattern>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ground -->
  <rect x="20" y="370" width="840" height="40" fill="url(#hatchR)" stroke="none"/>
  <line x1="20" y1="370" x2="860" y2="370" stroke="#000000" stroke-width="3"/>

  <!-- the case: base and right-hand wall, one piece -->
  <path d="M 60 370 L 60 310 L 660 310 L 660 150 L 820 150 L 820 370 Z"
        fill="#e8e8e8" stroke="#000000" stroke-width="3"/>
  <text x="740" y="290" font-size="30" text-anchor="middle">case</text>

  <!-- acceleration arrow on the case -->
  <line x1="690" y1="112" x2="810" y2="112" stroke="#000000" stroke-width="4" marker-end="url(#arrR)"/>
  <text x="750" y="94" font-size="34" text-anchor="middle">accel</text>

  <!-- the proof mass, at rest — same rest position as mass_spring.svg's
       dashed square (center x = 280) -->
  <rect x="230" y="210" width="100" height="100" fill="#ffffff" stroke="#000000" stroke-width="3.5"/>
  <text x="280" y="275" font-size="44" font-style="italic" text-anchor="middle">m</text>

  <!-- the spring: the same six coils as mass_spring.svg, at rest pitch -->
  <path d="M 330 250 L 348 250
           C 351 216, 371 216, 374 250 C 377 284, 397 284, 400 250
           C 403 216, 423 216, 426 250 C 429 284, 449 284, 452 250
           C 455 216, 475 216, 478 250 C 481 284, 501 284, 504 250
           C 507 216, 527 216, 530 250 C 533 284, 553 284, 556 250
           C 559 216, 579 216, 582 250 C 585 284, 605 284, 608 250
           C 611 216, 631 216, 634 250 C 637 284, 649 284, 652 250
           L 660 250"
        fill="none" stroke="#000000" stroke-width="3"/>
  <text x="495" y="196" font-size="36" font-style="italic" text-anchor="middle">k</text>
</svg>

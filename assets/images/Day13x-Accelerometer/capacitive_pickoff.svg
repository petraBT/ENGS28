<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- moving plate, attached to the mass -->
  <rect x="200" y="90" width="16" height="200" fill="#444444"/>
  <text x="208" y="330" font-size="28" text-anchor="middle">plate on the mass</text>

  <!-- motion arrows on the moving plate -->
  <line x1="188" y1="70" x2="148" y2="70" stroke="#000000" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="228" y1="70" x2="268" y2="70" stroke="#000000" stroke-width="3" marker-end="url(#arr2)"/>

  <!-- fixed plate, attached to the case -->
  <rect x="460" y="90" width="16" height="200" fill="#444444"/>
  <text x="468" y="330" font-size="28" text-anchor="middle">plate on the case</text>

  <!-- the gap -->
  <line x1="224" y1="190" x2="452" y2="190" stroke="#000000" stroke-width="2.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="380" y="40" font-size="30" text-anchor="middle">the gap tracks the displacement</text>
  <line x1="380" y1="52" x2="342" y2="180" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- capacitance label -->
  <text x="640" y="180" font-size="40" font-style="italic" text-anchor="middle">C</text>
  <line x1="600" y1="192" x2="680" y2="192" stroke="#000000" stroke-width="2"/>
  <text x="640" y="224" font-size="26" text-anchor="middle">changes</text>
  <text x="640" y="254" font-size="26" text-anchor="middle">with the gap</text>
</svg>

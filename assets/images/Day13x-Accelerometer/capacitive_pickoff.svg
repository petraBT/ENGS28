<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000000"/>
    </marker>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- moving plate, attached to the mass -->
  <rect x="270" y="90" width="16" height="200" fill="#444444"/>
  <text x="290" y="330" font-size="28" text-anchor="end">plate on the mass</text>

  <!-- motion arrows on the moving plate, labeled with the displacement -->
  <line x1="258" y1="70" x2="218" y2="70" stroke="#000000" stroke-width="3" marker-end="url(#arr2)"/>
  <line x1="298" y1="70" x2="338" y2="70" stroke="#000000" stroke-width="3" marker-end="url(#arr2)"/>
  <text x="278" y="62" font-size="30" font-style="italic" text-anchor="middle">x</text>

  <!-- fixed plate, attached to the case -->
  <rect x="390" y="90" width="16" height="200" fill="#444444"/>
  <text x="386" y="330" font-size="28" text-anchor="start">plate on the case</text>

  <!-- the gap -->
  <line x1="294" y1="190" x2="382" y2="190" stroke="#000000" stroke-width="2.5" marker-start="url(#arr2)" marker-end="url(#arr2)"/>
  <text x="380" y="40" font-size="30" text-anchor="middle">the gap tracks the displacement</text>
  <line x1="380" y1="52" x2="340" y2="180" stroke="#000000" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- capacitance label -->
  <text x="530" y="180" font-size="40" font-style="italic" text-anchor="middle">C</text>
  <text x="614" y="172" font-size="26" text-anchor="middle">changes</text>
  <text x="614" y="202" font-size="26" text-anchor="middle">with the gap</text>
</svg>

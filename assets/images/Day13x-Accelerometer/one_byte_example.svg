<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 250" width="1060" height="250" font-family="Helvetica, Arial, sans-serif">
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="530" y="38" font-size="28" text-anchor="middle">the reading 0x4000, as 16 bits</text>

  <!-- bit indices -->
  <text x="174" y="76" font-size="22" text-anchor="middle" fill="#555555">15</text>
  <text x="894" y="76" font-size="22" text-anchor="middle" fill="#555555">0</text>

  <!-- the 16 cells: 0100 0000 | 0000 0000 -->
  <g font-size="30" text-anchor="middle">
    <rect x="150" y="88" width="768" height="54" fill="none" stroke="#000000" stroke-width="2.5"/>
    <line x1="534" y1="88" x2="534" y2="142" stroke="#000000" stroke-width="3.5"/>
    <text x="174" y="127">0</text><text x="222" y="127">1</text><text x="270" y="127">0</text><text x="318" y="127">0</text>
    <text x="366" y="127" fill="#888888">0</text><text x="414" y="127" fill="#888888">0</text><text x="462" y="127" fill="#888888">0</text><text x="510" y="127" fill="#888888">0</text>
    <text x="558" y="127" fill="#888888">0</text><text x="606" y="127" fill="#888888">0</text><text x="654" y="127" fill="#888888">0</text><text x="702" y="127" fill="#888888">0</text>
    <text x="750" y="127" fill="#888888">0</text><text x="798" y="127" fill="#888888">0</text><text x="846" y="127" fill="#888888">0</text><text x="894" y="127" fill="#888888">0</text>
  </g>

  <!-- byte brackets -->
  <path d="M 152 156 L 152 170 L 532 170 L 532 156" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="342" y="200" font-size="28" text-anchor="middle">top byte: 0x40 = 64</text>
  <path d="M 536 156 L 536 170 L 916 170 L 916 156" fill="none" stroke="#000000" stroke-width="2"/>
  <text x="726" y="200" font-size="28" text-anchor="middle">low byte: 0x00</text>
</svg>

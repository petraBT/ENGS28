<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .lbl  { font: 21px Helvetica, Arial, sans-serif; fill: #222; }
      .sml  { font: 18px Helvetica, Arial, sans-serif; fill: #555; }
      .math { font: italic 23px Georgia, serif; fill: #222; }
      .wire { stroke: #333; stroke-width: 2.5; fill: none; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- supply -->
  <text class="math" x="300" y="52" text-anchor="middle">V<tspan font-size="15" dy="5">cc</tspan></text>
  <line class="wire" x1="270" y1="66" x2="330" y2="66"/>
  <line class="wire" x1="300" y1="66" x2="300" y2="96"/>

  <!-- R_sens: variable resistor -->
  <polyline class="wire" points="300.0,96.0 314.0,100.6 286.0,109.8 314.0,118.9 286.0,128.1 314.0,137.2 286.0,146.4 314.0,155.6 286.0,164.7 314.0,173.9 286.0,183.1 314.0,192.2 286.0,201.4 300.0,206.0"/>
  <line class="wire" x1="256" y1="220" x2="344" y2="86" marker-end="url(#ar)"/>
  <text class="math" x="236" y="158" text-anchor="end">R<tspan font-size="15" dy="5">sens</tspan></text>
  <text class="sml" x="236" y="184" text-anchor="end">the sensor</text>

  <!-- node -->
  <line class="wire" x1="300" y1="206" x2="300" y2="330"/>
  <circle cx="300" cy="268" r="5" fill="#333"/>
  <line class="wire" x1="300" y1="268" x2="410" y2="268" marker-end="url(#ar)"/>

  <!-- R_M: fixed resistor -->
  <polyline class="wire" points="300.0,330.0 314.0,334.6 286.0,343.8 314.0,352.9 286.0,362.1 314.0,371.3 286.0,380.4 314.0,389.6 286.0,398.8 314.0,407.9 286.0,417.1 314.0,426.3 286.0,435.4 300.0,440.0"/>
  <text class="math" x="236" y="390" text-anchor="end">R<tspan font-size="15" dy="5">M</tspan></text>
  <text class="sml" x="236" y="416" text-anchor="end">the fixed resistor</text>

  <!-- ground -->
  <line class="wire" x1="300" y1="440" x2="300" y2="478"/>
  <line class="wire" x1="278" y1="478" x2="322" y2="478"/>
  <line class="wire" x1="287" y1="487" x2="313" y2="487"/>
  <line class="wire" x1="295" y1="496" x2="305" y2="496"/>
  <text class="lbl" x="336" y="486">GND</text>

  <!-- formula at the node -->
  <text class="math" x="424" y="276">V<tspan font-size="15" dy="5">M</tspan><tspan dy="-5"> = V</tspan><tspan font-size="15" dy="5">cc</tspan><tspan dy="-5"> &#183;</tspan></text>
  <text class="math" x="612" y="262" text-anchor="middle">R<tspan font-size="15" dy="5">M</tspan></text>
  <line x1="538" y1="274" x2="686" y2="274" stroke="#222" stroke-width="2"/>
  <text class="math" x="612" y="300" text-anchor="middle">R<tspan font-size="15" dy="5">sens</tspan><tspan font-size="23" dy="-5"> + R</tspan><tspan font-size="15" dy="5">M</tspan></text>
  <text class="sml" x="424" y="336">to an ADC pin, A0 or A1</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 600" width="1100" height="600">
  <defs><marker id="bh" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M 0 0 L 10 5 L 0 10 z" fill="#e08a00"/></marker></defs>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#1a1a1a">

  <g>
    <text x="44" y="50" font-size="27" font-weight="bold">A slot is in front of the beam</text>

    <rect x="74" y="238" width="52" height="168" fill="#efefef" stroke="#888" stroke-width="2.5"/>
    <rect x="84" y="280" width="32" height="84" fill="#ffffff" stroke="#666" stroke-width="2.5"/>
    <text x="100" y="434" font-size="22" text-anchor="middle" fill="#555">wheel rim</text>
    <line x1="64" y1="322" x2="264" y2="322" stroke="#e08a00" stroke-width="7" marker-end="url(#bh)"/>
    <text x="14" y="306" font-size="22" fill="#e08a00">LED</text>

    <line x1="216" y1="96" x2="372" y2="96" stroke="#333" stroke-width="4"/>
    <text x="378" y="104" font-size="24">3.3 V</text>
    <line x1="294" y1="96" x2="294" y2="130" stroke="#333" stroke-width="4"/>
    <rect x="276" y="130" width="36" height="78" fill="#ffffff" stroke="#333" stroke-width="4"/>
    <text x="322" y="177" font-size="24">10 k&#8486;</text>
    <line x1="294" y1="208" x2="294" y2="286" stroke="#333" stroke-width="4"/>
    <circle cx="294" cy="248" r="7" fill="#333"/>
    <line x1="294" y1="248" x2="376" y2="248" stroke="#333" stroke-width="4"/>
    <text x="382" y="256" font-size="24">OUT</text>

    <line x1="270" y1="286" x2="270" y2="358" stroke="#333" stroke-width="6"/>
    <line x1="270" y1="302" x2="294" y2="286" stroke="#333" stroke-width="4"/>
    <line x1="270" y1="342" x2="294" y2="358" stroke="#333" stroke-width="4"/>
    <polygon points="283,353 294,358 284,343" fill="#333"/>
    <line x1="294" y1="358" x2="294" y2="404" stroke="#333" stroke-width="4"/>
    <line x1="268" y1="404" x2="320" y2="404" stroke="#333" stroke-width="5"/>
    <line x1="277" y1="416" x2="311" y2="416" stroke="#333" stroke-width="5"/>
    <line x1="286" y1="428" x2="302" y2="428" stroke="#333" stroke-width="5"/>
    <text x="294" y="464" font-size="22" text-anchor="middle" fill="#555">phototransistor</text>

    <text x="44" y="518" font-size="26" fill="#8c1d1d">the transistor conducts,</text>
    <text x="44" y="554" font-size="26" fill="#8c1d1d">and OUT is pulled down</text>
  </g>

  <g>
    <text x="604" y="50" font-size="27" font-weight="bold">A spoke blocks the beam</text>

    <rect x="634" y="238" width="52" height="168" fill="#efefef" stroke="#888" stroke-width="2.5"/>
    <rect x="644" y="280" width="32" height="84" fill="#8a8a8a" stroke="#666" stroke-width="2.5"/>
    <text x="660" y="434" font-size="22" text-anchor="middle" fill="#555">wheel rim</text>
    <line x1="624" y1="322" x2="642" y2="322" stroke="#e08a00" stroke-width="7"/><line x1="680" y1="322" x2="824" y2="322" stroke="#cfcfcf" stroke-width="7" stroke-dasharray="10 13"/>
    <text x="574" y="306" font-size="22" fill="#e08a00">LED</text>

    <line x1="776" y1="96" x2="932" y2="96" stroke="#333" stroke-width="4"/>
    <text x="938" y="104" font-size="24">3.3 V</text>
    <line x1="854" y1="96" x2="854" y2="130" stroke="#333" stroke-width="4"/>
    <rect x="836" y="130" width="36" height="78" fill="#ffffff" stroke="#333" stroke-width="4"/>
    <text x="882" y="177" font-size="24">10 k&#8486;</text>
    <line x1="854" y1="208" x2="854" y2="286" stroke="#333" stroke-width="4"/>
    <circle cx="854" cy="248" r="7" fill="#333"/>
    <line x1="854" y1="248" x2="936" y2="248" stroke="#333" stroke-width="4"/>
    <text x="942" y="256" font-size="24">OUT</text>

    <line x1="830" y1="286" x2="830" y2="358" stroke="#333" stroke-width="6"/>
    <line x1="830" y1="302" x2="854" y2="286" stroke="#333" stroke-width="4"/>
    <line x1="830" y1="342" x2="854" y2="358" stroke="#333" stroke-width="4"/>
    <polygon points="843,353 854,358 844,343" fill="#333"/>
    <line x1="854" y1="358" x2="854" y2="404" stroke="#333" stroke-width="4"/>
    <line x1="828" y1="404" x2="880" y2="404" stroke="#333" stroke-width="5"/>
    <line x1="837" y1="416" x2="871" y2="416" stroke="#333" stroke-width="5"/>
    <line x1="846" y1="428" x2="862" y2="428" stroke="#333" stroke-width="5"/>
    <text x="854" y="464" font-size="22" text-anchor="middle" fill="#555">phototransistor</text>

    <text x="604" y="518" font-size="26" fill="#0b5394">the transistor is off, and</text>
    <text x="604" y="554" font-size="26" fill="#0b5394">the resistor holds OUT up</text>
  </g>
    <line x1="552" y1="26" x2="552" y2="572" stroke="#dddddd" stroke-width="3"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 380" width="1120" height="380" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1A23DC"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#CC0000"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38761D"/></marker>
<marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B45F06"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<!-- clock in -->
<text x="30" y="150" font-size="24" fill="#1A23DC">system clock</text>
<text x="30" y="178" font-size="24" fill="#1A23DC">12 MHz</text>
<line x1="60" y1="195" x2="60" y2="230" stroke="#1A23DC" stroke-width="4"/>
<line x1="60" y1="230" x2="180" y2="230" stroke="#1A23DC" stroke-width="4" marker-end="url(#ab)"/>
<!-- prescaler box -->
<rect x="185" y="185" width="200" height="90" fill="#EEF3FF" stroke="#1A23DC" stroke-width="3" rx="6"/>
<text x="285" y="223" font-size="26" text-anchor="middle" fill="#111111" font-weight="bold">prescaler</text>
<text x="285" y="255" font-size="22" text-anchor="middle" fill="#111111">divide by PSC + 1</text>
<!-- CK_CNT -->
<line x1="385" y1="230" x2="560" y2="230" stroke="#CC0000" stroke-width="4" marker-end="url(#ar)"/>
<text x="475" y="210" font-size="22" text-anchor="middle" fill="#CC0000">counter clock</text>
<text x="475" y="262" font-size="20" text-anchor="middle" fill="#CC0000">CK_CNT</text>
<!-- counter box -->
<rect x="565" y="185" width="200" height="90" fill="#EFF8EF" stroke="#38761D" stroke-width="3" rx="6"/>
<text x="665" y="223" font-size="26" text-anchor="middle" fill="#111111" font-weight="bold">counter  CNT</text>
<text x="665" y="255" font-size="22" text-anchor="middle" fill="#111111">16 bits, counts up</text>
<!-- ARR box above counter -->
<rect x="565" y="40" width="200" height="80" fill="#FFF6E5" stroke="#B45F06" stroke-width="3" rx="6"/>
<text x="665" y="73" font-size="26" text-anchor="middle" fill="#111111" font-weight="bold">auto-reload  ARR</text>
<text x="665" y="103" font-size="22" text-anchor="middle" fill="#111111">the upper limit</text>
<!-- compare arrow ARR->counter -->
<line x1="665" y1="120" x2="665" y2="180" stroke="#B45F06" stroke-width="4" marker-end="url(#ao)"/>
<text x="680" y="155" font-size="21" fill="#B45F06">compare</text>
<!-- update event out -->
<line x1="765" y1="230" x2="905" y2="230" stroke="#38761D" stroke-width="4" marker-end="url(#ag)"/>
<text x="835" y="210" font-size="22" text-anchor="middle" fill="#38761D">CNT = ARR?</text>
<!-- update event box -->
<rect x="910" y="170" width="180" height="120" fill="#ffffff" stroke="#333333" stroke-width="3" rx="6"/>
<text x="1000" y="205" font-size="24" text-anchor="middle" fill="#111111" font-weight="bold">update event</text>
<text x="1000" y="235" font-size="21" text-anchor="middle" fill="#111111">CNT wraps to 0</text>
<text x="1000" y="263" font-size="21" text-anchor="middle" fill="#111111">UIF is set</text>
<!-- wrap-back arrow -->
<path d="M 910 280 L 665 330 L 665 280" fill="none" stroke="#38761D" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#ag)"/>
<text x="775" y="345" font-size="21" fill="#38761D">counter restarts at 0</text>
</svg>
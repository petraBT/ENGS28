<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 510" width="980" height="510" font-family="Helvetica, Arial, sans-serif">
<rect width="100%" height="100%" fill="#ffffff"/>
<!-- compiler's view boundary -->
<rect x="40" y="60" width="560" height="380" fill="#F5F9FF" stroke="#4472C4" stroke-width="3" stroke-dasharray="14 8" rx="10"/>
<text x="60" y="44" font-size="26" fill="#4472C4" font-weight="bold">What the compiler sees when it builds main()</text>
<!-- main loop box -->
<rect x="90" y="110" width="380" height="220" fill="#ffffff" stroke="#333333" stroke-width="2.5" rx="6"/>
<text x="110" y="145" font-size="24" fill="#333333" font-family="Menlo, monospace">while (1) &#123;</text>
<text x="140" y="185" font-size="24" fill="#333333" font-family="Menlo, monospace">if (timerElapsed) &#123;</text>
<text x="170" y="225" font-size="24" fill="#333333" font-family="Menlo, monospace">timerElapsed = 0;</text>
<text x="170" y="263" font-size="24" fill="#333333" font-family="Menlo, monospace">/* work */</text>
<text x="140" y="300" font-size="24" fill="#333333" font-family="Menlo, monospace">&#125;  &#125;</text>
<!-- reasoning bubble -->
<text x="90" y="385" font-size="22" fill="#4472C4" font-style="italic">"Nothing in here ever SETS timerElapsed&#8230;</text>
<text x="90" y="415" font-size="22" fill="#4472C4" font-style="italic">&#8230;so I may read it once and assume 0 forever."</text>
<!-- the variable, on the boundary -->
<rect x="530" y="185" width="230" height="70" fill="#FFF6E5" stroke="#E69138" stroke-width="3" rx="8"/>
<text x="645" y="216" font-size="24" text-anchor="middle" fill="#7F4E00" font-family="Menlo, monospace">timerElapsed</text>
<text x="645" y="243" font-size="19" text-anchor="middle" fill="#7F4E00">one variable in RAM</text>
<!-- the ISR, outside -->
<rect x="760" y="60" width="190" height="110" fill="#EDF7ED" stroke="#38761D" stroke-width="3" rx="8"/>
<text x="855" y="98" font-size="24" text-anchor="middle" fill="#38761D" font-weight="bold">TIM14 ISR</text>
<text x="855" y="130" font-size="20" text-anchor="middle" fill="#38761D" font-family="Menlo, monospace">timerElapsed=1;</text>
<text x="855" y="155" font-size="17" text-anchor="middle" fill="#38761D">runs when hardware fires</text>
<!-- arrow ISR -> variable -->
<line x1="840" y1="170" x2="700" y2="200" stroke="#38761D" stroke-width="4" marker-end="url(#g)"/>
<defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M 0 0 L 10 5 L 0 10 z" fill="#38761D"/></marker></defs>
<text x="770" y="215" font-size="21" fill="#38761D" font-style="italic" text-anchor="start">this write happens</text>
<text x="770" y="241" font-size="21" fill="#38761D" font-style="italic" text-anchor="start">outside the</text>
<text x="770" y="267" font-size="21" fill="#38761D" font-style="italic" text-anchor="start">compiler's view</text>
<!-- volatile fix -->
<text x="60" y="470" font-size="23" fill="#333333"><tspan font-family="Menlo, monospace" font-weight="bold">volatile</tspan> tells the compiler: this variable changes by means you cannot see &#8212;</text>
<text x="60" y="498" font-size="23" fill="#333333">fetch it fresh from RAM at every use.</text>
</svg>
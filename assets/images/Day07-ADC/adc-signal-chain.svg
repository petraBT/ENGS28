<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .box  { fill:#f4f6f8; stroke:#333; stroke-width:2.5; }
      .adc  { fill:#e8f0e4; stroke:#333; stroke-width:3; }
      .name { font:bold 25px Helvetica,Arial,sans-serif; fill:#1a1a1a; text-anchor:middle; }
      .sub  { font:18px Helvetica,Arial,sans-serif; fill:#555; text-anchor:middle; }
      .sig  { font:italic 20px Georgia,serif; fill:#222; text-anchor:middle; }
      .dom  { font:bold 17px Helvetica,Arial,sans-serif; fill:#666; text-anchor:middle; letter-spacing:1.5px; }
      .note { font:18px Helvetica,Arial,sans-serif; fill:#333; text-anchor:middle; }
      .wire { stroke:#333; stroke-width:2.5; fill:none; }
      .div  { stroke:#bbb; stroke-width:2; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <line class="div" x1="885" y1="26" x2="885" y2="250"/>
  <text class="dom" x="450" y="34">CONTINUOUS &#8212; VOLTAGES</text>
  <text class="dom" x="1045" y="34">DISCRETE &#8212; INTEGERS</text>

  <rect class="box" x="30"  y="108" width="210" height="104" rx="5"/>
  <text class="name" x="135" y="146">Sensor</text>
  <text class="sub"  x="135" y="174">temperature, light,</text>
  <text class="sub"  x="135" y="196">position, force</text>

  <rect class="box" x="330" y="108" width="210" height="104" rx="5"/>
  <text class="name" x="435" y="146">Analog front end</text>
  <text class="sub"  x="435" y="174">amplify, filter</text>
  <text class="sub"  x="435" y="196">(not always present)</text>

  <rect class="adc" x="630" y="108" width="210" height="104" rx="5"/>
  <text class="name" x="735" y="152">ADC</text>
  <text class="sub"  x="735" y="182">this chapter</text>

  <rect class="box" x="930" y="108" width="210" height="104" rx="5"/>
  <text class="name" x="1035" y="146">MCU</text>
  <text class="sub"  x="1035" y="174">compares, decides,</text>
  <text class="sub"  x="1035" y="196">stores, transmits</text>

  <line class="wire" x1="240" y1="160" x2="322" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="281" y="142">mV</text>
  <text class="sub" x="281" y="238">small, noisy</text>

  <line class="wire" x1="540" y1="160" x2="622" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="581" y="142">0&#8211;3.3 V</text>
  <text class="sub" x="581" y="238">conditioned</text>

  <line class="wire" x1="840" y1="160" x2="922" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="881" y="142">0&#8211;4095</text>
  <text class="sub" x="881" y="238">a count</text>

  <text class="note" x="600" y="288">Every measurement in this course travels this path.</text>
  <text class="note" x="600" y="314">Each stage can limit the quality of the final number &#8212; the ADC is where volts become an integer.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 404" width="704" height="404">
  <!-- Successive-approximation ADC block diagram, ENGS 28 Day 7.
       Redrawn as vector 2026-09-15: the previous version was a 500x287 raster
       upscaled to 683x392 and then again to slide width, so every label in the
       bitmap projected fuzzy (Petra, Day 7 review: "many of these look fuzzy at
       this zoom level").  It also carried a third-party watermark.  Everything
       here is vector, so it stays sharp at any projection size. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#e8eef7; stroke:#44546a; stroke-width:2.2 }
    .sh    { fill:#fbe4e4; stroke:#a05a5a; stroke-width:2.2 }
    .cmp   { fill:#f3e4fb; stroke:#7a5a9a; stroke-width:2.2 }
    .w     { stroke:#333; stroke-width:2.2; fill:none; marker-end:url(#ar) }
    .wp    { stroke:#333; stroke-width:2.2; fill:none }
    .lbl   { font-family:Helvetica,Arial,sans-serif; font-size:19px; fill:#1b1b1b }
    .blbl  { font-family:Helvetica,Arial,sans-serif; font-size:21px; fill:#26344a; font-weight:bold }
    .small { font-family:Helvetica,Arial,sans-serif; font-size:17px; fill:#1b1b1b }
    .sign  { font-family:Helvetica,Arial,sans-serif; font-size:22px; fill:#1b1b1b; font-weight:bold }
    .it    { font-family:Georgia,"Times New Roman",serif; font-style:italic; font-size:20px; fill:#1b1b1b }
    .its   { font-family:Georgia,"Times New Roman",serif; font-style:italic; font-size:14px; fill:#1b1b1b }
  </style>
  <rect width="704" height="404" fill="#ffffff"/>

  <!-- SAR register -->
  <rect class="box" x="150" y="28" width="300" height="66" rx="3"/>
  <text class="blbl" x="300" y="68" text-anchor="middle">SAR 12-bit register</text>
  <text class="lbl" x="34" y="67">Clock</text>
  <line class="w" x1="88" y1="61" x2="147" y2="61"/>

  <!-- SAR -> DAC bit lines -->
  <line class="wp" x1="205" y1="94" x2="205" y2="152"/>
  <line class="wp" x1="300" y1="94" x2="300" y2="152"/>
  <line class="wp" x1="372" y1="94" x2="372" y2="152"/>
  <line class="wp" x1="416" y1="94" x2="416" y2="152"/>
  <text class="it" x="197" y="128">b<tspan class="its" dy="6">11</tspan></text>
  <text class="lbl" x="288" y="128">. . .</text>
  <text class="it" x="365" y="128">b<tspan class="its" dy="6">1</tspan></text>
  <text class="it" x="409" y="128">b<tspan class="its" dy="6">0</tspan></text>

  <!-- DAC -->
  <rect class="box" x="188" y="152" width="246" height="64" rx="3"/>
  <text class="blbl" x="311" y="180" text-anchor="middle">Digital to analog</text>
  <text class="blbl" x="311" y="203" text-anchor="middle">(DAC)</text>
  <text class="it" x="112" y="190">V<tspan class="its" dy="6">ref</tspan></text>
  <line class="w" x1="152" y1="184" x2="185" y2="184"/>

  <!-- DAC output to comparator's inverting input (the test voltage) -->
  <path class="wp" d="M 434 184 L 476 184"/>
  <line class="w" x1="476" y1="184" x2="500" y2="184"/>
  <text class="small" x="437" y="140">test voltage</text>

  <!-- comparator -->
  <path class="cmp" d="M 500 146 L 500 250 L 578 198 Z"/>
  <text class="sign" x="510" y="182">&#8722;</text>
  <text class="sign" x="510" y="228">+</text>
  <text class="lbl" x="497" y="278">comparator</text>

  <!-- comparator output Vc, fed back to the SAR -->
  <line class="wp" x1="578" y1="198" x2="628" y2="198"/>
  <text class="it" x="606" y="188">V<tspan class="its" dy="6">c</tspan></text>
  <path class="wp" d="M 628 198 L 662 198 L 662 61"/>
  <line class="w" x1="662" y1="61" x2="453" y2="61"/>

  <!-- sample and hold on the analog input -->
  <rect class="sh" x="222" y="306" width="132" height="62" rx="3"/>
  <text class="blbl" x="288" y="333" text-anchor="middle">Sample /</text>
  <text class="blbl" x="288" y="356" text-anchor="middle">Hold</text>
  <text class="it" x="60" y="330">V<tspan class="its" dy="6">in</tspan></text>
  <text class="small" x="34" y="358">(analog input)</text>
  <path class="wp" d="M 100 337 q 13 -19 26 0 q 13 19 26 0" stroke="#a05a5a" stroke-width="2.6"/>
  <line class="w" x1="152" y1="337" x2="219" y2="337"/>

  <!-- held input to the comparator's non-inverting input -->
  <path class="wp" d="M 354 337 L 476 337 L 476 224"/>
  <line class="w" x1="476" y1="224" x2="500" y2="224"/>
  <text class="small" x="360" y="326">held input</text>
</svg>

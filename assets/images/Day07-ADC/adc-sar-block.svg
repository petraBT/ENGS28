<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 404" width="704" height="404">
  <!-- Successive-approximation ADC block diagram, ENGS 28 Day 7.
       Vector since 2026-09-15 (the previous version was an upscaled 500x287
       raster with a third-party watermark, so its labels projected fuzzy).
       Geometry corrected the same day from her four comments: the bit labels
       sat on the bit lines and were struck through by them, the DAC's arrow
       landed too low on the comparator, "test voltage" floated without a
       clear referent, and the input waveform was too shallow. -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
  </defs>
  <style>
    .box   { fill:#e8eef7; stroke:#44546a; stroke-width:2.2 }
    .sh    { fill:#fbe4e4; stroke:#a05a5a; stroke-width:2.2 }
    .cmp   { fill:#f3e4fb; stroke:#7a5a9a; stroke-width:2.2 }
    .w     { stroke:#333; stroke-width:2.2; fill:none; marker-end:url(#ar) }
    .wp    { stroke:#333; stroke-width:2.2; fill:none }
    .lbl   { font-family:Helvetica,Arial,sans-serif; font-size:19px; fill:#1b1b1b }
    .blbl  { font-family:Helvetica,Arial,sans-serif; font-size:21px; fill:#26344a; font-weight:bold }
    .small { font-family:Helvetica,Arial,sans-serif; font-size:17px; fill:#1b1b1b }
    .sign  { font-family:Helvetica,Arial,sans-serif; font-size:23px; fill:#1b1b1b; font-weight:bold }
    .it    { font-family:Georgia,"Times New Roman",serif; font-style:italic; font-size:20px; fill:#1b1b1b }
    .its   { font-family:Georgia,"Times New Roman",serif; font-style:italic; font-size:15px; fill:#1b1b1b }
  </style>
  <rect width="704" height="404" fill="#ffffff"/>

  <!-- SAR register -->
  <rect class="box" x="150" y="28" width="300" height="66" rx="3"/>
  <text class="blbl" x="300" y="68" text-anchor="middle">SAR 12-bit register</text>
  <text class="lbl" x="34" y="67">Clock</text>
  <line class="w" x1="88" y1="61" x2="147" y2="61"/>

  <!-- SAR -> DAC bit lines.  Labels sit to the RIGHT of each line, clear of it. -->
  <line class="wp" x1="190" y1="94" x2="190" y2="152"/>
  <line class="wp" x1="270" y1="94" x2="270" y2="152"/>
  <line class="wp" x1="340" y1="94" x2="340" y2="152"/>
  <line class="wp" x1="380" y1="94" x2="380" y2="152"/>
  <text class="it" x="197" y="129">b<tspan class="its" dy="6">11</tspan></text>
  <text class="lbl" x="288" y="129">. . .</text>
  <text class="it" x="347" y="129">b<tspan class="its" dy="6">1</tspan></text>
  <text class="it" x="387" y="129">b<tspan class="its" dy="6">0</tspan></text>

  <!-- DAC -->
  <rect class="box" x="170" y="152" width="230" height="64" rx="3"/>
  <text class="blbl" x="285" y="180" text-anchor="middle">Digital to analog</text>
  <text class="blbl" x="285" y="203" text-anchor="middle">(DAC)</text>
  <text class="it" x="100" y="190">V<tspan class="its" dy="6">ref</tspan></text>
  <line class="w" x1="140" y1="184" x2="167" y2="184"/>

  <!-- DAC output: the test voltage, into the comparator's inverting input -->
  <line class="wp" x1="400" y1="174" x2="476" y2="174"/>
  <line class="w" x1="476" y1="174" x2="500" y2="174"/>
  <text class="small" x="450" y="162" text-anchor="middle">test voltage</text>

  <!-- comparator -->
  <path class="cmp" d="M 500 146 L 500 250 L 578 198 Z"/>
  <text class="sign" x="512" y="182">&#8722;</text>
  <text class="sign" x="512" y="232">+</text>
  <text class="lbl" x="497" y="278">comparator</text>

  <!-- comparator output Vc, fed back to the SAR -->
  <line class="wp" x1="578" y1="198" x2="628" y2="198"/>
  <text class="it" x="600" y="188">V<tspan class="its" dy="6">c</tspan></text>
  <path class="wp" d="M 628 198 L 662 198 L 662 61"/>
  <line class="w" x1="662" y1="61" x2="453" y2="61"/>

  <!-- sample and hold on the analog input -->
  <rect class="sh" x="222" y="306" width="132" height="62" rx="3"/>
  <text class="blbl" x="288" y="333" text-anchor="middle">Sample /</text>
  <text class="blbl" x="288" y="356" text-anchor="middle">Hold</text>
  <text class="it" x="52" y="330">V<tspan class="its" dy="6">in</tspan></text>
  <text class="small" x="14" y="364">(analog input)</text>
  <path class="wp" d="M 118 337 q 14 -23 28 0 q 14 23 28 0" stroke="#a05a5a" stroke-width="2.6"/>
  <line class="w" x1="174" y1="337" x2="219" y2="337"/>

  <!-- held input to the comparator's non-inverting input -->
  <path class="wp" d="M 354 337 L 476 337 L 476 222"/>
  <line class="w" x1="476" y1="222" x2="500" y2="222"/>
  <text class="small" x="362" y="326">held input</text>
</svg>

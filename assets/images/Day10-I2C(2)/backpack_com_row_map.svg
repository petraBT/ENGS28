<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 740" width="1330" height="740"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="1330" height="740" fill="#ffffff"/>

  <!-- ================= title ================= -->
  <text x="24" y="38" font-size="27" font-weight="600" fill="#1c1c1c">How the display's 14 pins reach the HT16K33</text>
  <text x="24" y="68" font-size="19" fill="#444">Every LED sits where one COM line crosses one ROW line. COM is the digit; ROW is the segment.</text>

  <!-- ================= column headers: ROW0..ROW7 ================= -->
  <g font-size="18" text-anchor="middle" font-weight="600" fill="#8a2b00">
    <text x="415" y="112">ROW0</text>
    <text x="490" y="112">ROW1</text>
    <text x="565" y="112">ROW2</text>
    <text x="640" y="112">ROW3</text>
    <text x="715" y="112">ROW4</text>
    <text x="790" y="112">ROW5</text>
    <text x="865" y="112">ROW6</text>
    <text x="940" y="112">ROW7</text>
  </g>
  <g font-size="24" text-anchor="middle" font-weight="700" fill="#1c1c1c">
    <text x="415" y="142">a</text><text x="490" y="142">b</text><text x="565" y="142">c</text>
    <text x="640" y="142">d</text><text x="715" y="142">e</text><text x="790" y="142">f</text>
    <text x="865" y="142">g</text><text x="940" y="142">DP</text>
  </g>
  <text x="990" y="128" font-size="17" fill="#666">anodes</text>

  <!-- vertical ROW lines -->
  <g stroke="#c98a5e" stroke-width="2.5">
    <line x1="415" y1="156" x2="415" y2="576"/><line x1="490" y1="156" x2="490" y2="576"/>
    <line x1="565" y1="156" x2="565" y2="576"/><line x1="640" y1="156" x2="640" y2="576"/>
    <line x1="715" y1="156" x2="715" y2="576"/><line x1="790" y1="156" x2="790" y2="576"/>
    <line x1="865" y1="156" x2="865" y2="576"/><line x1="940" y1="156" x2="940" y2="576"/>
  </g>

  <!-- ================= rows: COM0..COM4 ================= -->
  <!-- y positions: 196, 266, 336 (colon), 406, 476 -->
  <g font-size="20" text-anchor="end" font-weight="600">
    <text x="142" y="202" fill="#1449a0">COM0</text>
    <text x="142" y="272" fill="#1449a0">COM1</text>
    <text x="142" y="342" fill="#136b3a">COM2</text>
    <text x="142" y="412" fill="#1449a0">COM3</text>
    <text x="142" y="482" fill="#1449a0">COM4</text>
  </g>
  <g font-size="21" fill="#1c1c1c">
    <text x="158" y="202">digit 1</text>
    <text x="158" y="272">digit 2</text>
    <text x="158" y="342" fill="#136b3a" font-weight="600">the colon</text>
    <text x="158" y="412">digit 3</text>
    <text x="158" y="482">digit 4</text>
  </g>
  <g font-size="17" fill="#666">
    <text x="272" y="202">buffer[0]</text>
    <text x="272" y="272">buffer[2]</text>
    <text x="272" y="342">buffer[4]</text>
    <text x="272" y="412">buffer[6]</text>
    <text x="272" y="482">buffer[8]</text>
  </g>
  <text x="272" y="166" font-size="17" fill="#666">RAM address</text>
  <text x="46" y="166" font-size="17" fill="#666">cathodes</text>

  <!-- horizontal COM lines -->
  <g stroke="#7ea3d8" stroke-width="2.5">
    <line x1="360" y1="196" x2="990" y2="196"/>
    <line x1="360" y1="266" x2="990" y2="266"/>
    <line x1="360" y1="406" x2="990" y2="406"/>
    <line x1="360" y1="476" x2="990" y2="476"/>
  </g>
  <line x1="360" y1="336" x2="990" y2="336" stroke="#59a97a" stroke-width="3"/>

  <!-- LEDs at every crossing for the four digits -->
  <g fill="#2b2b2b">
    <g>
      <circle cx="415" cy="196" r="8"/><circle cx="490" cy="196" r="8"/><circle cx="565" cy="196" r="8"/>
      <circle cx="640" cy="196" r="8"/><circle cx="715" cy="196" r="8"/><circle cx="790" cy="196" r="8"/>
      <circle cx="865" cy="196" r="8"/><circle cx="940" cy="196" r="8"/>
    </g>
    <g>
      <circle cx="415" cy="266" r="8"/><circle cx="490" cy="266" r="8"/><circle cx="565" cy="266" r="8"/>
      <circle cx="640" cy="266" r="8"/><circle cx="715" cy="266" r="8"/><circle cx="790" cy="266" r="8"/>
      <circle cx="865" cy="266" r="8"/><circle cx="940" cy="266" r="8"/>
    </g>
    <g>
      <circle cx="415" cy="406" r="8"/><circle cx="490" cy="406" r="8"/><circle cx="565" cy="406" r="8"/>
      <circle cx="640" cy="406" r="8"/><circle cx="715" cy="406" r="8"/><circle cx="790" cy="406" r="8"/>
      <circle cx="865" cy="406" r="8"/><circle cx="940" cy="406" r="8"/>
    </g>
    <g>
      <circle cx="415" cy="476" r="8"/><circle cx="490" cy="476" r="8"/><circle cx="565" cy="476" r="8"/>
      <circle cx="640" cy="476" r="8"/><circle cx="715" cy="476" r="8"/><circle cx="790" cy="476" r="8"/>
      <circle cx="865" cy="476" r="8"/><circle cx="940" cy="476" r="8"/>
    </g>
  </g>

  <!-- the colon row: ONE LED, on ROW1, the same line as the b segments -->
  <circle cx="490" cy="336" r="11" fill="#136b3a"/>
  <g stroke="#136b3a" stroke-width="2.5" fill="none" stroke-dasharray="5 4">
    <rect x="464" y="310" width="52" height="52" rx="6"/>
  </g>
  <text x="1010" y="328" font-size="18" fill="#136b3a" font-weight="600">the colon's one LED pair</text>
  <text x="1010" y="352" font-size="18" fill="#136b3a">sits on ROW1 — the b line</text>
  <text x="1010" y="376" font-size="17" fill="#666">so bit 1 of buffer[4]</text>

  <!-- empty crossings on the colon row, drawn hollow so the absence is visible -->
  <g fill="none" stroke="#bbb" stroke-width="2">
    <circle cx="415" cy="336" r="8"/><circle cx="565" cy="336" r="8"/>
    <circle cx="640" cy="336" r="8"/><circle cx="715" cy="336" r="8"/><circle cx="790" cy="336" r="8"/>
    <circle cx="865" cy="336" r="8"/><circle cx="940" cy="336" r="8"/>
  </g>

  <!-- ================= the takeaway ================= -->
  <line x1="46" y1="546" x2="1284" y2="546" stroke="#ddd" stroke-width="1.5"/>
  <text x="46" y="588" font-size="21" fill="#1c1c1c">
    Bit <tspan font-weight="700">k</tspan> of the byte at RAM address <tspan font-weight="700">2n</tspan> is the LED where <tspan font-weight="700" fill="#1449a0">COMn</tspan> crosses <tspan font-weight="700" fill="#8a2b00">ROWk</tspan>.
  </text>
  <text x="46" y="622" font-size="21" fill="#1c1c1c">
    So <tspan font-family="monospace" font-size="20">buffer[0] = 0b00000001;</tspan> lights the <tspan font-weight="700">a</tspan> segment of digit 1, and bit 7 is always its decimal point.
  </text>
  <text x="46" y="662" font-size="19" fill="#666">
    The odd addresses hold ROW8 to ROW15, which this display does not use — which is why we send them as zero.
  </text>
  <text x="46" y="696" font-size="19" fill="#666">
    Five COM lines and eight ROW lines reach 34 LEDs: 4 digits × 8 segments, plus the colon.
  </text>
</svg>

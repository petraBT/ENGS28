<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1330 690" width="1330" height="690"
     font-family="Helvetica, Arial, sans-serif">
  <rect width="1330" height="690" fill="#ffffff"/>

  <!-- ================= title ================= -->
  <text x="24" y="34" font-size="21" font-weight="600" fill="#1c1c1c">How the display's 14 pins reach the HT16K33</text>
  <text x="24" y="60" font-size="15" fill="#444">Every LED sits where one COM line crosses one ROW line. COM is the digit; ROW is the segment.</text>

  <!-- ================= column headers: ROW0..ROW7 ================= -->
  <g font-size="14" text-anchor="middle">
    <text x="415" y="104" fill="#8a2b00" font-weight="600">ROW0</text>
    <text x="490" y="104" fill="#8a2b00" font-weight="600">ROW1</text>
    <text x="565" y="104" fill="#8a2b00" font-weight="600">ROW2</text>
    <text x="640" y="104" fill="#8a2b00" font-weight="600">ROW3</text>
    <text x="715" y="104" fill="#8a2b00" font-weight="600">ROW4</text>
    <text x="790" y="104" fill="#8a2b00" font-weight="600">ROW5</text>
    <text x="865" y="104" fill="#8a2b00" font-weight="600">ROW6</text>
    <text x="940" y="104" fill="#8a2b00" font-weight="600">ROW7</text>
  </g>
  <g font-size="19" text-anchor="middle" font-weight="700" fill="#1c1c1c">
    <text x="415" y="130">a</text><text x="490" y="130">b</text><text x="565" y="130">c</text>
    <text x="640" y="130">d</text><text x="715" y="130">e</text><text x="790" y="130">f</text>
    <text x="865" y="130">g</text><text x="940" y="130">DP</text>
  </g>
  <text x="985" y="119" font-size="13" fill="#666">anodes</text>

  <!-- vertical ROW lines -->
  <g stroke="#c98a5e" stroke-width="2">
    <line x1="415" y1="140" x2="415" y2="560"/><line x1="490" y1="140" x2="490" y2="560"/>
    <line x1="565" y1="140" x2="565" y2="560"/><line x1="640" y1="140" x2="640" y2="560"/>
    <line x1="715" y1="140" x2="715" y2="560"/><line x1="790" y1="140" x2="790" y2="560"/>
    <line x1="865" y1="140" x2="865" y2="560"/><line x1="940" y1="140" x2="940" y2="560"/>
  </g>

  <!-- ================= rows: COM0..COM4 ================= -->
  <!-- y positions: 180, 250, 320 (colon), 390, 460 -->
  <g font-size="15">
    <text x="150" y="185" text-anchor="end" fill="#1449a0" font-weight="600">COM0</text>
    <text x="150" y="255" text-anchor="end" fill="#1449a0" font-weight="600">COM1</text>
    <text x="150" y="325" text-anchor="end" fill="#136b3a" font-weight="600">COM2</text>
    <text x="150" y="395" text-anchor="end" fill="#1449a0" font-weight="600">COM3</text>
    <text x="150" y="465" text-anchor="end" fill="#1449a0" font-weight="600">COM4</text>
  </g>
  <g font-size="16" fill="#1c1c1c">
    <text x="164" y="185">digit 1</text>
    <text x="164" y="255">digit 2</text>
    <text x="164" y="325" fill="#136b3a" font-weight="600">the colon</text>
    <text x="164" y="395">digit 3</text>
    <text x="164" y="465">digit 4</text>
  </g>
  <g font-size="13" fill="#666">
    <text x="266" y="185">buffer[0]</text>
    <text x="266" y="255">buffer[2]</text>
    <text x="266" y="325">buffer[4]</text>
    <text x="266" y="395">buffer[6]</text>
    <text x="266" y="465">buffer[8]</text>
  </g>
  <text x="266" y="152" font-size="13" fill="#666">RAM address</text>
  <text x="60" y="152" font-size="13" fill="#666">cathodes</text>

  <!-- horizontal COM lines -->
  <g stroke="#7ea3d8" stroke-width="2">
    <line x1="345" y1="180" x2="985" y2="180"/>
    <line x1="345" y1="250" x2="985" y2="250"/>
    <line x1="345" y1="390" x2="985" y2="390"/>
    <line x1="345" y1="460" x2="985" y2="460"/>
  </g>
  <line x1="345" y1="320" x2="985" y2="320" stroke="#59a97a" stroke-width="2.5"/>

  <!-- LEDs at every crossing for the four digits -->
  <g fill="#2b2b2b">
    <!-- digit rows -->
    <g>
      <circle cx="415" cy="180" r="7"/><circle cx="490" cy="180" r="7"/><circle cx="565" cy="180" r="7"/>
      <circle cx="640" cy="180" r="7"/><circle cx="715" cy="180" r="7"/><circle cx="790" cy="180" r="7"/>
      <circle cx="865" cy="180" r="7"/><circle cx="940" cy="180" r="7"/>
    </g>
    <g>
      <circle cx="415" cy="250" r="7"/><circle cx="490" cy="250" r="7"/><circle cx="565" cy="250" r="7"/>
      <circle cx="640" cy="250" r="7"/><circle cx="715" cy="250" r="7"/><circle cx="790" cy="250" r="7"/>
      <circle cx="865" cy="250" r="7"/><circle cx="940" cy="250" r="7"/>
    </g>
    <g>
      <circle cx="415" cy="390" r="7"/><circle cx="490" cy="390" r="7"/><circle cx="565" cy="390" r="7"/>
      <circle cx="640" cy="390" r="7"/><circle cx="715" cy="390" r="7"/><circle cx="790" cy="390" r="7"/>
      <circle cx="865" cy="390" r="7"/><circle cx="940" cy="390" r="7"/>
    </g>
    <g>
      <circle cx="415" cy="460" r="7"/><circle cx="490" cy="460" r="7"/><circle cx="565" cy="460" r="7"/>
      <circle cx="640" cy="460" r="7"/><circle cx="715" cy="460" r="7"/><circle cx="790" cy="460" r="7"/>
      <circle cx="865" cy="460" r="7"/><circle cx="940" cy="460" r="7"/>
    </g>
  </g>

  <!-- the colon row: ONE LED, on ROW1, the same line as the b segments -->
  <circle cx="490" cy="320" r="10" fill="#136b3a"/>
  <g stroke="#136b3a" stroke-width="2" fill="none" stroke-dasharray="5 4">
    <rect x="466" y="296" width="48" height="48" rx="6"/>
  </g>
  <text x="1015" y="312" font-size="14" fill="#136b3a" font-weight="600">the colon's one LED pair</text>
  <text x="1015" y="332" font-size="14" fill="#136b3a">sits on ROW1 — the b line</text>
  <text x="1015" y="352" font-size="13" fill="#666">so bit 1 of buffer[4]</text>

  <!-- empty crossings on the colon row, drawn hollow so the absence is visible -->
  <g fill="none" stroke="#bbb" stroke-width="1.5">
    <circle cx="415" cy="320" r="7"/><circle cx="565" cy="320" r="7"/>
    <circle cx="640" cy="320" r="7"/><circle cx="715" cy="320" r="7"/><circle cx="790" cy="320" r="7"/>
    <circle cx="865" cy="320" r="7"/><circle cx="940" cy="320" r="7"/>
  </g>

  <!-- ================= the takeaway ================= -->
  <line x1="150" y1="530" x2="1240" y2="530" stroke="#ddd" stroke-width="1.5"/>
  <text x="150" y="566" font-size="16" fill="#1c1c1c">
    Bit <tspan font-weight="700">k</tspan> of the byte at RAM address <tspan font-weight="700">2n</tspan> is the LED where <tspan font-weight="700" fill="#1449a0">COMn</tspan> crosses <tspan font-weight="700" fill="#8a2b00">ROWk</tspan>.
  </text>
  <text x="150" y="592" font-size="16" fill="#1c1c1c">
    So <tspan font-family="monospace" font-size="15">buffer[0] = 0b00000001;</tspan> lights the <tspan font-weight="700">a</tspan> segment of digit 1, and bit 7 is always its decimal point.
  </text>
  <text x="150" y="626" font-size="15" fill="#666">
    The odd addresses hold ROW8 to ROW15, which this display does not use — which is why we send them as zero.
  </text>
  <text x="150" y="658" font-size="15" fill="#666">
    Five COM lines and eight ROW lines reach 34 LEDs: 4 digits × 8 segments, plus the colon.
  </text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 340" width="1220" height="340">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .box  { fill:#f4f6f8; stroke:#333; stroke-width:2.5; }
      .hot  { fill:#e8f0e4; stroke:#333; stroke-width:3; }
      .name { font:bold 25px Helvetica,Arial,sans-serif; fill:#1a1a1a; text-anchor:middle; }
      .sub  { font:18px Helvetica,Arial,sans-serif; fill:#555; text-anchor:middle; }
      .sig  { font:italic 20px Georgia,serif; fill:#222; text-anchor:middle; }
      .dom  { font:bold 17px Helvetica,Arial,sans-serif; fill:#666; text-anchor:middle; letter-spacing:1.5px; }
      .note { font:18px Helvetica,Arial,sans-serif; fill:#333; text-anchor:middle; }
      .wire { stroke:#333; stroke-width:2.5; fill:none; }
      .div  { stroke:#bbb; stroke-width:2; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <line class="div" x1="300" y1="26" x2="300" y2="250"/>
  <text class="dom" x="165" y="34">DISCRETE &#8212; INTEGERS</text>
  <text class="dom" x="760" y="34">CONTINUOUS &#8212; VOLTAGE, MOTION</text>

  <rect class="box" x="30"  y="108" width="210" height="104" rx="5"/>
  <text class="name" x="135" y="150">MCU</text>
  <text class="sub"  x="135" y="180">computes a command</text>

  <rect class="hot" x="330" y="108" width="210" height="104" rx="5"/>
  <text class="name" x="435" y="146">DAC</text>
  <text class="sub"  x="435" y="174">in practice, a PWM</text>
  <text class="sub"  x="435" y="196">(this chapter)</text>

  <rect class="hot" x="630" y="108" width="210" height="104" rx="5"/>
  <text class="name" x="735" y="146">Driver</text>
  <text class="sub"  x="735" y="174">the TB6612</text>
  <text class="sub"  x="735" y="196">(this chapter)</text>

  <rect class="box" x="930" y="108" width="210" height="104" rx="5"/>
  <text class="name" x="1035" y="146">Actuator</text>
  <text class="sub"  x="1035" y="180">the DC motor</text>

  <line class="wire" x1="240" y1="160" x2="322" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="281" y="142">integers</text>

  <line class="wire" x1="540" y1="160" x2="622" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="581" y="142">voltage</text>

  <line class="wire" x1="840" y1="160" x2="922" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="881" y="142">voltage</text>
  <text class="sub" x="881" y="238">&amp; current</text>

  <line class="wire" x1="1140" y1="160" x2="1210" y2="160" marker-end="url(#a)"/>
  <text class="sig" x="1178" y="142">motion</text>

  <text class="note" x="610" y="288">The actuator chain runs opposite to the sensor chain: numbers become motion.</text>
  <text class="note" x="610" y="314">Our MCU has no true DAC, so a PWM signal stands in for one.</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 400" width="1340" height="400">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .box  { fill:#f4f6f8; stroke:#333; stroke-width:3; }
      .hot  { fill:#e8f0e4; stroke:#333; stroke-width:3.5; }
      .name { font:bold 32px Helvetica,Arial,sans-serif; fill:#1a1a1a; text-anchor:middle; }
      .sub  { font:23px Helvetica,Arial,sans-serif; fill:#555; text-anchor:middle; }
      .sig  { font:italic 24px Georgia,serif; fill:#222; text-anchor:middle; }
      .dom  { font:bold 20px Helvetica,Arial,sans-serif; fill:#666; text-anchor:middle; letter-spacing:1.5px; }
      .note { font:23px Helvetica,Arial,sans-serif; fill:#333; text-anchor:middle; }
      .wire { stroke:#333; stroke-width:3; fill:none; }
      .div  { stroke:#bbb; stroke-width:2; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <line class="div" x1="280" y1="34" x2="280" y2="250"/>
  <text class="dom" x="145" y="30">DISCRETE</text>
  <text class="dom" x="145" y="54">INTEGERS</text>
  <text class="dom" x="800" y="42">CONTINUOUS</text>

  <rect class="box" x="20"  y="105" width="200" height="120" rx="6"/>
  <text class="name" x="120" y="155">MCU</text>
  <text class="sub"  x="120" y="188">STM32C031C6</text>

  <rect class="hot" x="340" y="105" width="200" height="120" rx="6"/>
  <text class="name" x="440" y="150">DAC</text>
  <text class="sub"  x="440" y="182">for us, a</text>
  <text class="sub"  x="440" y="208">PWM signal</text>

  <rect class="hot" x="660" y="105" width="200" height="120" rx="6"/>
  <text class="name" x="760" y="155">Driver</text>
  <text class="sub"  x="760" y="188">the TB6612</text>

  <rect class="box" x="980" y="105" width="200" height="120" rx="6"/>
  <text class="name" x="1080" y="155">Actuator</text>
  <text class="sub"  x="1080" y="188">the DC motor</text>

  <line class="wire" x1="220" y1="170" x2="332" y2="170" marker-end="url(#a)"/>
  <text class="sig" x="276" y="148">integers</text>

  <line class="wire" x1="540" y1="170" x2="652" y2="170" marker-end="url(#a)"/>
  <text class="sig" x="596" y="148">voltage</text>

  <line class="wire" x1="860" y1="170" x2="972" y2="170" marker-end="url(#a)"/>
  <text class="sig" x="916" y="136">voltage or</text>
  <text class="sig" x="916" y="160">current</text>

  <line class="wire" x1="1180" y1="170" x2="1290" y2="170" marker-end="url(#a)"/>
  <text class="sig" x="1235" y="148">motion</text>

  <text class="note" x="660" y="310">The actuator chain runs the sensor chain backwards: numbers become motion.</text>
  <text class="note" x="660" y="344">All but the smallest actuators need a driver, and our MCU has no true DAC,</text>
  <text class="note" x="660" y="378">so a PWM signal stands in for one.</text>
</svg>

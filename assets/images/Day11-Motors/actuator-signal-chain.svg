<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 330" width="1280" height="330">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .box  { fill:#f4f6f8; stroke:#333; stroke-width:2.5; }
      .hot  { fill:#e8f0e4; stroke:#333; stroke-width:3; }
      .name { font:bold 25px Helvetica,Arial,sans-serif; fill:#1a1a1a; text-anchor:middle; }
      .sub  { font:18px Helvetica,Arial,sans-serif; fill:#555; text-anchor:middle; }
      .sig  { font:italic 20px Georgia,serif; fill:#222; text-anchor:middle; }
      .dom  { font:bold 17px Helvetica,Arial,sans-serif; fill:#666; text-anchor:middle; letter-spacing:1.5px; }
      .note { font:18px Helvetica,Arial,sans-serif; fill:#333; text-anchor:middle; }
      .wire { stroke:#333; stroke-width:2.5; fill:none; }
      .div  { stroke:#bbb; stroke-width:2; stroke-dasharray:6 5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <line class="div" x1="286" y1="26" x2="286" y2="214"/>
  <text class="dom" x="158" y="34">DISCRETE &#8212; INTEGERS</text>
  <text class="dom" x="770" y="34">CONTINUOUS</text>

  <rect class="box" x="30"  y="96" width="200" height="100" rx="5"/>
  <text class="name" x="130" y="138">MCU</text>
  <text class="sub"  x="130" y="166">STM32C031C6</text>

  <rect class="hot" x="330" y="96" width="200" height="100" rx="5"/>
  <text class="name" x="430" y="132">DAC</text>
  <text class="sub"  x="430" y="160">for us, a PWM</text>
  <text class="sub"  x="430" y="182">signal</text>

  <rect class="hot" x="630" y="96" width="200" height="100" rx="5"/>
  <text class="name" x="730" y="138">Driver</text>
  <text class="sub"  x="730" y="166">the TB6612</text>

  <rect class="box" x="930" y="96" width="200" height="100" rx="5"/>
  <text class="name" x="1030" y="138">Actuator</text>
  <text class="sub"  x="1030" y="166">the DC motor</text>

  <line class="wire" x1="230" y1="146" x2="322" y2="146" marker-end="url(#a)"/>
  <text class="sig" x="276" y="128">integers</text>

  <line class="wire" x1="530" y1="146" x2="622" y2="146" marker-end="url(#a)"/>
  <text class="sig" x="576" y="128">voltage</text>

  <line class="wire" x1="830" y1="146" x2="922" y2="146" marker-end="url(#a)"/>
  <text class="sig" x="876" y="128">voltage or current</text>

  <line class="wire" x1="1130" y1="146" x2="1250" y2="146" marker-end="url(#a)"/>
  <text class="sig" x="1190" y="128">motion</text>
  <text class="sub" x="1190" y="172">World</text>

  <text class="note" x="640" y="262">The actuator chain runs the sensor chain backwards: numbers become motion.</text>
  <text class="note" x="640" y="292">All but the smallest actuators need a driver, and our MCU has no true DAC,</text>
  <text class="note" x="640" y="316">so a PWM signal stands in for one.</text>
</svg>

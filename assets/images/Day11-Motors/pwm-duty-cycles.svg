<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <style>
      .ax   { stroke:#333; stroke-width:2; fill:none; }
      .wave { stroke:#1a5fb4; stroke-width:3.5; fill:none; }
      .avg  { stroke:#c01c28; stroke-width:2.5; stroke-dasharray:9 6; fill:none; }
      .v    { font:17px Helvetica,Arial,sans-serif; fill:#333; text-anchor:end; }
      .duty { font:bold 21px Helvetica,Arial,sans-serif; fill:#1a1a1a; }
      .avgl { font:bold 17px Helvetica,Arial,sans-serif; fill:#c01c28; }
      .sm   { font:16px Helvetica,Arial,sans-serif; fill:#555; text-anchor:middle; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== 25% ===== -->
  <text class="duty" x="20" y="40">25% duty cycle</text>
  <line class="ax" x1="150" y1="50"  x2="150" y2="140"/>
  <line class="ax" x1="150" y1="140" x2="760" y2="140"/>
  <text class="v" x="142" y="56">5 V</text>
  <text class="v" x="142" y="146">0 V</text>
  <!-- period 150px, HIGH 25% = 37.5 -->
  <path class="wave" d="M150,50 L187,50 L187,140 L300,140 L300,50 L337,50 L337,140 L450,140 L450,50 L487,50 L487,140 L600,140 L600,50 L637,50 L637,140 L750,140"/>
  <line class="avg" x1="150" y1="117" x2="760" y2="117"/>
  <text class="avgl" x="768" y="123">1.25 V average</text>

  <!-- ===== 50% ===== -->
  <text class="duty" x="20" y="220">50% duty cycle</text>
  <line class="ax" x1="150" y1="230" x2="150" y2="320"/>
  <line class="ax" x1="150" y1="320" x2="760" y2="320"/>
  <text class="v" x="142" y="236">5 V</text>
  <text class="v" x="142" y="326">0 V</text>
  <path class="wave" d="M150,230 L225,230 L225,320 L300,320 L300,230 L375,230 L375,320 L450,320 L450,230 L525,230 L525,320 L600,320 L600,230 L675,230 L675,320 L750,320"/>
  <line class="avg" x1="150" y1="275" x2="760" y2="275"/>
  <text class="avgl" x="768" y="281">2.5 V average</text>

  <!-- ===== 75% ===== -->
  <text class="duty" x="20" y="400">75% duty cycle</text>
  <line class="ax" x1="150" y1="410" x2="150" y2="500"/>
  <line class="ax" x1="150" y1="500" x2="760" y2="500"/>
  <text class="v" x="142" y="416">5 V</text>
  <text class="v" x="142" y="506">0 V</text>
  <path class="wave" d="M150,410 L262,410 L262,500 L300,500 L300,410 L412,410 L412,500 L450,500 L450,410 L562,410 L562,500 L600,500 L600,410 L712,410 L712,500 L750,500"/>
  <line class="avg" x1="150" y1="433" x2="760" y2="433"/>
  <text class="avgl" x="768" y="439">3.75 V average</text>

  <text class="sm" x="450" y="540">The period is the same in all three; only the width of the HIGH pulse changes.</text>
</svg>

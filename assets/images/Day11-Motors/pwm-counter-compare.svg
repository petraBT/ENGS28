<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 490" width="820" height="490">
  <defs>
    <style>
      .axis { stroke:#333; stroke-width:2; fill:none; }
      .ramp { stroke:#1a5fb4; stroke-width:3; fill:none; }
      .out  { stroke:#c01c28; stroke-width:3; fill:none; }
      .cmp  { stroke:#e08000; stroke-width:2.5; stroke-dasharray:8 5; fill:none; }
      .guide{ stroke:#bbb; stroke-width:1.5; stroke-dasharray:4 4; fill:none; }
      .lbl  { font:20px Helvetica,Arial,sans-serif; fill:#222; }
      .lblb { font:bold 20px Helvetica,Arial,sans-serif; fill:#1a1a1a; }
      .sm   { font:16px Helvetica,Arial,sans-serif; fill:#555; }
      .cmpt { font:bold 17px Helvetica,Arial,sans-serif; fill:#a05000; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== Top panel: counter (ramp) vs compare ===== -->
  <text class="lblb" x="30" y="40">Counter CNT</text>
  <!-- axes -->
  <line class="axis" x1="90" y1="60"  x2="90"  y2="210"/>
  <line class="axis" x1="90" y1="210" x2="720" y2="210"/>
  <!-- top-value (ARR) line -->
  <line class="guide" x1="90" y1="60" x2="720" y2="60"/>
  <text class="sm" x="620" y="52">top value (ARR)</text>
  <text class="sm" x="52" y="216">0</text>

  <!-- ramp: 3 periods, x0 = 90,290,490 ; W=200 ; y 210(0) -> 60(top) -->
  <path class="ramp" d="M90,210 L290,60 L290,210 L490,60 L490,210 L690,60 L690,210"/>

  <!-- compare (CCR1) dashed line at 60% height: y = 210 - 0.6*150 = 120 -->
  <line class="cmp" x1="90" y1="120" x2="720" y2="120"/>
  <text class="cmpt" x="640" y="108">compare CCR1</text>

  <!-- crossings at x0 + 0.6*200 = 210, 410, 610 -->
  <line class="guide" x1="210" y1="120" x2="210" y2="380"/>
  <line class="guide" x1="410" y1="120" x2="410" y2="380"/>
  <line class="guide" x1="610" y1="120" x2="610" y2="380"/>
  <!-- period boundaries down to output -->
  <line class="guide" x1="290" y1="210" x2="290" y2="380"/>
  <line class="guide" x1="490" y1="210" x2="490" y2="380"/>

  <!-- ===== Bottom panel: PWM output ===== -->
  <text class="lblb" x="20" y="268">PWM output</text>
  <text class="sm" x="20" y="292">(HIGH while</text>
  <text class="sm" x="20" y="312">CNT &lt; CCR1)</text>
  <!-- HIGH y=300, LOW y=380 ; HIGH from x0 to x0+120, LOW to x0+200 -->
  <path class="out" d="M90,300 L210,300 L210,380 L290,380 L290,300 L410,300 L410,380 L490,380 L490,300 L610,300 L610,380 L690,380"/>
  <text class="sm" x="695" y="306">HIGH</text>
  <text class="sm" x="695" y="386">LOW</text>

  <!-- one period bracket -->
  <line class="axis" x1="90" y1="425" x2="290" y2="425"/>
  <line class="axis" x1="90" y1="420" x2="90" y2="430"/>
  <line class="axis" x1="290" y1="420" x2="290" y2="430"/>
  <text class="lbl" x="150" y="448">one period</text>

  <text class="sm" x="330" y="442">Raising CCR1 moves the dashed line up, so the ramp
  </text>
  <text class="sm" x="330" y="462">stays below it longer &#8212; a wider HIGH pulse.</text>
</svg>

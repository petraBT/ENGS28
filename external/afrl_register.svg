<svg viewBox="0 0 960 155" xmlns="http://www.w3.org/2000/svg" font-family="monospace" font-size="13">

  <!-- Title -->
  <text x="480" y="13" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">GPIOx_AFRL — GPIO Alternate Function Low Register (reset: 0x00000000)</text>

  <!-- Bit number labels above each boundary -->
  <text x="32"  y="26" text-anchor="start" font-size="11" fill="#888">31</text>
  <text x="143" y="26" text-anchor="end"   font-size="11" fill="#888">28</text>
  <text x="145" y="26" text-anchor="start" font-size="11" fill="#888">27</text>
  <text x="255" y="26" text-anchor="end"   font-size="11" fill="#888">24</text>
  <text x="257" y="26" text-anchor="start" font-size="11" fill="#888">23</text>
  <text x="367" y="26" text-anchor="end"   font-size="11" fill="#888">20</text>
  <text x="369" y="26" text-anchor="start" font-size="11" fill="#888">19</text>
  <text x="479" y="26" text-anchor="end"   font-size="11" fill="#888">16</text>
  <text x="481" y="26" text-anchor="start" font-size="11" fill="#1a4a8a" font-weight="bold">15</text>
  <text x="591" y="26" text-anchor="end"   font-size="11" fill="#1a4a8a" font-weight="bold">12</text>
  <text x="593" y="26" text-anchor="start" font-size="11" fill="#1a4a8a" font-weight="bold">11</text>
  <text x="703" y="26" text-anchor="end"   font-size="11" fill="#1a4a8a" font-weight="bold">8</text>
  <text x="705" y="26" text-anchor="start" font-size="11" fill="#888">7</text>
  <text x="815" y="26" text-anchor="end"   font-size="11" fill="#888">4</text>
  <text x="817" y="26" text-anchor="start" font-size="11" fill="#888">3</text>
  <text x="927" y="26" text-anchor="end"   font-size="11" fill="#888">0</text>

  <!-- AFSEL7 [31:28] — PA7 -->
  <rect x="32"  y="29" width="112" height="65" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="88"  y="57" text-anchor="middle" font-size="12" fill="#555">AFSEL7</text>
  <text x="88"  y="74" text-anchor="middle" font-size="11" fill="#777">PA7</text>

  <!-- AFSEL6 [27:24] — PA6 -->
  <rect x="144" y="29" width="112" height="65" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="200" y="57" text-anchor="middle" font-size="12" fill="#555">AFSEL6</text>
  <text x="200" y="74" text-anchor="middle" font-size="11" fill="#777">PA6</text>

  <!-- AFSEL5 [23:20] — PA5 -->
  <rect x="256" y="29" width="112" height="65" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="312" y="57" text-anchor="middle" font-size="12" fill="#555">AFSEL5</text>
  <text x="312" y="74" text-anchor="middle" font-size="11" fill="#777">PA5</text>

  <!-- AFSEL4 [19:16] — PA4 -->
  <rect x="368" y="29" width="112" height="65" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="424" y="57" text-anchor="middle" font-size="12" fill="#555">AFSEL4</text>
  <text x="424" y="74" text-anchor="middle" font-size="11" fill="#777">PA4</text>

  <!-- AFSEL3 [15:12] — PA3, highlighted -->
  <rect x="480" y="29" width="112" height="65" fill="#cce0ff" stroke="#1a4a8a" stroke-width="1.5"/>
  <text x="536" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a8a">AFSEL3</text>
  <text x="536" y="67" text-anchor="middle" font-size="11" fill="#1a4a8a">PA3</text>
  <text x="536" y="82" text-anchor="middle" font-size="11" fill="#1a4a8a">= 0001</text>

  <!-- AFSEL2 [11:8] — PA2, highlighted -->
  <rect x="592" y="29" width="112" height="65" fill="#cce0ff" stroke="#1a4a8a" stroke-width="1.5"/>
  <text x="648" y="52" text-anchor="middle" font-size="12" font-weight="bold" fill="#1a4a8a">AFSEL2</text>
  <text x="648" y="67" text-anchor="middle" font-size="11" fill="#1a4a8a">PA2</text>
  <text x="648" y="82" text-anchor="middle" font-size="11" fill="#1a4a8a">= 0001</text>

  <!-- AFSEL1 [7:4] — PA1 -->
  <rect x="704" y="29" width="112" height="65" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="760" y="57" text-anchor="middle" font-size="12" fill="#555">AFSEL1</text>
  <text x="760" y="74" text-anchor="middle" font-size="11" fill="#777">PA1</text>

  <!-- AFSEL0 [3:0] — PA0 -->
  <rect x="816" y="29" width="112" height="65" fill="#e8e8e8" stroke="#999" stroke-width="1"/>
  <text x="872" y="57" text-anchor="middle" font-size="12" fill="#555">AFSEL0</text>
  <text x="872" y="74" text-anchor="middle" font-size="11" fill="#777">PA0</text>

  <!-- Note -->
  <text x="480" y="115" text-anchor="middle" font-size="11" fill="#555">Each 4-bit field selects AF0–AF15 for its pin.  Writing 0001 to AFSEL2 and AFSEL3 selects AF1 = USART2.</text>

</svg>

<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 700 360" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" role="img">
  <title>GATT attribute hierarchy for the Bluefruit UART service</title>
  <desc>A nested box diagram showing the GATT server hierarchy. The outermost
  box represents the peripheral (Bluefruit module). Inside are two service boxes
  side by side. The left box (solid border) is the UART service containing two
  characteristics: RX (Write permission, phone to STM32) and TX (Notify
  permission, STM32 to phone). The right box (dashed border, greyed) is the
  Battery service, shown as an example of a second service, containing a single
  Battery Level characteristic with Read permission.</desc>

  <!-- ── Peripheral / GATT Server outer box ──────────────────────────── -->
  <rect x="10" y="10" width="680" height="340" rx="6"
        fill="#f0f6ff" stroke="#1d4ed8" stroke-width="2"/>
  <text x="350" y="32" text-anchor="middle"
        font-size="13" font-weight="bold" fill="#1d4ed8">
    GATT Server — Peripheral (Bluefruit module)
  </text>

  <!-- ── UART Service (left, emphasis) ───────────────────────────────── -->
  <rect x="26" y="44" width="308" height="294" rx="4"
        fill="white" stroke="#3b82f6" stroke-width="1.5"/>
  <!-- header band -->
  <rect x="26" y="44" width="308" height="30" rx="4" fill="#dbeafe"/>
  <rect x="26"  y="62" width="308" height="12" fill="#dbeafe"/>
  <text x="180" y="60" text-anchor="middle"
        font-size="12" font-weight="bold" fill="#1e40af">UART Service</text>
  <text x="180" y="75" text-anchor="middle"
        font-size="9" fill="#3b82f6">UUID: 6E400001-B5A3-F393-E0A9-E50E24DCCA9E</text>

  <!-- RX Characteristic -->
  <rect x="42" y="84" width="276" height="106" rx="3"
        fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="180" y="103" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#1e40af">RX Characteristic</text>
  <text x="180" y="117" text-anchor="middle"
        font-size="9" fill="#3b82f6">UUID: 6E400002-...</text>
  <!-- permission pill -->
  <rect x="148" y="123" width="46" height="15" rx="7" fill="#bbf7d0"/>
  <text x="171" y="134" text-anchor="middle"
        font-size="9" font-weight="bold" fill="#166534">Write</text>
  <text x="180" y="153" text-anchor="middle"
        font-size="10" fill="#374151">Phone app → STM32</text>
  <text x="180" y="168" text-anchor="middle"
        font-size="9" fill="#6b7280">bytes the phone sends to your firmware</text>

  <!-- TX Characteristic -->
  <rect x="42" y="204" width="276" height="106" rx="3"
        fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="180" y="223" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#1e40af">TX Characteristic</text>
  <text x="180" y="237" text-anchor="middle"
        font-size="9" fill="#3b82f6">UUID: 6E400003-...</text>
  <!-- permission pill -->
  <rect x="140" y="243" width="58" height="15" rx="7" fill="#fef08a"/>
  <text x="169" y="254" text-anchor="middle"
        font-size="9" font-weight="bold" fill="#92400e">Notify</text>
  <text x="180" y="273" text-anchor="middle"
        font-size="10" fill="#374151">STM32 → Phone app</text>
  <text x="180" y="288" text-anchor="middle"
        font-size="9" fill="#6b7280">Bluefruit pushes update whenever STM32 sends</text>

  <!-- ── Battery Service (right, greyed — shows multiple services exist) -->
  <rect x="366" y="44" width="308" height="294" rx="4"
        fill="#fafafa" stroke="#d1d5db" stroke-width="1.5"
        stroke-dasharray="6,3"/>
  <!-- header band -->
  <rect x="366" y="44" width="308" height="30" rx="4" fill="#f3f4f6"/>
  <rect x="366"  y="62" width="308" height="12" fill="#f3f4f6"/>
  <text x="520" y="60" text-anchor="middle"
        font-size="12" font-weight="bold" fill="#9ca3af">Battery Service</text>
  <text x="520" y="75" text-anchor="middle"
        font-size="9" fill="#9ca3af">UUID: 0x180F  (Bluetooth standard)</text>

  <!-- Battery Level Characteristic -->
  <rect x="382" y="84" width="276" height="106" rx="3"
        fill="#f9fafb" stroke="#e5e7eb" stroke-width="1"/>
  <text x="520" y="103" text-anchor="middle"
        font-size="11" font-weight="bold" fill="#9ca3af">Battery Level</text>
  <text x="520" y="117" text-anchor="middle"
        font-size="9" fill="#9ca3af">UUID: 0x2A19  (Bluetooth standard)</text>
  <!-- permission pill -->
  <rect x="490" y="123" width="40" height="15" rx="7" fill="#e5e7eb"/>
  <text x="510" y="134" text-anchor="middle"
        font-size="9" font-weight="bold" fill="#6b7280">Read</text>
  <text x="520" y="153" text-anchor="middle"
        font-size="10" fill="#9ca3af">Remaining charge, 0–100 %</text>
  <text x="520" y="168" text-anchor="middle"
        font-size="9" fill="#9ca3af">read-only; no writes or notifications</text>

  <!-- explanatory note in lower right -->
  <text x="520" y="230" text-anchor="middle"
        font-size="10" fill="#9ca3af" font-style="italic">A peripheral can host many services.</text>
  <text x="520" y="248" text-anchor="middle"
        font-size="10" fill="#9ca3af" font-style="italic">The UART service (left) is the one</text>
  <text x="520" y="266" text-anchor="middle"
        font-size="10" fill="#9ca3af" font-style="italic">used in this chapter.  The Battery</text>
  <text x="520" y="284" text-anchor="middle"
        font-size="10" fill="#9ca3af" font-style="italic">service is shown as an example of</text>
  <text x="520" y="302" text-anchor="middle"
        font-size="10" fill="#9ca3af" font-style="italic">a second co-existing service.</text>

</svg>

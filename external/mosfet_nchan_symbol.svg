<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 380 320" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" role="img">
  <title>N-channel enhancement MOSFET schematic symbol</title>
  <desc>Simplified schematic symbol for an N-channel enhancement-mode MOSFET,
  matching the style from slide 21 of the ENGS 28 BJT/MOSFET lecture.
  Gate (G) on the left. A thick gate plate and oxide gap separate the gate from
  the body. Three horizontal body stubs (enhancement mode) form the left side of
  the body region. A solid filled triangle pointing LEFT (inward) indicates
  N-channel polarity. D exits at the top right; S at the bottom right.</desc>

  <!-- G terminal line -->
  <line x1="52" y1="155" x2="144" y2="155"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Gate plate: thick vertical bar -->
  <line x1="150" y1="110" x2="150" y2="200"
        stroke="#222" stroke-width="6" stroke-linecap="butt"/>

  <!-- Oxide gap: x=153 to x=163 — visible insulating gap -->

  <!-- Three horizontal body stubs (enhancement mode body representation) -->
  <!-- Top stub — at D-connection level (y=110) -->
  <line x1="163" y1="110" x2="178" y2="110"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Middle stub — at gate line level (y=155), gate is capacitively coupled here -->
  <line x1="163" y1="155" x2="178" y2="155"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Bottom stub — at S-connection level (y=200) -->
  <line x1="163" y1="200" x2="178" y2="200"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- D stub: horizontal top of body region from body-left to right rail -->
  <line x1="163" y1="110" x2="242" y2="110"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- S stub: horizontal bottom of body region from body-left to right rail -->
  <line x1="163" y1="200" x2="242" y2="200"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Right rail: vertical from D stub to S stub -->
  <line x1="242" y1="110" x2="242" y2="200"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- N-channel body arrow: solid filled triangle pointing LEFT (inward toward gate)
       Tip at left-center of body region; base spans D-stub to S-stub on right side -->
  <polygon points="180,155 236,118 236,192" fill="#222"/>

  <!-- D terminal: from D-stub / right-rail top junction UP to D label -->
  <line x1="242" y1="110" x2="242" y2="42"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- S terminal: from S-stub / right-rail bottom junction DOWN to S label -->
  <line x1="242" y1="200" x2="242" y2="278"
        stroke="#222" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Terminal labels -->
  <text x="26"  y="161" font-size="22" font-weight="bold" fill="#b71c1c">G</text>
  <text x="251" y="46"  font-size="22" font-weight="bold" fill="#b71c1c">D</text>
  <text x="251" y="286" font-size="22" font-weight="bold" fill="#1b5e20">S</text>

  <!-- Symbol label -->
  <text x="40" y="315" font-size="12" fill="#aaa">N-ch enh. MOSFET</text>
</svg>

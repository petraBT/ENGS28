<?xml version="1.0" encoding="UTF-8"?>
<svg width="1040" height="300" viewBox="0 0 1040 300" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <title>An I2C message, field by field</title>
  <desc>One I2C message drawn as a row of labelled fields: Start, a 7-bit address
  frame, the Read/Write bit, an ACK/NACK bit, an 8-bit data frame, an ACK/NACK bit,
  a second 8-bit data frame, an ACK/NACK bit, and Stop. Braces underneath group the
  address frame and the two data frames; a brace above spans the whole message.
  Arrows mark the Start condition at the left and the Stop condition at the right.</desc>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#222"/>
    </marker>
  </defs>

  <!-- brace over the whole message -->
  <path d="M 40 54 q 0 -14 14 -14 h 452 q 14 0 14 -14 q 0 14 14 14 h 452 q 14 0 14 14"
        fill="none" stroke="#222" stroke-width="3"/>
  <text x="520" y="20" font-size="23" font-weight="bold" text-anchor="middle" fill="#222">Message</text>

  <!-- field boxes: Start | 7 bits | R/W | ACK | 8 bits | ACK | 8 bits | ACK | Stop -->
  <g stroke="#222" stroke-width="2">
    <rect x="40"   y="68" width="74"  height="64" fill="#e6e6e6"/>
    <rect x="114"  y="68" width="226" height="64" fill="#e6e6e6"/>
    <rect x="340"  y="68" width="86"  height="64" fill="#e6e6e6"/>
    <rect x="426"  y="68" width="80"  height="64" fill="#ffffff"/>
    <rect x="506"  y="68" width="140" height="64" fill="#e6e6e6"/>
    <rect x="646"  y="68" width="80"  height="64" fill="#ffffff"/>
    <rect x="726"  y="68" width="140" height="64" fill="#e6e6e6"/>
    <rect x="866"  y="68" width="80"  height="64" fill="#ffffff"/>
    <rect x="946"  y="68" width="74"  height="64" fill="#e6e6e6"/>
  </g>

  <text x="77"  y="107" font-size="18" text-anchor="middle" fill="#111">Start</text>
  <text x="227" y="109" font-size="25" text-anchor="middle" fill="#111">7 Bits</text>
  <text x="383" y="91"  font-size="14" text-anchor="middle" fill="#111">Read/</text>
  <text x="383" y="108" font-size="14" text-anchor="middle" fill="#111">Write</text>
  <text x="383" y="125" font-size="14" text-anchor="middle" fill="#111">Bit</text>
  <text x="466" y="91"  font-size="14" text-anchor="middle" fill="#111">ACK/</text>
  <text x="466" y="108" font-size="14" text-anchor="middle" fill="#111">NACK</text>
  <text x="466" y="125" font-size="14" text-anchor="middle" fill="#111">Bit</text>
  <text x="576" y="109" font-size="25" text-anchor="middle" fill="#111">8 Bits</text>
  <text x="686" y="91"  font-size="14" text-anchor="middle" fill="#111">ACK/</text>
  <text x="686" y="108" font-size="14" text-anchor="middle" fill="#111">NACK</text>
  <text x="686" y="125" font-size="14" text-anchor="middle" fill="#111">Bit</text>
  <text x="796" y="109" font-size="25" text-anchor="middle" fill="#111">8 Bits</text>
  <text x="906" y="91"  font-size="14" text-anchor="middle" fill="#111">ACK/</text>
  <text x="906" y="108" font-size="14" text-anchor="middle" fill="#111">NACK</text>
  <text x="906" y="125" font-size="14" text-anchor="middle" fill="#111">Bit</text>
  <text x="983" y="107" font-size="18" text-anchor="middle" fill="#111">Stop</text>

  <!-- braces under the grouped frames -->
  <path d="M 116 150 q 0 12 12 12 h 87 q 12 0 12 12 q 0 -12 12 -12 h 87 q 12 0 12 -12"
        fill="none" stroke="#222" stroke-width="3"/>
  <text x="227" y="202" font-size="18" text-anchor="middle" fill="#222">Address Frame</text>

  <path d="M 508 150 q 0 12 10 12 h 46 q 12 0 12 12 q 0 -12 12 -12 h 46 q 10 0 10 -12"
        fill="none" stroke="#222" stroke-width="3"/>
  <text x="576" y="202" font-size="18" text-anchor="middle" fill="#222">Data Frame 1</text>

  <path d="M 728 150 q 0 12 10 12 h 46 q 12 0 12 12 q 0 -12 12 -12 h 46 q 10 0 10 -12"
        fill="none" stroke="#222" stroke-width="3"/>
  <text x="796" y="202" font-size="18" text-anchor="middle" fill="#222">Data Frame 2</text>

  <!-- start / stop condition arrows -->
  <path d="M 46 252 L 72 140" stroke="#222" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <path d="M 1012 252 L 988 140" stroke="#222" stroke-width="3" fill="none" marker-end="url(#ar)"/>
  <text x="34"   y="274" font-size="18" text-anchor="start" fill="#222">Start Condition</text>
  <text x="1024" y="274" font-size="18" text-anchor="end"   fill="#222">Stop Condition</text>
</svg>

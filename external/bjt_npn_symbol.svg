<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 420 320" xmlns="http://www.w3.org/2000/svg"
     font-family="sans-serif" role="img">
  <title>NPN BJT schematic symbol</title>
  <desc>Standard schematic symbol for an NPN bipolar junction transistor,
  shown inside the traditional transistor package circle.
  The base (B) enters from the left. The collector (C) exits at upper right;
  the emitter (E) exits at lower right with an arrow pointing outward (away from
  the base), indicating NPN polarity. A small base current I_B controls a much
  larger collector current: I_C = h_FE × I_B.</desc>

  <!-- Transistor package circle (drawn first so other elements sit on top) -->
  <circle cx="215" cy="150" r="78"
          fill="white" stroke="#222" stroke-width="2.5"/>

  <!-- Body bar (vertical) — inside circle -->
  <line x1="185" y1="90" x2="185" y2="210"
        stroke="#222" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Base terminal (horizontal) — enters from left, passes into circle -->
  <line x1="52" y1="150" x2="184" y2="150"
        stroke="#222" stroke-width="2" stroke-linecap="round"/>

  <!-- Collector: diagonal then vertical terminal — exits circle at upper right -->
  <line x1="185" y1="107" x2="278" y2="57"
        stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="278" y1="57" x2="278" y2="18"
        stroke="#222" stroke-width="2" stroke-linecap="round"/>

  <!-- Emitter: diagonal then vertical terminal — exits circle at lower right -->
  <line x1="185" y1="193" x2="278" y2="243"
        stroke="#222" stroke-width="2" stroke-linecap="round"/>
  <line x1="278" y1="243" x2="278" y2="285"
        stroke="#222" stroke-width="2" stroke-linecap="round"/>

  <!-- NPN emitter arrow — pointing outward (away from body bar) along emitter diagonal -->
  <!-- Emitter direction (93,50): unit≈(0.881,0.474); perp≈(-0.474,0.881)            -->
  <!-- Tip at t=0.58: (185+54,193+29)=(239,222); base at t=0.44: (226,215)            -->
  <!-- Wings ±6px perp: (226-2.8,215+5.3)=(223,220) and (226+2.8,215-5.3)=(229,210)  -->
  <polygon points="223,220 239,222 229,210" fill="#222"/>

  <!-- ── Terminal labels ──────────────────────────────────────────────── -->
  <text x="25"  y="156" font-size="20" font-weight="bold" fill="#1a237e">B</text>
  <text x="284" y="20"  font-size="20" font-weight="bold" fill="#b71c1c">C</text>
  <text x="284" y="303" font-size="20" font-weight="bold" fill="#1b5e20">E</text>

  <!-- ── Current arrows ───────────────────────────────────────────────── -->
  <!-- I_C: downward arrow into collector (above C label) -->
  <polygon points="275,30 278,42 281,30" fill="#b71c1c"/>
  <text x="286" y="40" font-size="13" fill="#b71c1c" font-style="italic">I</text>
  <text x="295" y="43" font-size="9.5" fill="#b71c1c">C</text>

  <!-- I_B: rightward arrow into base (midpoint of base line, outside circle) -->
  <polygon points="113,147 125,150 113,153" fill="#1a237e"/>
  <text x="75"  y="142" font-size="13" fill="#1a237e" font-style="italic">I</text>
  <text x="84"  y="145" font-size="9.5" fill="#1a237e">B</text>

  <!-- I_E: downward arrow out of emitter (below circle, above E label) -->
  <polygon points="275,255 278,267 281,255" fill="#1b5e20"/>
  <text x="285" y="265" font-size="13" fill="#1b5e20" font-style="italic">I</text>
  <text x="294" y="268" font-size="9.5" fill="#1b5e20">E</text>

  <!-- ── Annotation box ─────────────────────────────────────────────── -->
  <rect x="10" y="267" width="148" height="40" rx="4"
        fill="#fafafa" stroke="#ccc" stroke-width="1"/>
  <text x="84" y="283" text-anchor="middle" font-size="13" fill="#333">
    <tspan font-style="italic">I</tspan><tspan dy="2" font-size="9.5">C</tspan>
    <tspan dy="-2"> = h</tspan><tspan dy="2" font-size="9.5">FE</tspan>
    <tspan dy="-2"> × </tspan>
    <tspan font-style="italic">I</tspan><tspan dy="2" font-size="9.5">B</tspan>
  </text>
  <text x="84" y="300" text-anchor="middle" font-size="10" fill="#777">
    (h<tspan dy="2" font-size="8">FE</tspan><tspan dy="-2"> = β ≈ 50–300)</tspan>
  </text>

  <!-- NPN BJT label -->
  <text x="352" y="155" text-anchor="middle" font-size="12" fill="#aaa">NPN BJT</text>
</svg>

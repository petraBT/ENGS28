<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" font-family="Helvetica, Arial, sans-serif">
<defs>
<marker id="fk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#44546A"/></marker>
<marker id="fg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#38761D"/></marker>
<marker id="fr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B00000"/></marker>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<!-- main loop column -->
<text x="150" y="42" font-size="24" fill="#111111" font-weight="bold">main() loop</text>
<rect x="60" y="60"  width="260" height="56" fill="#DCE6F1" stroke="#44546A" stroke-width="2.5" rx="6"/>
<text x="190" y="95" font-size="22" text-anchor="middle">initialize ADC and timer</text>
<rect x="60" y="150" width="260" height="56" fill="#EDE7F6" stroke="#44546A" stroke-width="2.5" rx="6"/>
<text x="190" y="185" font-size="22" text-anchor="middle">start ADC conversion</text>
<rect x="60" y="240" width="260" height="56" fill="#EDE7F6" stroke="#44546A" stroke-width="2.5" rx="6"/>
<text x="190" y="275" font-size="22" text-anchor="middle">read sensor value</text>
<rect x="60" y="330" width="260" height="56" fill="#EDE7F6" stroke="#44546A" stroke-width="2.5" rx="6"/>
<text x="190" y="365" font-size="22" text-anchor="middle">print value</text>
<rect x="60" y="420" width="260" height="56" fill="#EDE7F6" stroke="#44546A" stroke-width="2.5" rx="6"/>
<text x="190" y="455" font-size="22" text-anchor="middle">delay_ms(1000)</text>
<line x1="190" y1="116" x2="190" y2="144" stroke="#44546A" stroke-width="3" marker-end="url(#fk)"/>
<line x1="190" y1="206" x2="190" y2="234" stroke="#44546A" stroke-width="3" marker-end="url(#fk)"/>
<line x1="190" y1="296" x2="190" y2="324" stroke="#44546A" stroke-width="3" marker-end="url(#fk)"/>
<line x1="190" y1="386" x2="190" y2="414" stroke="#44546A" stroke-width="3" marker-end="url(#fk)"/>
<path d="M 190 476 L 190 520 L 30 520 L 30 178 L 54 178" fill="none" stroke="#44546A" stroke-width="3" marker-end="url(#fk)"/>
<text x="106" y="545" font-size="20" fill="#44546A">repeat</text>
<!-- execution timeline bar -->
<rect x="420" y="60" width="34" height="480" fill="#E6E0EC" stroke="#8064A2" stroke-width="2"/>
<text x="437" y="575" font-size="20" text-anchor="middle" fill="#8064A2">time</text>
<text x="437" y="46" font-size="20" text-anchor="middle" fill="#8064A2">CPU</text>
<!-- ISR box -->
<rect x="700" y="200" width="360" height="130" fill="#EDF7ED" stroke="#38761D" stroke-width="3" rx="10"/>
<text x="880" y="238" font-size="23" text-anchor="middle" font-weight="bold">timer ISR</text>
<text x="880" y="270" font-size="21" text-anchor="middle">clear the update flag UIF</text>
<text x="880" y="298" font-size="21" text-anchor="middle">toggle the LED</text>
<!-- first interrupt: solid -->
<line x1="560" y1="150" x2="460" y2="165" stroke="#B00000" stroke-width="3.5" marker-end="url(#fr)"/>
<text x="570" y="147" font-size="21" fill="#B00000">timer interrupt</text>
<path d="M 454 170 L 640 170 L 640 230 L 694 230" fill="none" stroke="#38761D" stroke-width="3.5" marker-end="url(#fg)"/>
<path d="M 694 310 L 560 310 L 456 172" fill="none" stroke="#38761D" stroke-width="3.5" marker-end="url(#fg)"/>
<text x="662" y="182" font-size="19" fill="#38761D">suspend main, run the ISR</text>
<text x="470" y="356" font-size="19" fill="#38761D">resume exactly where main was</text>
<!-- second interrupt: dashed -->
<line x1="560" y1="420" x2="460" y2="435" stroke="#B00000" stroke-width="3.5" marker-end="url(#fr)"/>
<text x="570" y="417" font-size="21" fill="#B00000">next timer interrupt</text>
<path d="M 454 440 L 830 440 L 830 336" fill="none" stroke="#38761D" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#fg)"/>
<path d="M 950 336 L 950 470 L 560 470 L 456 442" fill="none" stroke="#38761D" stroke-width="3" stroke-dasharray="10 7" marker-end="url(#fg)"/>
<text x="700" y="505" font-size="19" fill="#38761D">same sequence, later &#8212; even mid-delay</text>
<!-- side note -->
<text x="700" y="80" font-size="22" fill="#B00000" font-weight="bold">handling an interrupt request:</text>
<text x="700" y="108" font-size="21" fill="#B00000">suspend main &#8226; save CPU state &#8226; run ISR</text>
<text x="700" y="136" font-size="21" fill="#B00000">restore CPU state &#8226; resume main</text>
</svg>
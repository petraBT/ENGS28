<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470">
  <rect width="100%" height="100%" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111111" stroke="#111111"
     stroke-width="2.6" stroke-linecap="round" fill-opacity="1">

    <!-- ================= LEFT: two push-pull outputs on one wire ============ -->
    <text x="230" y="34" font-size="21" font-weight="bold" text-anchor="middle"
          stroke="none">Two push-pull outputs, disagreeing</text>

    <!-- device A -->
    <line x1="60"  y1="70"  x2="200" y2="70"/>
    <text x="130" y="60" font-size="16" text-anchor="middle" stroke="none">3.3 V</text>
    <rect x="98" y="98" width="64" height="42" fill="none"/>
    <text x="130" y="125" font-size="15" text-anchor="middle" stroke="none">ON</text>
    <line x1="130" y1="70"  x2="130" y2="98"/>
    <line x1="130" y1="140" x2="130" y2="200"/>
    <rect x="98" y="200" width="64" height="42" fill="none"/>
    <text x="130" y="227" font-size="15" text-anchor="middle" stroke="none">off</text>
    <line x1="130" y1="242" x2="130" y2="290"/>
    <line x1="90"  y1="290" x2="170" y2="290"/>
    <line x1="102" y1="300" x2="158" y2="300"/>
    <line x1="114" y1="310" x2="146" y2="310"/>
    <text x="130" y="333" font-size="16" text-anchor="middle" stroke="none">GND</text>
    <rect x="76" y="76" width="108" height="18" fill="#ffffff" stroke="none"/>
    <text x="130" y="90" font-size="14" text-anchor="middle" stroke="none" fill="#CC0000">driving HIGH</text>

    <!-- device B -->
    <line x1="260" y1="70"  x2="400" y2="70"/>
    <text x="330" y="60" font-size="16" text-anchor="middle" stroke="none">3.3 V</text>
    <rect x="298" y="98" width="64" height="42" fill="none"/>
    <text x="330" y="125" font-size="15" text-anchor="middle" stroke="none">off</text>
    <line x1="330" y1="70"  x2="330" y2="98"/>
    <line x1="330" y1="140" x2="330" y2="200"/>
    <rect x="298" y="200" width="64" height="42" fill="none"/>
    <text x="330" y="227" font-size="15" text-anchor="middle" stroke="none">ON</text>
    <line x1="330" y1="242" x2="330" y2="290"/>
    <line x1="290" y1="290" x2="370" y2="290"/>
    <line x1="302" y1="300" x2="358" y2="300"/>
    <line x1="314" y1="310" x2="346" y2="310"/>
    <text x="330" y="333" font-size="16" text-anchor="middle" stroke="none">GND</text>
    <rect x="278" y="76" width="104" height="18" fill="#ffffff" stroke="none"/>
    <text x="330" y="90" font-size="14" text-anchor="middle" stroke="none" fill="#CC0000">driving LOW</text>

    <!-- the shared wire -->
    <line x1="130" y1="170" x2="330" y2="170" stroke="#CC0000" stroke-width="4"/>
    <circle cx="130" cy="170" r="5" fill="#111111" stroke="none"/>
    <circle cx="330" cy="170" r="5" fill="#111111" stroke="none"/>
    <text x="230" y="163" font-size="16" text-anchor="middle" stroke="none">one wire</text>
    <text x="230" y="400" font-size="17" text-anchor="middle" stroke="none" fill="#CC0000"
          font-weight="bold">3.3 V straight to ground,</text>
    <text x="230" y="424" font-size="17" text-anchor="middle" stroke="none" fill="#CC0000"
          font-weight="bold">through two transistors</text>
    <text x="230" y="450" font-size="15" text-anchor="middle" stroke="none">Nothing decides the level.</text>

    <!-- divider -->
    <line x1="480" y1="20" x2="480" y2="450" stroke="#999999" stroke-width="1.5"
          stroke-dasharray="7 7"/>

    <!-- ================= RIGHT: two open-drain outputs on one wire ========== -->
    <text x="720" y="34" font-size="21" font-weight="bold" text-anchor="middle"
          stroke="none">Two open-drain outputs, disagreeing</text>

    <!-- the one pull-up -->
    <line x1="560" y1="70" x2="880" y2="70"/>
    <text x="720" y="60" font-size="16" text-anchor="middle" stroke="none">3.3 V</text>
    <line x1="720" y1="70" x2="720" y2="96"/>
    <rect x="702" y="96" width="36" height="58" fill="none"/>
    <line x1="720" y1="154" x2="720" y2="170"/>
    <text x="770" y="132" font-size="16" stroke="none">pull-up</text>

    <!-- device A: released -->
    <line x1="620" y1="170" x2="620" y2="200"/>
    <rect x="588" y="200" width="64" height="42" fill="none"/>
    <text x="620" y="227" font-size="15" text-anchor="middle" stroke="none">off</text>
    <line x1="620" y1="242" x2="620" y2="290"/>
    <line x1="580" y1="290" x2="660" y2="290"/>
    <line x1="592" y1="300" x2="648" y2="300"/>
    <line x1="604" y1="310" x2="636" y2="310"/>
    <text x="620" y="333" font-size="16" text-anchor="middle" stroke="none">GND</text>
    <rect x="578" y="180" width="84" height="18" fill="#ffffff" stroke="none"/>
    <text x="620" y="194" font-size="14" text-anchor="middle" stroke="none">releasing</text>

    <!-- device B: pulling low -->
    <line x1="830" y1="170" x2="830" y2="200"/>
    <rect x="798" y="200" width="64" height="42" fill="none"/>
    <text x="830" y="227" font-size="15" text-anchor="middle" stroke="none">ON</text>
    <line x1="830" y1="242" x2="830" y2="290"/>
    <line x1="790" y1="290" x2="870" y2="290"/>
    <line x1="802" y1="300" x2="858" y2="300"/>
    <line x1="814" y1="310" x2="846" y2="310"/>
    <text x="830" y="333" font-size="16" text-anchor="middle" stroke="none">GND</text>
    <rect x="778" y="180" width="104" height="18" fill="#ffffff" stroke="none"/>
    <text x="830" y="194" font-size="14" text-anchor="middle" stroke="none">pulling LOW</text>

    <!-- shared wire -->
    <line x1="620" y1="170" x2="830" y2="170" stroke="#38761D" stroke-width="4"/>
    <circle cx="620" cy="170" r="5" fill="#111111" stroke="none"/>
    <circle cx="830" cy="170" r="5" fill="#111111" stroke="none"/>
    <circle cx="720" cy="170" r="5" fill="#111111" stroke="none"/>
    <text x="720" y="400" font-size="17" text-anchor="middle" stroke="none" fill="#38761D"
          font-weight="bold">No path from 3.3 V to ground</text>
    <text x="720" y="424" font-size="17" text-anchor="middle" stroke="none" fill="#38761D"
          font-weight="bold">except through the resistor.</text>
    <text x="720" y="450" font-size="15" text-anchor="middle" stroke="none">The wire reads LOW.</text>
  </g>
</svg>

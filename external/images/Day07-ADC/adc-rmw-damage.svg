<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 640" width="720" height="640">
  <defs>
    <style>
      .cap  { font: bold 21px Helvetica,Arial,sans-serif; fill:#1a1a1a; }
      .code { font: bold 21px "SFMono-Regular",Consolas,Menlo,monospace; fill:#1a1a1a; }
      .note { font: 16px Helvetica,Arial,sans-serif; fill:#666; }
      .bit  { font: bold 24px "SFMono-Regular",Consolas,Menlo,monospace; fill:#1a1a1a; text-anchor:middle; }
      .nm   { font: 14px Helvetica,Arial,sans-serif; fill:#555; text-anchor:middle; }
      .cell { fill:#ffffff; stroke:#666; stroke-width:1.5; }
      .keep { fill:#e8f0e4; stroke:#4a7a3a; stroke-width:2.5; }
      .lost { fill:#fde8e8; stroke:#c00000; stroke-width:2.5; }
      .miss { fill:#fff6e0; stroke:#c98a00; stroke-width:2.5; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- starting state -->
  <text class="cap" x="24" y="30">Hardware has set three flags. You want to clear only ADRDY.</text>
  <g transform="translate(150,46)">
    <rect class="cell" x="0"   y="0" width="128" height="50"/><text class="bit" x="64"  y="34">1</text><text class="nm" x="64"  y="68">OVR (bit 4)</text>
    <rect class="cell" x="140" y="0" width="128" height="50"/><text class="bit" x="204" y="34">1</text><text class="nm" x="204" y="68">EOC (bit 2)</text>
    <rect class="cell" x="280" y="0" width="128" height="50"/><text class="bit" x="344" y="34">1</text><text class="nm" x="344" y="68">ADRDY (bit 0)</text>
  </g>

  <!-- the right way -->
  <text class="code" x="24" y="182">ADC1-&gt;ISR = ADC_ISR_ADRDY;</text>
  <text class="note" x="24" y="206">writes 1 into bit 0, and 0 into every other bit</text>
  <g transform="translate(150,222)">
    <rect class="keep" x="0"   y="0" width="128" height="50"/><text class="bit" x="64"  y="34">1</text><text class="nm" x="64"  y="68">0 &#8594; untouched</text>
    <rect class="keep" x="140" y="0" width="128" height="50"/><text class="bit" x="204" y="34">1</text><text class="nm" x="204" y="68">0 &#8594; untouched</text>
    <rect class="keep" x="280" y="0" width="128" height="50"/><text class="bit" x="344" y="34">0</text><text class="nm" x="344" y="68">1 &#8594; cleared &#10003;</text>
  </g>

  <!-- the wrong way -->
  <text class="code" x="24" y="368">ADC1-&gt;ISR &amp;= ~ADC_ISR_ADRDY;</text>
  <text class="note" x="24" y="392">reads all 32 bits, clears bit 0 in the copy, writes them all back</text>
  <g transform="translate(150,408)">
    <rect class="lost" x="0"   y="0" width="128" height="50"/><text class="bit" x="64"  y="34">0</text><text class="nm" x="64"  y="68">1 &#8594; cleared!</text>
    <rect class="lost" x="140" y="0" width="128" height="50"/><text class="bit" x="204" y="34">0</text><text class="nm" x="204" y="68">1 &#8594; cleared!</text>
    <rect class="miss" x="280" y="0" width="128" height="50"/><text class="bit" x="344" y="34">1</text><text class="nm" x="344" y="68">0 &#8594; no effect</text>
  </g>

  <text class="cap" x="24" y="548">Both flags you cared about are gone &#8212;</text>
  <text class="cap" x="24" y="578">and ADRDY, the one you meant to clear,</text>
  <text class="cap" x="24" y="608">is still set.</text>
</svg>

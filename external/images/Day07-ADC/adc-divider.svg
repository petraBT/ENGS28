<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 560" width="780" height="560">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#333"/>
    </marker>
    <style>
      .lbl  { font: 21px Helvetica, Arial, sans-serif; fill: #222; }
      .sml  { font: 18px Helvetica, Arial, sans-serif; fill: #555; }
      .math { font: italic 23px Georgia, serif; fill: #222; }
      .wire { stroke: #333; stroke-width: 2.5; fill: none; }
      .brace{ stroke: #777; stroke-width: 2; fill: none; }
      .ghost{ stroke: #bbb; stroke-width: 2; fill: none; stroke-dasharray: 5 4; }
    </style>
  </defs>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- supply rail -->
  <line class="wire" x1="168" y1="72" x2="310" y2="72"/>
  <line class="wire" x1="310" y1="72" x2="310" y2="112"/>
  <text class="lbl" x="158" y="79" text-anchor="end">3.3 V</text>
  <circle cx="168" cy="72" r="5" fill="#333"/>

  <!-- resistive track -->
  <rect x="275" y="112" width="70" height="300" fill="#f2f2f2" stroke="#333" stroke-width="2.5"/>
  <text class="sml" x="262" y="140" text-anchor="end">the</text>
  <text class="sml" x="262" y="162" text-anchor="end">resistive</text>
  <text class="sml" x="262" y="184" text-anchor="end">track</text>

  <!-- ground -->
  <line class="wire" x1="310" y1="412" x2="310" y2="452"/>
  <line class="wire" x1="168" y1="452" x2="310" y2="452"/>
  <circle cx="168" cy="452" r="5" fill="#333"/>
  <line class="wire" x1="146" y1="452" x2="190" y2="452"/>
  <line class="wire" x1="155" y1="461" x2="181" y2="461"/>
  <line class="wire" x1="163" y1="470" x2="173" y2="470"/>
  <text class="lbl" x="136" y="459" text-anchor="end">GND</text>

  <!-- wiper -->
  <line class="wire" x1="345" y1="262" x2="400" y2="262" marker-start="url(#ar)"/>
  <line class="wire" x1="400" y1="262" x2="505" y2="262"/>
  <circle cx="505" cy="262" r="5" fill="#333"/>
  <text class="lbl" x="520" y="257">to PA0</text>
  <text class="sml" x="520" y="281">(header pin A0)</text>
  <text class="lbl" x="358" y="242">the wiper</text>

  <!-- R1 brace: wiper to supply -->
  <path class="brace" d="M 228 112 h -16 v 140 h -10 M 212 252 v 9"/>
  <text class="math" x="178" y="188" text-anchor="end">R<tspan font-size="15" dy="5">1</tspan></text>
  <text class="sml" x="178" y="212" text-anchor="end">wiper to 3.3 V</text>

  <!-- R2 brace: wiper to ground -->
  <path class="brace" d="M 228 412 h -16 v -140 h -10 M 212 272 v -9"/>
  <text class="math" x="178" y="348" text-anchor="end">R<tspan font-size="15" dy="5">2</tspan></text>
  <text class="sml" x="178" y="372" text-anchor="end">wiper to GND</text>

  <!-- ghost wiper positions -->
  <line class="ghost" x1="345" y1="138" x2="400" y2="138"/>
  <text class="sml" x="412" y="144">knob fully up &#8594; 3.3 V</text>
  <line class="ghost" x1="345" y1="330" x2="400" y2="330"/>
  <text class="sml" x="412" y="336">halfway &#8594; 1.65 V</text>
  <line class="ghost" x1="345" y1="388" x2="400" y2="388"/>
  <text class="sml" x="412" y="394">knob fully down &#8594; 0 V</text>

  <!-- formula -->
  <text class="math" x="300" y="518" text-anchor="middle">V<tspan font-size="15" dy="5">wiper</tspan><tspan dy="-5"> = 3.3 V &#215;</tspan></text>
  <text class="math" x="486" y="508" text-anchor="middle">R<tspan font-size="15" dy="5">2</tspan></text>
  <line x1="424" y1="518" x2="548" y2="518" stroke="#222" stroke-width="2"/>
  <text class="math" x="486" y="544" text-anchor="middle">R<tspan font-size="15" dy="5">1</tspan><tspan font-size="23" dy="-5"> + R</tspan><tspan font-size="15" dy="5">2</tspan></text>
</svg>

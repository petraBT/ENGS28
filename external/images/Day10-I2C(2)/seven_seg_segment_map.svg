<?xml version="1.0" encoding="UTF-8"?>
<svg width="700" height="290" viewBox="0 0 700 290" xmlns="http://www.w3.org/2000/svg" font-family="sans-serif" role="img">
  <title>Seven-segment digit map with segment names</title>
  <desc>Four seven-segment digits with a two-dot colon between the second and third.
  Every segment is drawn. The first digit is labelled with the segment names in lower
  case: a across the top, b and c down the right side, d across the bottom, e and f up
  the left side, g across the middle, and DP for the decimal point. The colon's two
  dots are labelled D5 above and D6 below.</desc>
  <rect width="100%" height="100%" fill="#ffffff"/>
  <text x="113.0" y="30" font-size="19" text-anchor="middle" fill="#1a1a1a">DIG.1</text>
  <g transform="translate(70,62)">
    <polygon points="10,8 18,0 68,0 76,8 68,16 18,16" fill="#1a1a1a"/>
    <polygon points="10,78 18,70 68,70 76,78 68,86 18,86" fill="#1a1a1a"/>
    <polygon points="10,148 18,140 68,140 76,148 68,156 18,156" fill="#1a1a1a"/>
    <polygon points="8,18 16,26 16,62 8,70 0,62 0,26" fill="#1a1a1a"/>
    <polygon points="78,18 86,26 86,62 78,70 70,62 70,26" fill="#1a1a1a"/>
    <polygon points="8,86 16,94 16,130 8,138 0,130 0,94" fill="#1a1a1a"/>
    <polygon points="78,86 86,94 86,130 78,138 70,130 70,94" fill="#1a1a1a"/>
    <circle cx="102" cy="150" r="7.5" fill="#1a1a1a"/>
    <text x="43.0" y="-12" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8000f">a</text>
    <text x="-14" y="48" font-size="21" font-weight="bold" text-anchor="end" fill="#b8000f">f</text>
    <text x="100" y="48" font-size="21" font-weight="bold" text-anchor="start" fill="#b8000f">b</text>
    <text x="30" y="64" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8000f">g</text>
    <text x="-14" y="118" font-size="21" font-weight="bold" text-anchor="end" fill="#b8000f">e</text>
    <text x="100" y="118" font-size="21" font-weight="bold" text-anchor="start" fill="#b8000f">c</text>
    <text x="43.0" y="182" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8000f">d</text>
    <text x="102" y="182" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8000f">DP</text>
  </g>
  <text x="248.0" y="30" font-size="19" text-anchor="middle" fill="#1a1a1a">DIG.2</text>
  <g transform="translate(205,62)">
    <polygon points="10,8 18,0 68,0 76,8 68,16 18,16" fill="#1a1a1a"/>
    <polygon points="10,78 18,70 68,70 76,78 68,86 18,86" fill="#1a1a1a"/>
    <polygon points="10,148 18,140 68,140 76,148 68,156 18,156" fill="#1a1a1a"/>
    <polygon points="8,18 16,26 16,62 8,70 0,62 0,26" fill="#1a1a1a"/>
    <polygon points="78,18 86,26 86,62 78,70 70,62 70,26" fill="#1a1a1a"/>
    <polygon points="8,86 16,94 16,130 8,138 0,130 0,94" fill="#1a1a1a"/>
    <polygon points="78,86 86,94 86,130 78,138 70,130 70,94" fill="#1a1a1a"/>
    <circle cx="102" cy="150" r="7.5" fill="#1a1a1a"/>
  </g>
  <text x="428.0" y="30" font-size="19" text-anchor="middle" fill="#1a1a1a">DIG.3</text>
  <g transform="translate(385,62)">
    <polygon points="10,8 18,0 68,0 76,8 68,16 18,16" fill="#1a1a1a"/>
    <polygon points="10,78 18,70 68,70 76,78 68,86 18,86" fill="#1a1a1a"/>
    <polygon points="10,148 18,140 68,140 76,148 68,156 18,156" fill="#1a1a1a"/>
    <polygon points="8,18 16,26 16,62 8,70 0,62 0,26" fill="#1a1a1a"/>
    <polygon points="78,18 86,26 86,62 78,70 70,62 70,26" fill="#1a1a1a"/>
    <polygon points="8,86 16,94 16,130 8,138 0,130 0,94" fill="#1a1a1a"/>
    <polygon points="78,86 86,94 86,130 78,138 70,130 70,94" fill="#1a1a1a"/>
    <circle cx="102" cy="150" r="7.5" fill="#1a1a1a"/>
  </g>
  <text x="563.0" y="30" font-size="19" text-anchor="middle" fill="#1a1a1a">DIG.4</text>
  <g transform="translate(520,62)">
    <polygon points="10,8 18,0 68,0 76,8 68,16 18,16" fill="#1a1a1a"/>
    <polygon points="10,78 18,70 68,70 76,78 68,86 18,86" fill="#1a1a1a"/>
    <polygon points="10,148 18,140 68,140 76,148 68,156 18,156" fill="#1a1a1a"/>
    <polygon points="8,18 16,26 16,62 8,70 0,62 0,26" fill="#1a1a1a"/>
    <polygon points="78,18 86,26 86,62 78,70 70,62 70,26" fill="#1a1a1a"/>
    <polygon points="8,86 16,94 16,130 8,138 0,130 0,94" fill="#1a1a1a"/>
    <polygon points="78,86 86,94 86,130 78,138 70,130 70,94" fill="#1a1a1a"/>
    <circle cx="102" cy="150" r="7.5" fill="#1a1a1a"/>
  </g>
  <circle cx="338.0" cy="114" r="7.5" fill="#1a1a1a"/>
  <circle cx="338.0" cy="174" r="7.5" fill="#1a1a1a"/>
  <text x="338.0" y="100" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8000f">D5</text>
  <text x="338.0" y="202" font-size="21" font-weight="bold" text-anchor="middle" fill="#b8000f">D6</text>
</svg>

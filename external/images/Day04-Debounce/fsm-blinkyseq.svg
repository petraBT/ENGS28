<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330">
  <defs>
    <marker id="ar" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="7" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#333333"/>
    </marker>
  </defs>
  <rect width="800" height="330" fill="#ffffff"/>
  <g font-family="Helvetica, Arial, sans-serif" fill="#111111">

    <!-- states -->
    <circle cx="120" cy="120" r="58" fill="#fdf6d8" stroke="#333333" stroke-width="2.5"/>
    <text x="120" y="114" text-anchor="middle" font-size="19" font-weight="bold">LED 1</text>
    <text x="120" y="138" text-anchor="middle" font-size="19" font-weight="bold">on</text>

    <circle cx="400" cy="120" r="58" fill="#fdf6d8" stroke="#333333" stroke-width="2.5"/>
    <text x="400" y="114" text-anchor="middle" font-size="19" font-weight="bold">LED 2</text>
    <text x="400" y="138" text-anchor="middle" font-size="19" font-weight="bold">on</text>

    <circle cx="680" cy="120" r="58" fill="#fdf6d8" stroke="#333333" stroke-width="2.5"/>
    <text x="680" y="114" text-anchor="middle" font-size="19" font-weight="bold">LED 3</text>
    <text x="680" y="138" text-anchor="middle" font-size="19" font-weight="bold">on</text>

    <!-- entry -->
    <line x1="24" y1="120" x2="58" y2="120" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="24" y="104" text-anchor="start" font-size="15" fill="#555555">start</text>

    <!-- forward transitions: event above, action below -->
    <line x1="180" y1="120" x2="340" y2="120" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="260" y="100" text-anchor="middle" font-size="16">500 ms elapsed</text>
    <text x="260" y="148" text-anchor="middle" font-size="16" fill="#1a5fb4">/ LED 1 off,</text>
    <text x="260" y="168" text-anchor="middle" font-size="16" fill="#1a5fb4">LED 2 on</text>

    <line x1="460" y1="120" x2="620" y2="120" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="540" y="100" text-anchor="middle" font-size="16">500 ms elapsed</text>
    <text x="540" y="148" text-anchor="middle" font-size="16" fill="#1a5fb4">/ LED 2 off,</text>
    <text x="540" y="168" text-anchor="middle" font-size="16" fill="#1a5fb4">LED 3 on</text>

    <!-- wrap-around transition -->
    <path d="M680,178 L680,258 L120,258 L120,178" fill="none" stroke="#333333" stroke-width="2.5" marker-end="url(#ar)"/>
    <text x="400" y="248" text-anchor="middle" font-size="16">500 ms elapsed</text>
    <text x="400" y="282" text-anchor="middle" font-size="16" fill="#1a5fb4">/ LED 3 off, LED 1 on</text>

    <!-- what every transition has in common -->
    <text x="400" y="318" text-anchor="middle" font-size="15" fill="#555555">Every transition also restarts the timer.</text>
  </g>
</svg>

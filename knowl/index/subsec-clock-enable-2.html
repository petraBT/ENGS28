<div class="para">By default, the STM32 turns off the clock to every peripheral to save power. A peripheral with no clock cannot function—its registers will not respond. <code class="code-inline tex2jax_ignore">RCC</code> stands for <dfn class="terminology">Reset and Clock Control</dfn>; its <code class="code-inline tex2jax_ignore">IOPENR</code> register (I/O Port Clock Enable Register) has one bit per GPIO port:<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#subsec-clock-enable-2" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

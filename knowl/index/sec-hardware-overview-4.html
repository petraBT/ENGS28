<h2 class="heading"><span class="type">Paragraph</span></h2>
<div class="para">The STM32C031C6 has 48 physical pins. The <dfn class="terminology">GPIO system</dfn> groups them into <dfn class="terminology">ports</dfn> labelled A, B, and C, each holding up to 16 pins. In code we always refer to a pin by its port letter and bit number—<code class="code-inline tex2jax_ignore">PA5</code>, <code class="code-inline tex2jax_ignore">PB10</code>, etc.—rather than the physical pin number.<div class="autopermalink" aria-hidden="true" data-description="Paragraph"><a tabindex="-1" href="#sec-hardware-overview-4" title="Copy heading and permalink for Paragraph" aria-label="Copy heading and permalink for Paragraph">🔗</a></div>

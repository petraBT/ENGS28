<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.1.7<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>UART and I2C compared.  On the left, UART: a separate transmit and receive line between exactly two devices, no clock, and a baud rate both ends must be configured for in advance — but each direction has its own wire, so both can be in use at once.  On the right, I2C: one clock line (SCL) driven by the controller and one bidirectional data line (SDA), both held HIGH by pull-up resistors, with every device on the bus tapped onto the same two wires.  Adding a device to the UART arrangement costs another pair of pins; adding one to the I2C bus costs none.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.1.7"><a tabindex="-1" href="#fig-uart-vs-i2c" title="Copy heading and permalink for Figure 10.1.7" aria-label="Copy heading and permalink for Figure 10.1.7">🔗</a></div></figcaption>

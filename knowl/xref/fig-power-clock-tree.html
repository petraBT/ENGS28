<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">16.1.5<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Clock distribution in the STM32C0, Figure 9 of the <a class="external" href="external/stm32c031_rm.pdf" target="_blank">Reference Manual</a>.  The HSI48 oscillator at the left feeds the system clock through the HSIDIV divider, whose output HSISYS is the clock the CPU runs on; HSIDIV divides by four at reset, which is where our 12 MHz comes from.  Other oscillators, including the 32 kHz low-speed internal oscillator (LSI) that clocks the watchdog, serve their own domains.  Stopping a clock stops the domain it feeds, and saves its power.  The blue path is our clock; the boxes at the right are the domains it serves.<div class="autopermalink" aria-hidden="true" data-description="Figure 16.1.5"><a tabindex="-1" href="#fig-power-clock-tree" title="Copy heading and permalink for Figure 16.1.5" aria-label="Copy heading and permalink for Figure 16.1.5">🔗</a></div></figcaption>

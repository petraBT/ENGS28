<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">11.2.21<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The regulator board that supplies the motor, seen close up.  The barrel connector at the bottom takes the 6–12 V wall adapter; the regulator is the black component in the middle, with C1 and C2 below it, one either side of its center lead; and each of the two headers at the top brings out three pins, labeled 5V, GND and Vin.  Take the motor supply from the <em class="emphasis">5V</em> pin.  The <em class="emphasis">Vin</em> pin is the raw, unregulated input from the adapter, and wiring it to VM would drive the motor at up to 12 V rather than its rated 3–6 V.<div class="autopermalink" aria-hidden="true" data-description="Figure 11.2.21"><a tabindex="-1" href="#fig-tb6612-regulator" title="Copy heading and permalink for Figure 11.2.21" aria-label="Copy heading and permalink for Figure 11.2.21">🔗</a></div></figcaption>

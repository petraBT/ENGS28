<tr>
<td class="l m b1 r1 l1 t0 lines">Noise wandering around somewhere between the rails</td>
<td class="l m b1 r1 l0 t0 lines">Check that the pull-up resistor is fitted, and that the end of it really reaches 3.3 V.</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines">A flat line that never moves, at either 0 V or 3.3 V</td>
<td class="l m b1 r1 l0 t0 lines">Nothing is changing the beam, so check first that the wheel’s rim really passes through the gap.  If it does, the sensor is not switching: check its power and ground, and check that they are not swapped.</td>
</tr>
<tr>
<td class="l m b3 r1 l1 t0 lines">A clean square wave whose frequency does not change when the motor speeds up</td>
<td class="l m b3 r1 l0 t0 lines">The probe is still on Wednesday’s PWM node, which runs at a fixed 1.6 kHz whatever the motor does.  Move it to the row the sensor’s signal wire lands in.</td>
</tr>

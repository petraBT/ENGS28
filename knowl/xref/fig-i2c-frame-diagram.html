<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.1.11<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>One I2C write transaction.  SCL (top) begins clocking once the START condition has occurred.  SDA (bottom) shows the START — SDA falling while SCL is HIGH — then seven address bits and the R/W bit, which for address 0x70 and a write are 1 1 1 0 0 0 0 followed by 0; then the ACK, with the addressed device pulling SDA LOW; then eight data bits, 0xAA = 10101010, most significant bit first; then a second ACK; and finally the STOP, SDA rising while SCL is HIGH.  Receivers sample SDA during the SCL HIGH phase, and SDA may change only while SCL is LOW — the START and STOP conditions being the two deliberate exceptions.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.1.11"><a tabindex="-1" href="#fig-i2c-frame-diagram" title="Copy heading and permalink for Figure 10.1.11" aria-label="Copy heading and permalink for Figure 10.1.11">🔗</a></div></figcaption>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.1.1<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>I2C write transaction timing.  SCL (top trace) begins clocking as soon as the START condition has occurred. SDA (bottom trace, blue) shows: the START condition (SDA falls while SCL is HIGH); seven address bits plus the write bit (bit pattern 1 1 1 0 0 0 0 0 corresponding to address 0x70 with R/W = 0); the ACK from the peripheral (SDA pulled LOW); eight data bits of 0xAA (= 10101010, MSB first), showing the alternating HIGH–LOW pattern; a second ACK; and finally the STOP condition (SDA rises while SCL is HIGH).  Receivers sample SDA during the SCL HIGH phase; SDA is only permitted to change while SCL is LOW.  The START and STOP conditions are the only exceptions to this rule.<div class="autopermalink" aria-hidden="true" data-description="Figure 9.1.1"><a tabindex="-1" href="#fig-i2c-frame-diagram" title="Copy heading and permalink for Figure 9.1.1" aria-label="Copy heading and permalink for Figure 9.1.1">🔗</a></div></figcaption>

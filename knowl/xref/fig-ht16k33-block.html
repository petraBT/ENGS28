<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.6<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The HT16K33’s block diagram, from its datasheet.  SDA and SCL enter the I2C controller on the left, which is the only way your program reaches it. The display RAM is where the individual bit patterns are stored for the segments you are currently lighting up. Each digit is stored as a 16-bit number (2 8-bit numbers); in the case of the 7-segment display we only use the first of these two bytes for each segment. We still need to send both bytes though (so we send a ’0’ after each ’real’ piece of data). The controller can also control dot-matrix displays, keypads and more. That’s why it has more capabilities than we need and in particular more storage in the display memory than we need. The common-scan and row-driver outputs on the right are the pins that go to the display’s grid.  The internal RC (resistor-capacitor) oscillator and timing generator sweep that grid from the RAM, continuously and without any further instruction.  The key-scan and key-data blocks belong to the chip’s other features, reading a keypad matrix, which we do not use. The annotations name four groups.  In blue on the left, the two I2C pins.  In magenta, the display RAM — the data registers, two bytes of eight bits for each COM line.  In orange, the control registers, which are what the command table configures: display or keypad, digits or LED matrix, brightness and blinking.  And in dark red on the right, the pins our display actually uses — five COM outputs, four for the digits and one for the colon, and eight ROW outputs, seven digit segments and the decimal point.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.6"><a tabindex="-1" href="#fig-ht16k33-block" title="Copy heading and permalink for Figure 10.3.6" aria-label="Copy heading and permalink for Figure 10.3.6">🔗</a></div></figcaption>

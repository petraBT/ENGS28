<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.2.5<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The EXTI’s configurable-event trigger logic (RM0490 §12.3.1, Figure 24), annotated: the parts this course does not use are grayed out, and the path a button press takes is drawn in blue. The press enters the multiplexer, which <code class="code-inline tex2jax_ignore">EXTI_EXTICRx</code> has pointed at port B; the asynchronous edge-detection circuit reacts to it according to <code class="code-inline tex2jax_ignore">EXTI_FTSR1</code>; the AND gate passes it only if <code class="code-inline tex2jax_ignore">EXTI_IMR1</code> has unmasked the line; it is recorded in the pending request register <code class="code-inline tex2jax_ignore">EXTI_FPR1</code>; and it leaves the EXTI as an <dfn class="terminology">IRQ</dfn>, which is what reaches the <dfn class="terminology">NVIC</dfn> inside the Cortex-M0+ at the bottom.  Note the second, identical-looking AND gate and mask register above the blue path — the <em class="emphasis">event</em> path, <code class="code-inline tex2jax_ignore">EXTI_EMR1</code>, which this course does not use.  The rest of the grayed-out machinery handles rising edges, software-triggered events, and waking the chip from a low-power state.<div class="autopermalink" aria-hidden="true" data-description="Figure 9.2.5"><a tabindex="-1" href="#fig-exti-signal-path" title="Copy heading and permalink for Figure 9.2.5" aria-label="Copy heading and permalink for Figure 9.2.5">🔗</a></div></figcaption>

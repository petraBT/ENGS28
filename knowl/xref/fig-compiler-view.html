<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">8.3.8<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Why the flag must be <code class="code-inline tex2jax_ignore">volatile</code>.  The compiler compiles the ISR too — but no call to the ISR appears anywhere in the program, so when the optimizer builds <code class="code-inline tex2jax_ignore">main()</code> (dashed boundary) it has no reason to think the flag can change mid-loop.  The ISR’s write happens at a moment the hardware chooses.  <code class="code-inline tex2jax_ignore">volatile</code> forbids the assumption and forces a fresh read at every use.<div class="autopermalink" aria-hidden="true" data-description="Figure 8.3.8"><a tabindex="-1" href="#fig-compiler-view" title="Copy heading and permalink for Figure 8.3.8" aria-label="Copy heading and permalink for Figure 8.3.8">🔗</a></div></figcaption>

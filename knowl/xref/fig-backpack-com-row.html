<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.12<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>How the display’s fourteen pins reach the HT16K33, and what that means for the buffer you fill in.  Every LED sits where one COM line crosses one ROW line: the COM line is which digit, and the ROW line is which segment.  Our display uses COM0 through COM4 — digit 1, digit 2, the colon, digit 3, digit 4 — and ROW0 through ROW7, which are <code class="code-inline tex2jax_ignore">a</code> through <code class="code-inline tex2jax_ignore">g</code> and the decimal point.  So bit <span class="process-math">\(k\)</span> of the byte at display RAM address <span class="process-math">\(2n\)</span> is the LED where COM<span class="process-math">\(n\)</span> crosses ROW<span class="process-math">\(k\text{.}\)</span>  The colon is the one line that is not a full digit: its two dots always light together, so they share a single anode, and that anode is tied to one of the eight ROW lines the backpack drives. Which one is not in the datasheet, and finding it is the experiment in <a href="subsec-day10-ram.html#act-i2c-find-colon" class="xref" data-knowl="./knowl/xref/act-i2c-find-colon.html" data-reveal-label="Reveal" data-close-label="Close" title="Activity 10.3.4: Find the Colon Bit">Activity 10.3.4</a> — so the eight crossings on that line are all drawn the same here.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.12"><a tabindex="-1" href="#fig-backpack-com-row" title="Copy heading and permalink for Figure 10.3.12" aria-label="Copy heading and permalink for Figure 10.3.12">🔗</a></div></figcaption>

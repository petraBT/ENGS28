<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.24<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>I2C control register 2, from RM0490 §23.7.2, with the five fields the course’s library writes boxed.  In the lower row, <code class="code-inline tex2jax_ignore">SADD[9:0]</code> holds the address; <code class="code-inline tex2jax_ignore">RD_WRN</code> is the transfer direction, 0 for a write and 1 for a read; and <code class="code-inline tex2jax_ignore">START</code> is the bit whose being written is what puts a START condition on the wire.  In the upper row, <code class="code-inline tex2jax_ignore">NBYTES[7:0]</code> is how many data bytes this transaction will carry, and <code class="code-inline tex2jax_ignore">AUTOEND</code> makes the hardware issue the STOP by itself once they have gone.  The remaining fields — <code class="code-inline tex2jax_ignore">NACK</code>, <code class="code-inline tex2jax_ignore">HEAD10R</code>, <code class="code-inline tex2jax_ignore">ADD10</code>, <code class="code-inline tex2jax_ignore">RELOAD</code> and <code class="code-inline tex2jax_ignore">PECBYTE</code> — belong to target mode, 10-bit addressing, transfers longer than 255 bytes, and SMBus, none of which this course uses.  <code class="code-inline tex2jax_ignore">STOP</code> is the exception: it is a controller bit, and it is how software ends a transfer itself when <code class="code-inline tex2jax_ignore">AUTOEND</code> is clear.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.24"><a tabindex="-1" href="#fig-i2c-cr2" title="Copy heading and permalink for Figure 10.3.24" aria-label="Copy heading and permalink for Figure 10.3.24">🔗</a></div></figcaption>

<figure class="figure figure-like"><div class="image-box" style="width: 85%; margin-left: 7.5%; margin-right: 7.5%;"><img src="external/images/Day10-I2C(2)/firmware_layers.svg" class="contained"></div>
<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.28<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The four layers of a firmware design.  At the bottom, the microcontroller’s own registers.  Above them the interface drivers, the only code that reaches a machine register: <code class="code-inline tex2jax_ignore">i2c.c</code>, <code class="code-inline tex2jax_ignore">uart.c</code> and <code class="code-inline tex2jax_ignore">adc.c</code> here. Above those the device drivers, which reach a device’s registers only through an interface driver and never touch a machine register. For example, <code class="code-inline tex2jax_ignore">stdio.c</code> is a device driver that uses the interface driver <code class="code-inline tex2jax_ignore">uart.c</code>. Without <code class="code-inline tex2jax_ignore">stdio.c</code> we wouldn’t have a <code class="code-inline tex2jax_ignore">printf()</code> function. At the very top we have <code class="code-inline tex2jax_ignore">main()</code>, which calls devices through their drivers and knows about neither kind of register. The box labeled <code class="code-inline tex2jax_ignore">device.c</code> in this image is what you will be working on for the seven-segment display. You’ll communicate with the display via its backpack chip over I2C, but only through the <code class="code-inline tex2jax_ignore">i2c.c</code> interface driver.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.28"><a tabindex="-1" href="#fig-firmware-layers" title="Copy heading and permalink for Figure 10.3.28" aria-label="Copy heading and permalink for Figure 10.3.28">🔗</a></div></figcaption>
</figure><span class="incontext"><a class="internal" href="subsec-day10-layers.html#fig-firmware-layers">In Context</a></span>

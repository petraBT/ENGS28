<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">6.3.1<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Conversion timing (RM0490, <em class="emphasis">Analog to digital conversion time</em>).  Setting <code class="code-inline tex2jax_ignore">ADSTART</code> starts sampling; sampling takes 1.5 ADC clock cycles and the successive approximation itself 12.5 (the 1.5 is the reset value of <code class="code-inline tex2jax_ignore">SMP1[2:0]</code> in <code class="code-inline tex2jax_ignore">ADC_SMPR</code>, which this chapter leaves alone), so a 12-bit conversion is 14 cycles in all — about 1.17 µs at the default 12 MHz ADC clock.  <code class="code-inline tex2jax_ignore">EOC</code> is then set and the result is in <code class="code-inline tex2jax_ignore">ADC_DR</code>.  <code class="code-inline tex2jax_ignore">ADSTART</code> stays set for the whole conversion and is cleared by hardware at the <em class="emphasis">end</em> — while it reads 1, the converter is busy.<div class="autopermalink" aria-hidden="true" data-description="Figure 6.3.1"><a tabindex="-1" href="#fig-adc-timing" title="Copy heading and permalink for Figure 6.3.1" aria-label="Copy heading and permalink for Figure 6.3.1">🔗</a></div></figcaption>
</figure><span class="incontext"><a class="internal" href="subsec-adc-ref-hardware.html#fig-adc-timing">In Context</a></span>

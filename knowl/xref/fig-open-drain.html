<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.20<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>A disagreement between controller and device, wired two ways.  On the left, two push-pull outputs on one wire: each has a transistor to 3.3 V and one to ground, and when one drives HIGH while the other drives LOW both are switched on across the same wire and current runs straight from the supply to ground.  Nothing decides what the wire’s voltage is.  On the right, the same two devices as open-drain outputs: the transistor to 3.3 V is gone and a single pull-up resistor takes its place, so one device pulling LOW while the other releases has no path except through that resistor.  The wire reads LOW, no damage is possible, and — because releasing is the only way to send a 1 — a device that releases and then reads LOW knows somebody else is pulling.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.20"><a tabindex="-1" href="#fig-open-drain" title="Copy heading and permalink for Figure 10.3.20" aria-label="Copy heading and permalink for Figure 10.3.20">🔗</a></div></figcaption>

<figure class="table table-like"><figcaption><span class="type">Table</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">16.1.7<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>What each mode stops, and what wakes it<div class="autopermalink" aria-hidden="true" data-description="Table 16.1.7: What each mode stops, and what wakes it"><a tabindex="-1" href="#table-day17x-modes" title="Copy heading and permalink for Table 16.1.7: What each mode stops, and what wakes it" aria-label="Copy heading and permalink for Table 16.1.7: What each mode stops, and what wakes it">🔗</a></div></figcaption><div class="tabular-box natural-width"><table class="tabular">
<tr class="header-horizontal">
<th scope="col" class="l m b1 r1 l1 t1 lines">Mode</th>
<th scope="col" class="l m b1 r1 l0 t1 lines">What stops</th>
<th scope="col" class="l m b1 r1 l0 t1 lines">What survives</th>
<th scope="col" class="l m b1 r1 l0 t1 lines">What wakes it</th>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines"><dfn class="terminology">Sleep</dfn></td>
<td class="l m b1 r1 l0 t0 lines">the CPU clock</td>
<td class="l m b1 r1 l0 t0 lines">all peripherals can run and wake up the CPU; peripheral clocks can be disabled before going to sleep</td>
<td class="l m b1 r1 l0 t0 lines">any enabled interrupt, in a few clock cycles; a peripheral whose clock you left running can interrupt and wake the CPU, and one whose clock you disabled cannot</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines"><dfn class="terminology">Stop</dfn></td>
<td class="l m b1 r1 l0 t0 lines">the CPU clock and the high-speed oscillators</td>
<td class="l m b1 r1 l0 t0 lines">SRAM and register contents; the 32 kHz low-speed oscillator (LSI) that clocks the watchdog, and a few wakeup-capable peripherals; GPIO pin states</td>
<td class="l m b1 r1 l0 t0 lines">an interrupt from a peripheral that still has a clock</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines"><dfn class="terminology">Standby</dfn></td>
<td class="l m b1 r1 l0 t0 lines">the core’s supply domain, the part of the chip that powers the CPU and most peripherals</td>
<td class="l m b1 r1 l0 t0 lines">SRAM and register contents are lost, except PWR control register 3; the IWDG and LSI can keep running</td>
<td class="l m b1 r1 l0 t0 lines">the reset pin or one of the dedicated wakeup (WKUP) pins; Reference Manual Table 19 lists the rest</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines"><dfn class="terminology">Shutdown</dfn></td>
<td class="l m b1 r1 l0 t0 lines">all oscillators and the supply monitor</td>
<td class="l m b1 r1 l0 t0 lines">nothing; contents are lost, and waking behaves like a reset</td>
<td class="l m b1 r1 l0 t0 lines">the reset pin or a wakeup (WKUP) pin</td>
</tr>

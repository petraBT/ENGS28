<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">13.2.30<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>How the servo is powered.  The regulator board is plugged into the breadboard, so each of its pins is reached through the row it sits in.  The servo’s red lead, the middle one, goes to the row of the regulator board’s 5 V pin, and never to Vin, and also never to the Nucleo’s 3.3 V or 5 V pin.  Its brown lead goes to the breadboard’s ground rail, and so does a wire from the regulator board’s GND pin, so the servo, the regulator board and the Nucleo, whose GND also feeds that rail, share one ground.  The signal lead, orange on the servo and drawn yellow here, goes to D11 (PA7).  The Nucleo’s 3.3 V feeds the other rail, and nothing on the Nucleo powers the servo.<div class="autopermalink" aria-hidden="true" data-description="Figure 13.2.30"><a tabindex="-1" href="#fig-servo-powering" title="Copy heading and permalink for Figure 13.2.30" aria-label="Copy heading and permalink for Figure 13.2.30">🔗</a></div></figcaption>

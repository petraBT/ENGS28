<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">14.2.6<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The ultimate setup.  The two photocells are drawn on the breadboard, but they are physically in the cups of your tracker arm, reached through the alligator clips.  Each divider is a photocell from the 3.3 V rail to a node row and a 10 kΩ resistor from that row to the ground rail; one node goes to A0 (PA0) and the other to A1 (PA1).  The servo is powered from the regulator board’s 5V pin and its orange signal lead goes to D11 (PA7), as in <a href="subsec-day15-power.html#fig-servo-powering" class="xref" data-knowl="./knowl/xref/fig-servo-powering.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 13.2.30">Figure 13.2.30</a>.  The regulator board is plugged into the breadboard, so each of its pins is reached through the row it sits in.<div class="autopermalink" aria-hidden="true" data-description="Figure 14.2.6"><a tabindex="-1" href="#fig-day16-full-setup" title="Copy heading and permalink for Figure 14.2.6" aria-label="Copy heading and permalink for Figure 14.2.6">🔗</a></div></figcaption>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.14<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Writing the whole display in one transaction — the HT16K33 datasheet calls this a page write, on page 22.  After the START and the address comes one command byte, and because the display data address pointer command is 0 0 0 0 A3 A2 A1 A0, a command byte of 0x00 means “start at display RAM address 0”. Every data byte after it is stored where the pointer is and moves the pointer on by one, so ten data bytes fill addresses 0 through 9.  Each byte is acknowledged, and one STOP ends the whole transaction. It is the same transaction as the single command in <a href="subsec-day9x-addressing.html#fig-ht16k33-addr-frame" class="xref" data-knowl="./knowl/xref/fig-ht16k33-addr-frame.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 10.1.22">Figure 10.1.22</a>, annotated the same way, with the data bytes added after the command byte.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.14"><a tabindex="-1" href="#fig-ht16k33-page-write" title="Copy heading and permalink for Figure 10.3.14" aria-label="Copy heading and permalink for Figure 10.3.14">🔗</a></div></figcaption>

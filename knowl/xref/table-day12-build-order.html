<tr>
<td class="l m b1 r1 l1 t0 lines">The <code class="code-inline tex2jax_ignore">tb6612.c</code> driver alone, with no motor connected: PA5 (D13), PA6 (D12) and PA7 (D11)</td>
<td class="l m b1 r1 l0 t0 lines">Waveforms shows a 1.6 kHz pulse train on PA7 whose duty cycle follows the speed you asked for, and IN1 and IN2 follow the mode</td>

<tr>
<td class="l m b1 r1 l1 t0 lines">The potentiometer on A0 (PA0)</td>
<td class="l m b1 r1 l0 t0 lines">The value you read from the ADC sweeps from one end of its range to the other as you turn the knob</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines">The regulator board, with nothing else connected to it</td>
<td class="l m b1 r1 l0 t0 lines">9 V on its <code class="code-inline tex2jax_ignore">Vin</code> pin and 5 V on its <code class="code-inline tex2jax_ignore">5V</code> pin: multimeter on DC volts, black probe on the shared ground.  Measure at the pins, not at the barrel connector</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines">The motor, through the TB6612</td>
<td class="l m b1 r1 l0 t0 lines">The knob drives it both ways and stops it in the middle</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines">The photointerrupter on PA15 (D7)</td>
<td class="l m b1 r1 l0 t0 lines">The trace toggles once per slot, as it did earlier today</td>
</tr>
<tr>
<td class="l m b1 r1 l1 t0 lines">The rpm, printed to your screen</td>
<td class="l m b1 r1 l0 t0 lines">The number tracks the motor and is plausible for what you can see the shaft doing</td>
</tr>
<tr>
<td class="l m b3 r1 l1 t0 lines">The rpm on the seven-segment display</td>
<td class="l m b3 r1 l0 t0 lines">The same number appears there, with a minus sign when the motor is running in reverse. The signed counter and its minus sign are the ones you wrote for Day 10</td>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">9.2.11<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span><code class="code-inline tex2jax_ignore">EXTI_IMR1</code>, the CPU wakeup with interrupt mask register (RM0490 §12.5.7, offset 0x080).  One bit per line: 1 lets a detected event on that line request an interrupt, 0 masks it.  Every GPIO line — IM0 through IM15 — is masked at reset, so an unset bit here is the quietest possible bug: the edge is detected, nothing is recorded in <code class="code-inline tex2jax_ignore">EXTI_FPR1</code>, and nothing ever happens.  (The reset value is 0xFFF8 0000: the direct peripheral lines 19, 23, 25 and 31 are unmasked at reset, which is why the top of the register is not all zeros.)<div class="autopermalink" aria-hidden="true" data-description="Figure 9.2.11"><a tabindex="-1" href="#fig-exti-imr1" title="Copy heading and permalink for Figure 9.2.11" aria-label="Copy heading and permalink for Figure 9.2.11">🔗</a></div></figcaption>

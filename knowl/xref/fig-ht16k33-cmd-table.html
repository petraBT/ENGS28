<figure class="figure figure-like"><div class="image-box" style="width: 88%; margin-left: 6%; margin-right: 6%;"><img src="external/images/Day10-I2C(2)/ht16k33_cmd_table_annotated.png" class="contained"></div>
<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.9<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The rows of the HT16K33 command table we need, from pages 24–25 of its datasheet.  The eight middle columns are the bits of the command byte, D15 down to D8, and the magenta line divides them: to its left the fixed bits that are the <dfn class="terminology">command</dfn> itself, to its right the <dfn class="terminology">options</dfn> you fill in.  A name there — <code class="code-inline tex2jax_ignore">S</code>, <code class="code-inline tex2jax_ignore">D</code>, <code class="code-inline tex2jax_ignore">B1</code>, <code class="code-inline tex2jax_ignore">P3</code> — is an option you supply, and an <code class="code-inline tex2jax_ignore">X</code> is a don’t-care that we write as 0. <em class="emphasis">System setup</em> is 0 0 1 0 X X X S, where S is the internal oscillator: 0 leaves it off, 1 turns it on.  <em class="emphasis">Display setup</em> is 1 0 0 0 X B1 B0 D, where D turns the display on and B1 B0 choose the blink rate — 00 for steady, then 2 Hz, 1 Hz and 0.5 Hz.  <em class="emphasis">Dimming set</em> is 1 1 1 0 P3 P2 P1 P0, the <dfn class="terminology">duty cycle</dfn> — the fraction of each digit’s turn in the sweep for which its segments are actually driven, which the datasheet calls the pulse width of ROW — in sixteenths, where 0000 is 1/16 and 1111 is 16/16.  The <em class="emphasis">Def.</em> column on the right is each command with its options at their default.  Below, separated because we do not need it until <a href="subsec-day10-ram.html" class="internal" title="Subsection 10.3.5: Part 5: The Display RAM, and the Byte That Is Always Zero">Subsection 10.3.5</a>, is the <em class="emphasis">display data address pointer</em>, which says where a block of display data starts.  The chip has more commands than these, but they belong to its other job, scanning a keypad, and we will not be sending any of them.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.9"><a tabindex="-1" href="#fig-ht16k33-cmd-table" title="Copy heading and permalink for Figure 10.3.9" aria-label="Copy heading and permalink for Figure 10.3.9">🔗</a></div></figcaption>

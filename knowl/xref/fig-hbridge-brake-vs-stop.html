<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">11.2.14<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Braking, on the left, against stopping, on the right.  To brake, the two lower switches conduct, so both motor terminals are tied together at ground and the spinning motor’s own back-EMF drives a current through that short, which opposes the rotation and brings the shaft quickly to rest.  That loop is drawn dashed and without an arrow on purpose: which way the current runs depends on which way the shaft happened to be turning, and either way it is driven to ground through the lower switches and opposes the rotation.  To stop, all four switches are off, so both terminals are left floating: no current can flow in or out, nothing opposes the rotation, and the shaft coasts down under friction alone.  This all-off state is one the driver’s control logic produces; it is not something the two direction lines could ask for by themselves, which is why the modes are read from the datasheet’s table rather than from the bridge drawing.<div class="autopermalink" aria-hidden="true" data-description="Figure 11.2.14"><a tabindex="-1" href="#fig-hbridge-brake-vs-stop" title="Copy heading and permalink for Figure 11.2.14" aria-label="Copy heading and permalink for Figure 11.2.14">🔗</a></div></figcaption>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.4.3<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The I2C peripheral, from RM0490 Figure 211.  The registers along the bottom are what software touches; everything above them runs on its own.  Data control holds the shift register that turns a byte into eight bits on SDA and back; clock control generates SCL from the I2CCLK input and the timing register, and also contains the slave-clock-stretching logic; the analog and digital noise filters sit between the pins and the rest.  The block on the left is <em class="emphasis">wake-up on address match</em> — the feature that lets a device asleep in a low-power mode be woken by its own address arriving on the bus.  We are always the controller and never asleep, so we never use it, and address recognition proper would be <code class="code-inline tex2jax_ignore">I2C_OAR1</code> and the <code class="code-inline tex2jax_ignore">ADDR</code> flag rather than this block.  The SMBus blocks belong to a related protocol this course does not use either.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.4.3"><a tabindex="-1" href="#fig-i2c-hardware" title="Copy heading and permalink for Figure 10.4.3" aria-label="Copy heading and permalink for Figure 10.4.3">🔗</a></div></figcaption>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">11.2.29<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The PWM signal from <code class="code-inline tex2jax_ignore">TTmotor_ramp.c</code> on the oscilloscope, while the ramp runs.  The window is narrow enough to hold only a few periods of the 1.6 kHz waveform, so what you are watching is one pulse train changing shape: the width of the HIGH portion grows and shrinks as the motor speeds up and slows down, while the spacing from one rising edge to the next — the period — does not move at all.  That is duty cycle changing while frequency stays fixed, which is the whole of how this program sets the speed.<div class="autopermalink" aria-hidden="true" data-description="Figure 11.2.29"><a tabindex="-1" href="#fig-pwm-scope" title="Copy heading and permalink for Figure 11.2.29" aria-label="Copy heading and permalink for Figure 11.2.29">🔗</a></div></figcaption>

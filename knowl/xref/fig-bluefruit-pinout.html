<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">15.1.4<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The Adafruit Bluefruit LE UART Friend.  The silver metal box is the radio module that runs the BLE stack.  The pads carry, by silkscreen name, DFU (device firmware update), GND (ground), VIN (the module’s power supply, which we run at 3.3 V), RXI (UART receive, from the microcontroller into the module), TXO (UART transmit, from the module to the microcontroller), CTS (clear to send) and RTS (request to send), the two flow-control wires that carry each side’s ready-or-not state, and MOD (mode selection). The switch labeled UART and CMD selects the module’s mode, and the MOD pin makes the same selection under software control.  Image from the Adafruit guide.<div class="autopermalink" aria-hidden="true" data-description="Figure 15.1.4"><a tabindex="-1" href="#fig-bluefruit-pinout" title="Copy heading and permalink for Figure 15.1.4" aria-label="Copy heading and permalink for Figure 15.1.4">🔗</a></div></figcaption>

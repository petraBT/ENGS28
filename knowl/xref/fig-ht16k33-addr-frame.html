<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.1.22<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The HT16K33 datasheet’s diagram of a command write.  The first field, the device address, is 1 1 1 0 A2 A1 A0 — the top four bits are fixed by the chip and A2, A1 and A0 are selectable on the board, so eight of these can share a bus.  With all three at 0 the 7-bit address is 0b1110000, which is 0x70.  The next bit is the direction, 0 for write; then the device’s ACK; then the command byte, D15 down to D8; then a second ACK and the STOP.  Note that the address occupies seven bit positions and the direction bit is separate — the datasheet is being explicit about something many are not.  The red box is the seven address bits that make up <code class="code-inline tex2jax_ignore">0x70</code>, and the blue labels mark the START and the STOP.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.1.22"><a tabindex="-1" href="#fig-ht16k33-addr-frame" title="Copy heading and permalink for Figure 10.1.22" aria-label="Copy heading and permalink for Figure 10.1.22">🔗</a></div></figcaption>

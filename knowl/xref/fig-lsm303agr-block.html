<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">12.3.13<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The LSM303AGR’s block diagram, from its datasheet. The accelerometer is the upper half, boxed in blue: six sense capacitors, a pair per axis (X±, Y±, Z±), feed a multiplexer, and the three axes share one charge amplifier and one analog-to-digital converter behind it, the same architecture as the STM32C031C6’s ADC (<a href="ch-adc.html" class="internal" title="Chapter 6: Analog-to-Digital Conversion">Chapter 6</a>), which likewise multiplexes several input channels through one shared converter.  Control logic answers on the SCL and SDA pins, boxed in red (the datasheet prints them SCL/SPC and SDA/SDI/SDO, because the same pins serve SPI).  The lower half is a magnetometer, which we don’t use; the chip also contains a temperature sensor.<div class="autopermalink" aria-hidden="true" data-description="Figure 12.3.13"><a tabindex="-1" href="#fig-lsm303agr-block" title="Copy heading and permalink for Figure 12.3.13" aria-label="Copy heading and permalink for Figure 12.3.13">🔗</a></div></figcaption>

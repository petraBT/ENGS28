<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.4.4<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The four register-access transfers, as the LSM303AGR’s datasheet draws them (§6.1.1) — the accelerometer you meet in <a href="ch-accelerometers.html" class="internal" title="Chapter 12: Accelerometers">Chapter 12</a> — with the sequence written out underneath the two single-byte cases.  ST is the START and SP the STOP; SAD is the device address; SUB is the sub-address, meaning the register number inside the device; SAK is the target’s acknowledge; SR is a repeated START; and MAK and NMAK are the controller’s own acknowledge and final not-acknowledge when it is the one receiving.  A write is device address, register number, then data bytes — and the register number advances by itself for each further byte, which is exactly what the HT16K33’s display data pointer does.  A read needs both directions in one transaction: address and register number going out, then a repeated START to turn the bus around without releasing it, then the device address again with the read bit, and the data coming back.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.4.4"><a tabindex="-1" href="#fig-i2c-transfer-pattern" title="Copy heading and permalink for Figure 10.4.4" aria-label="Copy heading and permalink for Figure 10.4.4">🔗</a></div></figcaption>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.13<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The HT16K33’s display RAM, from its datasheet: sixteen bytes, two per common line.  The left column names the common line — the chip drives eight of them, COM0 to COM7, of which our display uses the first five: COM0 for the first digit, COM1 for the second digit, COM2 for the colon, COM3 for the third and COM4 for the fourth digit. The two hexadecimal addresses beside each COM entry hold that line’s sixteen possible LEDs, ROW0 to ROW7 in the first byte and ROW8 to ROW15 in the second.  The lower table gives the bit order within a byte: the upper row is the even address, D7 down to D0 mapping to ROW7 down to ROW0, and the lower one is the odd address, mapping to ROW15 down to ROW8. The arrows mark which COM line is which position on the display, and the box around COM0’s pair is digit 1’s two bytes.  A seven-segment digit uses only the first eight rows, so for us the second byte of every pair is always 0 — and so only the even addresses 0x00, 0x02, 0x04, 0x06 and 0x08 are the five that carry anything.  The segment map on the left is the same one you used yesterday, with <code class="code-inline tex2jax_ignore">g</code> highlighted to match the boxed 6 in the bit-order table: bit 6 of a digit’s byte is segment <code class="code-inline tex2jax_ignore">g</code>.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.13"><a tabindex="-1" href="#fig-display-ram-map" title="Copy heading and permalink for Figure 10.3.13" aria-label="Copy heading and permalink for Figure 10.3.13">🔗</a></div></figcaption>
</figure><span class="incontext"><a class="internal" href="subsec-day10-ram.html#fig-display-ram-map">In Context</a></span>

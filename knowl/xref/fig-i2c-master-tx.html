<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.25<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>RM0490’s transfer diagram for a controller writing two bytes with automatic end mode, with the parts named.  The setup step programs the address, the byte count and AUTOEND and sets START; the hardware then puts the START condition, the address and the R/W bit on the wire and collects the ACK.  TXIS rises once per byte, each time the transmit data register is free — that is the flag <code class="code-inline tex2jax_ignore">i2c1_byteWrite()</code> waits on before writing <code class="code-inline tex2jax_ignore">I2C1-&gt;TXDR</code>.  NBYTES holds the programmed count — 2 for the whole of this transfer — and once that many bytes have gone out, AUTOEND puts the STOP on the wire without any further help from the program.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.25"><a tabindex="-1" href="#fig-i2c-master-tx" title="Copy heading and permalink for Figure 10.3.25" aria-label="Copy heading and permalink for Figure 10.3.25">🔗</a></div></figcaption>

<figcaption><span class="type">Figure</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">10.3.5<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>The internal wiring of the four-digit display, from its datasheet.  Every segment of the display is an LED.  Reading down: the eight LEDs of each digit share one cathode, brought out on the pin marked (COM) above that digit — pins 14, 11, 10 and 6, with pin 7 serving the colon’s two LEDs.  Reading across: all four <code class="code-inline tex2jax_ignore">a</code> anodes are connected together and brought out on one pin, and likewise for <code class="code-inline tex2jax_ignore">b</code> through <code class="code-inline tex2jax_ignore">g</code> and <code class="code-inline tex2jax_ignore">DP</code> — the eight pins along the bottom, 13, 9, 4, 2, 1, 12, 5 and 3 — with pin 8 for the colon.  Five cathode pins and nine anode pins is 14 wires for 34 LEDs.  The datasheet prints the segments as capitals; we write them lowercase, as <a href="subsec-day9x-one-digit.html#fig-segment-map" class="xref" data-knowl="./knowl/xref/fig-segment-map.html" data-reveal-label="Reveal" data-close-label="Close" title="Figure 10.1.24">Figure 10.1.24</a> does.<div class="autopermalink" aria-hidden="true" data-description="Figure 10.3.5"><a tabindex="-1" href="#fig-four-digit-wiring" title="Copy heading and permalink for Figure 10.3.5" aria-label="Copy heading and permalink for Figure 10.3.5">🔗</a></div></figcaption>
